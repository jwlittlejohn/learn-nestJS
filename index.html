      minutes: 14,
      summary: "Predict how concurrent transactions interact in Postgres and prevent lost updates, deadlocks and vacuum stalls.",
      cards: [
        {
          h: "MVCC: an UPDATE writes a new row version",
          body: "<p>Every row version (tuple) carries hidden system columns: <code>xmin</code>, the transaction that created it, and <code>xmax</code>, the one that deleted or replaced it. An UPDATE never overwrites in place. It writes a new tuple and stamps the old one's <code>xmax</code>. A DELETE only stamps <code>xmax</code>.</p><p>A snapshot records which transactions had committed when it was taken. A tuple is visible if its <code>xmin</code> committed before the snapshot and its <code>xmax</code> did not. So a reader always finds a version it may see, and never waits for a writer. Writers don't wait for readers either. Writers wait only for other writers on the same row.</p><p>Oracle rebuilds old versions from undo segments. Postgres keeps them in the table itself, which is why it needs VACUUM.</p>",
          code: `SELECT xmin, xmax, ctid, status
FROM work_order WHERE id = 42;
--  xmin  | xmax | ctid  | status
--  90211 |    0 | (7,3) | OPEN

UPDATE work_order SET status = 'DONE' WHERE id = 42;

SELECT xmin, xmax, ctid, status
FROM work_order WHERE id = 42;
--  90215 |    0 | (7,9) | DONE   <- new tuple, new place`,
          lang: "sql"
        },
        {
          h: "Isolation levels, the Postgres way",
          body: "<ul><li><strong>READ COMMITTED</strong> (default): each statement takes a fresh snapshot, so two SELECTs in one transaction can disagree. If an UPDATE finds its target row changed by a concurrent transaction, it waits for that one to finish, then re-checks its WHERE against the newest version.</li><li><strong>REPEATABLE READ</strong>: one snapshot for the whole transaction. Updating a row someone else changed since raises SQLSTATE <code>40001</code>.</li><li><strong>SERIALIZABLE</strong>: also tracks read/write dependencies between transactions and raises <code>40001</code> when it sees a pattern that could produce a result no one-at-a-time order would.</li></ul><p>READ UNCOMMITTED behaves as READ COMMITTED; there are no dirty reads. A <code>40001</code> or a deadlock (<code>40P01</code>) means: roll back and rerun the whole transaction.</p>",
          code: `import { DataSource, EntityManager } from 'typeorm';

export async function withRetry<T>(
  ds: DataSource,
  work: (em: EntityManager) => Promise<T>,
): Promise<T> {
  for (let attempt = 1; ; attempt++) {
    try {
      return await ds.transaction('SERIALIZABLE', work);
    } catch (e: any) {
      const code = e?.driverError?.code ?? e?.code;
      const retryable = code === '40001' || code === '40P01';
      if (!retryable || attempt >= 3) throw e;
    }
  }
}`,

          h: "Lost updates, and three fixes",
          body: "<p>Read-modify-write in the app loses updates under READ COMMITTED: two requests load <code>hours = 5</code>, both save 7, one increment vanishes. Fixes:</p><ol><li>Let SQL do the arithmetic: <code>SET hours = hours + $1</code>. The row lock plus the re-check makes it safe.</li><li>Pessimistic: <code>SELECT … FOR UPDATE</code> inside the transaction locks the row until commit. Add <code>NOWAIT</code> to fail instead of waiting.</li><li>Optimistic: a version column checked in the UPDATE's WHERE. Zero rows updated means someone else won.</li></ol>",

WHERE id = $2

        {
          h: "Job queues with `SKIP LOCKED`",
          body: "<p>Several workers claiming jobs with plain <code>FOR UPDATE</code> all pick the same first rows, and every worker but one waits on the first worker's locks. <code>SKIP LOCKED</code> makes each worker pass over rows another transaction has locked, so concurrent workers get different jobs without blocking.</p><p>If a worker crashes, its transaction aborts and its rows unlock on their own. The catch: the transaction stays open while the job runs, which holds locks and an old snapshot (next card). For long jobs, claim and commit first (set <code>status = 'RUNNING'</code> with a lease time), then process.</p>",

SELECT id, payload
FROM job
WHERE status = 'PENDING'
ORDER BY id
LIMIT 10
FOR UPDATE SKIP LOCKED;

          h: "Deadlocks and lock ordering",
          body: "<p>Transaction A locks asset 1, then wants asset 2. Transaction B locked asset 2 and now wants asset 1. Each waits on the other forever. Postgres checks for such cycles after <code>deadlock_timeout</code> (1 second by default), aborts one transaction with SQLSTATE <code>40P01</code>, and lets the other proceed.</p><p>The fix is consistent ordering: every code path locks rows in the same order, usually by primary key. With <code>ORDER BY … FOR UPDATE</code>, rows are locked in the sorted order. Keep transactions short so lock windows stay small, and retry the victim.</p>",

WHERE id = ANY($1)
ORDER BY id
FOR UPDATE;`,

          explain: "<p>The atomic UPDATE reads and writes under one row lock, and the second writer re-reads the committed value before adding. A READ COMMITTED transaction alone changes nothing. FOR SHARE lets both callers hold a shared lock, then both try to upgrade it to update the row, which ends in a deadlock.</p>"

      id: "pg-5",
      title: "JSONB, search and power features",
      zone: 2,
      minutes: 14,
      summary: "Use jsonb, bilingual full-text search, arrays, enums and LISTEN/NOTIFY where they fit, and real columns where they don't.",
      cards: [
        {
          h: "`jsonb`, not `json`",
          body: "<p><code>json</code> stores the input text verbatim: whitespace, key order, duplicate keys. Every operation re-parses it. <code>jsonb</code> parses once into a binary structure: duplicate keys collapse (the last one wins), keys are stored in an internal order you shouldn't rely on, and lookups don't re-parse. Only <code>jsonb</code> supports containment operators and GIN indexes. Use <code>jsonb</code> unless you must preserve the exact original text.</p><p>Hibernate 6 maps JSON with <code>@JdbcTypeCode</code>; TypeORM takes a column type, and node-postgres parses jsonb into plain objects for you.</p>",
          bridge: {
            left: { label: "JPA (Hibernate 6)", lang: "java", code: `@Entity
class Asset {
  @Id Long id;

  @Column(nullable = false)

  @JdbcTypeCode(SqlTypes.JSON)
  @Column(columnDefinition = "jsonb")
  Map<String, Object> attrs;
}` },

export class Asset {
  @PrimaryGeneratedColumn()
  id: number;

  @Column()

  attrs: Record<string, unknown>;
}` }
          }

        {
          h: "Operators you'll use",
          body: "<ul><li><code>-&gt;</code> returns a <code>jsonb</code> value; <code>-&gt;&gt;</code> returns <code>text</code>. Cast text before comparing numbers: <code>(attrs -&gt;&gt; 'voltage')::int</code>.</li><li><code>#&gt;&gt;</code> follows a path and returns text.</li><li><code>@&gt;</code> tests containment: does the left document contain the right one?</li><li><code>?</code> tests whether a top-level key exists.</li><li>SQL/JSON path: <code>jsonb_path_query</code> returns matches; <code>@?</code> and <code>@@</code> test a path in a WHERE.</li></ul>",
          code: `SELECT attrs -> 'rating'           AS rating_jsonb,
       attrs ->> 'serial'          AS serial_text,
       (attrs ->> 'voltage')::int  AS volts,
       attrs #>> '{calib,due}'     AS calib_due
FROM asset
WHERE attrs @> '{"type": "generator"}'
  AND attrs ? 'serial';

SELECT jsonb_path_query(attrs, '$.parts[*] ? (@.qty < 2)')
FROM asset
WHERE id = $1;`,
          lang: "sql",
          tip: "<p>In JDBC, the <code>?</code> operator collides with the parameter placeholder; PgJDBC lets you write <code>??</code> instead. node-postgres uses <code>$1</code>, so a bare <code>?</code> is fine there.</p>"
        },
        {
          h: "Indexing jsonb, and when to use columns",
          body: "<p>A GIN index maps every key and value inside the documents to the rows that contain them, like the index at the back of a book. The default <code>jsonb_ops</code> class serves <code>@&gt;</code>, <code>?</code> and path tests; <code>jsonb_path_ops</code> is smaller and serves <code>@&gt;</code> and path tests only. Neither helps <code>attrs -&gt;&gt; 'serial' = $1</code>; that needs a B-tree expression index.</p><p>Use jsonb for sparse or variable attributes: per-equipment-type specs, form answers. Use real columns for anything you filter, join, constrain or report on. jsonb keys get no foreign keys, no per-key NOT NULL, and only rough planner estimates.</p>",
          code: `CREATE INDEX ix_asset_attrs
  ON asset USING gin (attrs jsonb_path_ops);
-- serves: WHERE attrs @> '{"type": "generator"}'

CREATE INDEX ix_asset_serial
  ON asset ((attrs ->> 'serial'));
-- serves: WHERE attrs ->> 'serial' = $1

-- or promote the key to a real column
ALTER TABLE asset ADD COLUMN serial text
  GENERATED ALWAYS AS (attrs ->> 'serial') STORED;`,
          lang: "sql",
          tip: "<p>A stored generated column is computed on every write and can't be written directly. Adding one to an existing table computes it for every row, which rewrites the table.</p>"
        },
        {
          h: "Full-text search: how matching works",
          body: "<p><code>to_tsvector(config, text)</code> splits text into tokens, lower-cases them, drops stop words and stems each word to a <em>lexeme</em>, keeping positions. A query goes through the same stemming, so <em>failures</em> and <em>failure</em> both become <code>failur</code>. <code>@@</code> tests a match; <code>ts_rank</code> scores it.</p><ul><li><code>to_tsquery</code> takes operator syntax (<code>&amp;</code>, <code>|</code>, <code>!</code>) and raises errors on malformed input.</li><li><code>plainto_tsquery</code> ANDs the words.</li><li><code>websearch_to_tsquery</code> accepts search-box input: quoted phrases, <code>or</code>, <code>-word</code>. It doesn't raise syntax errors, so it suits user input.</li></ul><p>The document and the query must use the same configuration, or the stems won't line up.</p>",
          code: `SELECT to_tsvector('english',
  'Inspections were delayed by the pump failures');
-- 'delay':3 'failur':7 'inspect':1 'pump':6

SELECT to_tsvector('english', 'Pump failures on site 4')
  @@ websearch_to_tsquery('english', 'pump failure');
-- true: both sides stem to 'pump' and 'failur'`,

          h: "Bilingual search: one vector per language",
          body: "<p>Postgres ships <code>english</code> and <code>french</code> configurations with their own stop words and stemmers. In a bilingual federal app where content exists in both official languages, keep one <code>tsvector</code> per language, each built with its own configuration, and search the one matching the user's UI language.</p><p>A stored generated column keeps the vector in step with the text, and a GIN index makes <code>@@</code> fast. The two-argument <code>to_tsvector</code> is immutable, which generated columns require.</p>",
          code: `ALTER TABLE procedure_doc
  ADD COLUMN search_en tsvector GENERATED ALWAYS AS (
    to_tsvector('english', coalesce(title_en, '')
      || ' ' || coalesce(body_en, ''))) STORED,
  ADD COLUMN search_fr tsvector GENERATED ALWAYS AS (
    to_tsvector('french', coalesce(title_fr, '')
      || ' ' || coalesce(body_fr, ''))) STORED;

CREATE INDEX ix_doc_en ON procedure_doc USING gin (search_en);
CREATE INDEX ix_doc_fr ON procedure_doc USING gin (search_fr);

SELECT id, title_fr, ts_rank(search_fr, q) AS rank
FROM procedure_doc,
     websearch_to_tsquery('french', $1) AS q

        {
          h: "Arrays, and enums vs lookup tables",
          body: "<p><strong>Arrays</strong> are typed lists in one column, with GIN support for <code>@&gt;</code> and <code>&amp;&amp;</code>. Good for tags. Their elements can't have foreign keys, so don't model relationships with them. node-postgres converts a JS array to a Postgres array, so <code>id = ANY($1)</code> replaces building an IN list.</p><p><strong>Enums</strong> are compact and ordered by declaration. Adding a value is easy and renaming works, but there is no way to drop one: you create a new type and convert every column that uses it. TypeORM <code>type: 'enum'</code> columns become Postgres enum types with the same limits. A lookup table with a foreign key is easier to evolve, and can carry English and French labels.</p>",

ALTER TYPE wo_status ADD VALUE 'CANCELLED';
-- there is no DROP VALUE

CREATE TABLE wo_status_ref (

ALTER TABLE asset ADD COLUMN tags text[] NOT NULL DEFAULT '{}';

SELECT id FROM asset WHERE id = ANY($1);  -- $1: a JS array`,

          h: "LISTEN/NOTIFY in brief",
          body: "<p>A session runs <code>LISTEN channel</code>; another calls <code>pg_notify(channel, payload)</code>. Postgres delivers the notification to every listening session <strong>when the sending transaction commits</strong>, and drops it on rollback. Payloads are short strings (under 8000 bytes by default). In node-postgres, a dedicated client receives them through its <code>notification</code> event.</p><p>Notifications are not stored. A listener that is disconnected, during a failover or a deploy, misses them for good. Use them as a hint (\"something changed, re-check\"), such as cache invalidation, and keep durable work in a table or a queue service.</p>",
          code: `-- session A: a dedicated, long-lived connection
LISTEN work_order_changed;

-- session B
BEGIN;
UPDATE work_order SET status = 'DONE' WHERE id = 42;
SELECT pg_notify('work_order_changed', '42');
COMMIT;  -- A receives it now`,
          lang: "sql",
          tip: "<p>LISTEN needs one connection that stays put. It doesn't work through a pooled client that goes back to the pool, or through a transaction-mode pooler such as PgBouncer.</p>"

    {
      id: "pg-6",
      title: "Migrations without downtime",
      zone: 3,
      minutes: 15,
      summary: "Plan schema changes that stay compatible during rolling deploys and avoid long table locks.",
      cards: [
        {
          h: "Two app versions, one schema",
          body: "<p>A rolling deploy replaces app tasks gradually. Migrations usually run first, so for several minutes the <strong>old</strong> version serves traffic against the <strong>new</strong> schema. If you roll the code back, the old version meets the new schema again. Every migration must work with the version before it and the version after it.</p><p>The ORM sharpens this. TypeORM lists every mapped column by name in its SELECTs and INSERTs, like Hibernate does. A column the old version doesn't know about is harmless. A column it still maps but which was renamed or dropped makes its queries fail.</p>",
          tip: "<p>A new <code>NOT NULL</code> column without a default breaks the old version's INSERTs, because it doesn't supply the value. Give the column a default, or add NOT NULL in a later release.</p>"
        },
        {
          h: "Expand, then contract",
          body: "<p>Never change a column in place while old code depends on it. Renaming <code>assigned_to</code> to <code>assignee_id</code> becomes a sequence of releases:</p><ol><li><strong>Expand</strong>: add <code>assignee_id</code>, nullable. Deploy code that writes both columns and still reads the old one.</li><li><strong>Backfill</strong> existing rows in batches.</li><li><strong>Switch reads</strong>: deploy code that reads <code>assignee_id</code>. Keep writing both, so rolling back one release is still safe.</li><li>Deploy code that stops writing and mapping <code>assigned_to</code>.</li><li><strong>Contract</strong>: drop <code>assigned_to</code>.</li></ol><p>Each step is backward compatible with the one before. It takes more releases, and each one is boring, which is what you want.</p>"
        },
        {
          h: "Adding columns: what's instant",
          body: "<p>Since Postgres 11, <code>ADD COLUMN</code> with no default, or with a non-volatile default, only changes the catalog. The default is stored once and returned for old rows that don't physically have the column. A <strong>volatile</strong> default such as <code>gen_random_uuid()</code> must differ per row, so Postgres rewrites the whole table under an exclusive lock. So does changing a column's type (<code>integer</code> to <code>bigint</code>). Widening a <code>varchar(n)</code> or changing it to <code>text</code> doesn't rewrite.</p><p>To give existing rows a volatile value: add the column with no default, <code>SET DEFAULT</code> separately (applies to new rows only), then backfill in batches.</p>",
          code: `-- instant: the default is stored in the catalog
ALTER TABLE work_order
  ADD COLUMN priority smallint NOT NULL DEFAULT 3;

-- rewrites every row: volatile default
ALTER TABLE work_order
  ADD COLUMN public_id uuid DEFAULT gen_random_uuid();

-- instant alternative, then backfill in batches
ALTER TABLE work_order ADD COLUMN public_id uuid;
ALTER TABLE work_order
  ALTER COLUMN public_id SET DEFAULT gen_random_uuid();`,
          lang: "sql"
        },
        {
          h: "The lock queue and `lock_timeout`",
          body: "<p>Even an instant <code>ALTER TABLE</code> needs an ACCESS EXCLUSIVE lock for a moment. That lock conflicts with everything, including the ACCESS SHARE lock every SELECT holds. If a long report query, or a session idle in transaction, holds the table, the ALTER waits.</p><p>Lock requests queue in arrival order, and new requests that conflict with a waiting one line up behind it. So every query on that table now waits behind your ALTER, which waits behind the report. The API is down until the report finishes.</p><p>Set <code>lock_timeout</code> so the ALTER gives up after a few seconds (SQLSTATE <code>55P03</code>), then retry later. <code>pg_blocking_pids(pid)</code> shows who is in the way.</p>",
          code: `import { MigrationInterface, QueryRunner } from 'typeorm';

export class AddWoNotes1727700000000
  implements MigrationInterface
{
  async up(q: QueryRunner): Promise<void> {
    // SET LOCAL lasts until this transaction ends
    await q.query("SET LOCAL lock_timeout = '5s'");
    await q.query('ALTER TABLE work_order ADD COLUMN notes text');
  }

  async down(q: QueryRunner): Promise<void> {
    await q.query('ALTER TABLE work_order DROP COLUMN notes');
  }
}`,
          lang: "ts"
        },
        {
          h: "NOT NULL and foreign keys in two steps",
          body: "<p><code>SET NOT NULL</code> scans the whole table while holding an exclusive lock. Adding a foreign key scans too, and blocks writes while it does. Both can be split.</p><p>A constraint added <code>NOT VALID</code> is enforced for new writes immediately but skips checking existing rows, so the ALTER is quick. <code>VALIDATE CONSTRAINT</code> then scans with a weaker lock that lets reads and writes continue. Since Postgres 12, <code>SET NOT NULL</code> skips its scan when a valid CHECK constraint already proves there are no NULLs.</p>",
          code: `ALTER TABLE work_order ADD CONSTRAINT wo_assignee_nn
  CHECK (assignee_id IS NOT NULL) NOT VALID;
-- separate transaction:
ALTER TABLE work_order VALIDATE CONSTRAINT wo_assignee_nn;
-- separate transaction:
ALTER TABLE work_order
  ALTER COLUMN assignee_id SET NOT NULL;  -- no scan now
ALTER TABLE work_order DROP CONSTRAINT wo_assignee_nn;

ALTER TABLE work_order ADD CONSTRAINT wo_assignee_fk
  FOREIGN KEY (assignee_id) REFERENCES app_user (id)
  NOT VALID;
-- separate transaction:
ALTER TABLE work_order VALIDATE CONSTRAINT wo_assignee_fk;`,
          lang: "sql",
          tip: "<p>Run the NOT VALID step and the VALIDATE step in separate transactions. In one transaction, the first step's strong lock is held through the whole validation scan, which defeats the point.</p>"
        },
        {
          h: "`CREATE INDEX CONCURRENTLY` in a migration",
          body: "<p><code>CONCURRENTLY</code> builds the index in two passes over the table and waits for older transactions between them, so writes continue throughout. Postgres needs to commit between phases, which is why it refuses to run inside a transaction block. Migration tools wrap migrations in transactions by default, so you opt out per migration.</p><p>In TypeORM 0.3 that is a <code>transaction = false</code> property on the migration class. Whether the override is honoured depends on the data source's <code>migrationsTransactionMode</code>; if all migrations run in one transaction, check your version's docs for how it treats the override.</p>",
          bridge: {
            left: { label: "Liquibase", lang: "xml", code: `<changeSet id="42" author="jl"
           runInTransaction="false">
  <sql>
    CREATE INDEX CONCURRENTLY ix_wo_status

</changeSet>` },

  implements MigrationInterface
{
  transaction = false;

  async up(q: QueryRunner): Promise<void> {
    await q.query(
      'CREATE INDEX CONCURRENTLY ix_wo_status ' +
        'ON work_order (status)',
    );
  }

  async down(q: QueryRunner): Promise<void> {
    await q.query(
      'DROP INDEX CONCURRENTLY ix_wo_status',
    );
  }
}` }
          },
          tip: "<p>If a concurrent build fails, it leaves an INVALID index behind. <code>IF NOT EXISTS</code> would then skip it silently. Check <code>\\d work_order</code> for INVALID, drop it, and retry.</p>"
        },
        {
          h: "Backfill in batches",
          body: "<p>One <code>UPDATE</code> over 40 million rows writes 40 million new row versions in a single transaction. It holds every row lock until commit, can roughly double the table's size until vacuum catches up, and pushes a burst of WAL that inflates replica lag and backup volume.</p><p>Batch it instead: a few thousand rows per transaction, keyed on the primary key, driven by a script or a job outside the schema migration. Short transactions keep locks brief and let autovacuum reuse space between batches. Pause between batches if replicas fall behind.</p>",
          code: `-- one batch per transaction; the caller
-- advances $1 by 5000 until it passes max(id)
UPDATE work_order w
SET assignee_id = u.id
FROM app_user u
WHERE u.username = w.assigned_to
  AND w.id >  $1
  AND w.id <= $1 + 5000;`,
          lang: "sql"
        }
      ],
      quiz: [
        {

          explain: "<p>A concurrent build commits between its phases, so Postgres forbids it inside an explicit transaction, and TypeORM runs migrations in one by default. Opting that migration out (and checking that your transaction mode allows the override) fixes it. <code>QueryRunner.query</code> runs any SQL, DDL included.</p>"

COMMIT;`,
          lang: "sql",
          answer: 2,
          explain: "<p>The ALTER is instant, but its ACCESS EXCLUSIVE lock lasts until COMMIT. The UPDATE then rewrites every row inside the same transaction, so no one can even SELECT until it finishes. Commit the ALTER alone, then backfill in small batches from a separate job.</p>"

    {
      id: "pg-7",
      title: "Connections, security, operations",
      zone: 3,
      minutes: 15,
      summary: "Size connection pools, lock down roles and rows, and find and recover from problems on a running database.",
      cards: [
        {
          h: "One connection, one process",
          body: "<p>The main <code>postgres</code> process listens for connections and forks a new <strong>backend process</strong> for each one. That process serves only that connection until it closes. Each backend has private memory for catalog and plan caches, plus <code>work_mem</code> for every sort or hash step a query runs, on top of the shared buffer cache. Opening a connection costs a fork, authentication and usually a TLS handshake.</p><p>So <code>max_connections</code> is a hard limit, typically in the hundreds. On RDS its default is derived from the instance's memory. Past it, new connections are refused with <em>too many clients</em> or <em>remaining connection slots are reserved</em>. This is close to Oracle's dedicated server model, and unlike SQL Server's worker threads inside one process.</p>",
          tip: "<p>Idle connections aren't free: each one is a process holding memory. A modest number of busy connections usually serves more traffic than hundreds of mostly idle ones.</p>"
        },
        {
          h: "App-side pools and the math",
          body: "<p>TypeORM's Postgres driver uses a node-postgres <code>Pool</code>; options under <code>extra</code> go straight to it. Its default <code>max</code> is 10. Node runs your code on one thread, and a query is just an awaited socket round trip, so 10 clients serve many concurrent requests.</p><p>The math: every process has its own pool. 4 tasks × 10 = 40 connections. An autoscaling policy that allows 30 tasks with <code>max: 20</code> means 600, plus migrations, admin tools and other services. Size against the maximum task count. Bigger pools rarely help: once active queries exceed what the CPUs can run, extra connections just queue inside the database.</p>",
          bridge: {
            left: { label: "Spring Boot (HikariCP)", lang: "properties", code: `spring.datasource.url=jdbc:postgresql://db:5432/assets
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.idle-timeout=30000` },
            right: { label: "NestJS + TypeORM", lang: "ts", code: `TypeOrmModule.forRoot({
  type: 'postgres',
  host: process.env.DB_HOST,
  database: 'assets',
  // passed to node-postgres' Pool
  extra: {
    max: 10,
    connectionTimeoutMillis: 5000,
    idleTimeoutMillis: 30000,
  },
});` }
          },
          tip: "<p>node-postgres defaults <code>connectionTimeoutMillis</code> to 0, which means wait forever for a free client. Set it so a saturated pool fails fast instead of hanging requests.</p>"
        },
        {
          h: "PgBouncer and RDS Proxy",
          body: "<p>An external pooler multiplexes many client connections onto a few server connections. In <strong>session</strong> mode a client keeps one server connection until it disconnects, which gains little over an app pool. In <strong>transaction</strong> mode the server connection returns to the pooler after every transaction, so the next transaction may run on a different backend.</p><p>That breaks anything relying on session state between transactions: plain <code>SET</code>, session advisory locks, <code>LISTEN</code>, temporary tables, and named prepared statements unless the pooler tracks them (recent PgBouncer versions can).</p><p>RDS Proxy is AWS's managed pooler, using Secrets Manager or IAM for credentials. When it detects session state it <em>pins</em> that client to one database connection, which quietly reduces the multiplexing you were paying for.</p>",
          tip: "<p><code>SET LOCAL</code> and <code>set_config(name, value, true)</code> end with the transaction, so they are safe behind a transaction-mode pooler.</p>"
        },
        {
          h: "Roles and least privilege",
          body: "<p>Users and groups are both <em>roles</em>. The owner of a table can alter or drop it and, by default, bypasses row-level security. So split the duties: an owner role that runs migrations from the pipeline, and a runtime role with data access only. A SQL injection or a bug in the app then can't drop a table.</p><p><code>ON ALL TABLES IN SCHEMA</code> covers tables that exist now. <code>ALTER DEFAULT PRIVILEGES</code> covers tables created later, but only by the role named in <code>FOR ROLE</code>. If migrations run as a different role, new tables get no grants. With <code>serial</code> columns the app role also needs <code>USAGE</code> on the sequences.</p>",
          code: `-- owns the objects, runs migrations
CREATE ROLE app_owner LOGIN;
-- runtime: data only, no DDL
CREATE ROLE app_rw LOGIN;

GRANT USAGE ON SCHEMA app TO app_rw;
GRANT SELECT, INSERT, UPDATE, DELETE
  ON ALL TABLES IN SCHEMA app TO app_rw;

-- tables app_owner creates from now on
ALTER DEFAULT PRIVILEGES FOR ROLE app_owner
  IN SCHEMA app
  GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO app_rw;`,
          lang: "sql",
          tip: "<p>The RDS master user has <code>rds_superuser</code>, not true superuser. Keep it for administration; never put it in the app's configuration.</p>"
        },
        {
          h: "Row-Level Security for need-to-know",
          body: "<p>With RLS enabled, Postgres adds each applicable policy's <code>USING</code> expression to every query against the table, as if you had written it in the WHERE. <code>WITH CHECK</code> validates rows being inserted or updated. A table with RLS enabled and no policies shows no rows. It is the same idea as Oracle's Virtual Private Database.</p><p>The app sets the caller's context per request, inside the request's transaction, with <code>set_config(…, true)</code>, the parameter-friendly form of <code>SET LOCAL</code>. <code>current_setting(name, true)</code> returns NULL instead of erroring when nothing is set, so the policy fails closed.</p><p>Owners bypass RLS unless the table has <code>FORCE ROW LEVEL SECURITY</code>; superusers and <code>BYPASSRLS</code> roles always do. Treat RLS as defence in depth behind the app's own checks.</p>",
          code: `ALTER TABLE work_order ENABLE ROW LEVEL SECURITY;

CREATE POLICY wo_by_unit ON work_order
  USING (unit_id = nullif(
    current_setting('app.unit_id', true), '')::bigint)
  WITH CHECK (unit_id = nullif(
    current_setting('app.unit_id', true), '')::bigint);

-- per request, inside its transaction:
SELECT set_config('app.unit_id', $1, true);`,
          lang: "sql"
        },
        {
          h: "Seeing what the database is doing",
          body: "<ul><li><code>pg_stat_activity</code>: one row per backend, with its state (<code>active</code>, <code>idle</code>, <code>idle in transaction</code>), current or last query, wait event and transaction start. Roughly Oracle's <code>v$session</code>.</li><li><code>pg_stat_statements</code>: totals per normalized query since the last reset: calls, total and mean time, rows, buffer hits and reads. It needs the library preloaded (usual on RDS) and <code>CREATE EXTENSION pg_stat_statements</code>.</li><li><code>log_min_duration_statement = 500</code> logs every statement slower than 500 ms. On RDS, set it in the parameter group and export logs to CloudWatch.</li></ul><p><code>pg_cancel_backend(pid)</code> cancels a running query; <code>pg_terminate_backend(pid)</code> ends the session.</p>",
          code: `-- what's running now, oldest transaction first
SELECT pid, usename, state, wait_event_type,
       now() - xact_start AS xact_age,
       left(query, 60) AS query
FROM pg_stat_activity
WHERE state <> 'idle'
ORDER BY xact_start;

-- where the time goes overall
SELECT calls,
       round(total_exec_time) AS total_ms,
       round(mean_exec_time::numeric, 1) AS mean_ms,
       left(query, 60) AS query
FROM pg_stat_statements
ORDER BY total_exec_time DESC
LIMIT 10;`,
          lang: "sql"
        },
        {
          h: "Backups: logical vs physical",
          body: "<p><code>pg_dump</code> is a <strong>logical</strong> backup: a consistent snapshot of one database as SQL or an archive. It is portable across versions and platforms, and restoring rebuilds every index, so it is slow for large databases. It can only restore to the moment of the dump.</p><p>A <strong>physical</strong> backup copies the data files; with the write-ahead log (WAL) archived continuously, you restore the base copy and replay WAL to any moment: point-in-time recovery. RDS automated backups work this way: daily snapshots plus transaction logs, restorable to any point in the retention window, into a <em>new</em> instance.</p><p>Most federal workloads also care where the copies live: encrypted, and in a Canadian region unless your security assessment says otherwise.</p>",
          code: `# logical copy of one database, custom format
pg_dump -Fc -d assets -f assets.dump
pg_restore -d assets_copy --no-owner assets.dump`,
          lang: "bash",
          tip: "<p>A backup you have never restored is a hope. Rehearse a point-in-time restore and time it before you need one.</p>"
        }
      ],
      quiz: [
        {
          id: "pg-7-q1", type: "mcq",
          q: "Each ECS task runs one Node process with TypeORM <code>extra: { max: 20 }</code>. Normal load is 6 tasks; autoscaling allows up to 30. The RDS instance's <code>max_connections</code> is 400. What happens at peak?",

        },
        {
          id: "pg-7-q3", type: "order",
          q: "Order the hops for one repository query from a NestJS task to Postgres behind RDS Proxy.",
          items: [
            "TypeORM builds the SQL and parameter list",
            "The node-postgres Pool lends a client, or waits for one",
            "RDS Proxy maps the client onto a database connection",
            "A Postgres backend process parses, plans and executes",
            "Rows return and the client goes back to the pool"
          ],
          explain: "<p>Waits can happen at three places: in the app pool when all clients are lent out, in the proxy when its database connections are busy or pinned, and inside Postgres on locks. Knowing the order tells you where to look when requests stall.</p>"
        },
        {
          id: "pg-7-q4", type: "mcq",
          q: "RLS policies are enabled on <code>work_order</code>, yet in testing every user sees every row. The app connects as <code>app_owner</code>, the role that ran the migrations. Why?",

            "Policies apply only inside explicit transactions",
            "RLS takes effect after the next ANALYZE on the table",
            "current_setting reads the first session's value"

          answer: 0,
          explain: "<p>The owner isn't subject to its table's policies unless you run <code>ALTER TABLE work_order FORCE ROW LEVEL SECURITY</code>. The better fix is a separate runtime role that owns nothing, which also takes DDL rights away from the app.</p>"
        },

          id: "pg-7-q5", type: "mcq",
          q: "You want the query that has consumed the most total database time since stats were last reset. Where do you look?",

            "pg_stat_statements, ordered by total_exec_time",
            "pg_stat_activity, ordered by query_start",

      cards: [
        {

          body: `<p>An AWS account is a hard isolation boundary. Resources, IAM identities, service quotas and the bill all belong to one account. Nothing in one account can touch another unless policies on both sides explicitly allow it.</p><p>So teams run separate accounts per environment (dev, test, prod) plus shared accounts for logging, security tooling and CI. <strong>AWS Organizations</strong> groups them into organizational units (OUs). <strong>Service control policies</strong> (SCPs) attached to an OU cap what any identity in those accounts can do, administrators included. An SCP grants nothing by itself; it only limits.</p><p>A <strong>landing zone</strong> (often built with AWS Control Tower) is this multi-account setup delivered pre-wired: central logging, guardrail SCPs, single sign-on. In a federal department a platform team usually owns it and vends accounts to project teams.</p>`,
          tip: `<p>Gotcha: "I'm admin in dev but get AccessDenied" is often an SCP. Many AccessDenied messages now name the policy type that blocked the call, so read the whole message.</p>`

        {
          h: "Regions and Availability Zones",
          body: `<p>A <strong>Region</strong> is a separate geographic deployment of AWS with its own service endpoints, for example <code>ca-central-1</code> (Canada Central, Montreal) and <code>ca-west-1</code> (Canada West, Calgary). Most services are regional: a VPC or RDS instance in <code>ca-central-1</code> doesn't exist anywhere else.</p><p>Each Region contains several <strong>Availability Zones</strong>. An AZ is one or more data centres with independent power, cooling and networking, linked to the other AZs by low-latency fibre. High availability comes from spreading copies across AZs: two ECS tasks in two AZs, an RDS standby in another AZ.</p><p>A few services are global or run at edge locations: IAM, CloudFront, Route 53. Federal workloads usually keep data in the Canadian Regions; check your project's security requirements for how global services are treated.</p>`,
          tip: `<p>Tip: the CLI and SDKs pick a Region from <code>AWS_REGION</code> or your profile. A resource that seems to have vanished is often just in another Region.</p>`
        },
        {
          h: "How AWS decides allow or deny",
          body: `<p>Every API call is signed (SigV4) with credentials that belong to a <strong>principal</strong>: an IAM user, an IAM role session, or an AWS service. AWS verifies the signature, collects every policy that applies to the request, and evaluates them together:</p><ol><li>Start from an implicit <strong>deny</strong>.</li><li>A matching <code>"Effect": "Deny"</code> in any policy ends it. Explicit deny always wins.</li><li>Guardrails (SCPs, permission boundaries) must also allow the action.</li><li>An <code>Allow</code> in an identity-based or resource-based policy grants it. Across accounts, both sides must allow.</li></ol><p><strong>Identity-based</strong> policies attach to a user or role and say what it may do. <strong>Resource-based</strong> policies attach to a resource (an S3 bucket policy, a KMS key policy, a role's trust policy) and name who may use it in a <code>Principal</code> element.</p>`

          body: `<p>A <strong>VPC</strong> is a private network in one Region with an IPv4 CIDR block, for example <code>10.20.0.0/16</code> (65,536 addresses). You carve it into <strong>subnets</strong>, and each subnet lives in exactly one AZ. For high availability you create matching subnets in two or three AZs.</p><p>AWS reserves five addresses in every subnet (the first four and the last), so a <code>/24</code> gives you 251. Every Fargate task takes its own IP from its subnet, so size app subnets for peak task count plus deployments, which briefly run old and new tasks side by side.</p>`,

          body: `<p>A subnet has no "public" flag. The difference is its <strong>route table</strong>. Every route table has a <code>local</code> route for the VPC CIDR, so all subnets can reach each other. A subnet is <strong>public</strong> when its table also sends <code>0.0.0.0/0</code> to an <strong>internet gateway</strong>. A resource there still needs a public IP to be reachable, because the internet gateway only translates for interfaces that have one.</p><p>A <strong>private</strong> subnet sends <code>0.0.0.0/0</code> to a NAT gateway. An <strong>isolated</strong> subnet has only the local route.</p>`,

app-rt-a    (ECS task subnet, AZ a)

  0.0.0.0/0      nat-0e4f5a6b   (NAT in AZ a public subnet)

db-rt       (RDS subnets)
  10.20.0.0/16   local`,

          h: "NAT gateways: outbound only, and not free",
          body: `<p>A <strong>NAT gateway</strong> sits in a public subnet with an Elastic IP. Tasks in private subnets send internet-bound traffic to it; it rewrites the source address to its own and tracks the connection so replies find their way back. Nothing on the internet can open a connection inward through it.</p><p>You pay per NAT gateway per hour and per gigabyte processed. A NAT gateway lives in one AZ, so the resilient pattern is one per AZ, with each private route table pointing at the NAT in its own AZ. Image pulls, AWS API calls and log shipping all flow through NAT unless you add VPC endpoints, and that data charge adds up.</p>`,

          body: `<p>A <strong>security group</strong> (SG) is a stateful firewall on each network interface: every Fargate task, ALB node and RDS instance has one. Rules only allow, and anything not allowed is dropped. SGs track connections, so replies are allowed automatically.</p><p>A rule's source can be another SG. "Allow 5432 from <code>app-sg</code>" means from any interface carrying <code>app-sg</code>, whatever its IP. That's the break from IP-based firewall rules, and it's how you chain tiers while tasks come and go: the ALB SG allows 443 from clients, the app SG allows 3000 from the ALB SG, the DB SG allows 5432 from the app SG.</p><p><strong>Network ACLs</strong> are subnet-level, stateless, ordered allow and deny rules. Most teams leave the default allow-all NACLs alone.</p>`,

          h: "VPC endpoints keep AWS traffic private",
          body: `<p>By default, tasks in private subnets reach AWS services through their public endpoints, which means through NAT. <strong>VPC endpoints</strong> give them a private path.</p><ul><li><strong>Gateway endpoints</strong> (S3 and DynamoDB only) are route table entries. No hourly charge.</li><li><strong>Interface endpoints</strong> (PrivateLink) place an ENI with a private IP in your subnets. With private DNS on, the normal hostname, such as <code>secretsmanager.ca-central-1.amazonaws.com</code>, resolves to that IP, so the SDK needs no changes. Charged per hour per AZ plus data.</li></ul><p>A Fargate service with no NAT at all typically needs <code>ecr.api</code> and <code>ecr.dkr</code> interface endpoints, the S3 gateway endpoint (ECR stores image layers in S3), <code>logs</code>, and <code>secretsmanager</code> or <code>ssm</code> if the task uses secrets.</p>`,

      cards: [
        {
          h: "ECS in on-prem terms",
          body: `<p>ECS has four nouns. A <strong>cluster</strong> is a namespace for services. A <strong>task definition</strong> is a versioned JSON blueprint (<code>wo-api:17</code>): image, CPU and memory, ports, env, secrets, logging, IAM roles. A <strong>task</strong> is one running copy. A <strong>service</strong> keeps N tasks running, registers them with a load balancer target group, and replaces them during deployments or when they fail.</p><p><strong>Fargate</strong> is the launch type where AWS supplies the compute. There are no instances to patch or scale. Each task gets its own isolation boundary (no shared kernel with other tasks) and its own ENI in your subnet.</p><p>The analogy breaks at mutation. You never patch or redeploy into a running task; every change is a new task definition revision and fresh tasks.</p>`,

        {
          h: "Execution role vs task role",
          body: `<p>A task definition names two roles, and mixing them up is the most common ECS permission bug.</p><ul><li>The <strong>task execution role</strong> is used by ECS on your behalf, before and around your container: pull the image from ECR, fetch the values in <code>secrets</code>, write logs. The managed policy <code>AmazonECSTaskExecutionRolePolicy</code> covers ECR and Logs. Secrets access, and <code>kms:Decrypt</code> for a customer managed key, you add yourself.</li><li>The <strong>task role</strong> is what your code gets. The AWS SDK in the container picks up its credentials from the container credentials endpoint. S3, SQS and other runtime calls go here.</li></ul><p>The symptoms differ. An execution role problem stops the task before your code runs (<code>ResourceInitializationError</code>, <code>CannotPullContainerError</code>). A task role problem shows up as AccessDenied in your own logs.</p>`,

          body: `<p>The service registers each task's IP and port in an ALB <strong>target group</strong>. The ALB probes a path such as <code>/health</code>; after enough consecutive failures it marks the target unhealthy, and ECS stops that task and starts a replacement.</p><p>A rolling deployment with the defaults (minimum healthy 100%, maximum 200%) starts new tasks, waits for them to pass health checks, then drains and stops the old ones. The <strong>deployment circuit breaker</strong> notices new tasks that keep failing, marks the deployment failed and, with <code>rollback</code> on, returns to the last working revision. Set a health check grace period if Nest boots slowly.</p><p>ALB errors point at causes: 503 usually means no registered targets, 502 a connection the target closed or a malformed response, 504 a target that didn't answer in time.</p>`,

          body: `<p><code>vite build</code> produces <code>index.html</code> plus content-hashed files under <code>assets/</code>. Those go into a private S3 bucket. A <strong>CloudFront</strong> distribution sits in front: it terminates TLS at edge locations, caches responses, and fetches from S3 on a cache miss.</p><p>Routing lives in <strong>behaviours</strong>: a path pattern mapped to an origin plus cache and request policies. The default behaviour (<code>*</code>) goes to S3; you can add <code>/api/*</code> pointing at the ALB.</p><p>Skip S3 static website hosting. Its endpoint needs a public bucket and can't use Origin Access Control. Use the bucket's regular REST endpoint, keep Block Public Access on, and let only CloudFront read.</p>`,

    {
      id: "aws-5",
      title: "RDS for PostgreSQL",
      zone: 2,
      minutes: 14,
      summary: "Choose between RDS and Aurora, set up availability, backups, encryption and parameters, and connect Nest in a way that survives failover and password rotation.",
      cards: [
        {
          h: "RDS for PostgreSQL or Aurora PostgreSQL",
          body: `<p><strong>RDS for PostgreSQL</strong> runs community Postgres on a managed instance with block storage (EBS). Replication and failover work at the instance and storage level, much like a primary and standby you'd run yourself.</p><p><strong>Aurora PostgreSQL</strong> keeps Postgres's query layer but replaces the storage engine with a distributed cluster volume that keeps six copies of your data across three AZs. The writer and up to 15 readers share that volume, so readers don't replay a copy of the data and usually lag well under a second. Failover promotes a reader and is typically faster.</p><p>Trade-offs: Aurora usually costs more at small, steady sizes, bills I/O separately unless you choose I/O-Optimized, and ships new Postgres major versions after the community does. Check which your team runs; the connection code is the same.</p>`
        },
        {
          h: "Multi-AZ for availability, replicas for reads",
          body: `<p>A <strong>Multi-AZ</strong> instance deployment keeps a <strong>synchronous</strong> standby in another AZ: a write is committed only once both copies have it. You can't query the standby. On failure or during some maintenance, RDS promotes it and repoints the endpoint's DNS name, typically within one to two minutes. Your app sees dropped connections and must reconnect.</p><p>A <strong>read replica</strong> uses <strong>asynchronous</strong> streaming replication. It has its own endpoint, serves reads, and trails the primary by some amount (<code>ReplicaLag</code>). Promoting one is a manual step. A third option, the Multi-AZ DB cluster, has two readable standbys; it's less common.</p>`,
          code: `              Multi-AZ standby     Read replica
Replication   synchronous          asynchronous
Readable      no                   yes
Endpoint      same DNS name        its own DNS name
Purpose       availability         read scaling
Failover      automatic            manual promotion`,
          lang: "text",
          tip: `<p>Gotcha for Java people: the JVM can cache DNS lookups, which delays failover pickup. Node doesn't cache DNS itself, and <code>pg</code> resolves the hostname for each new connection. Pools still hold dead connections until they error, so retry idempotent operations.</p>`
        },
        {
          h: "From a JNDI datasource to an RDS endpoint",
          body: `<p>On an app server the container owned the pool: one <code>DataSource</code> per server, sized centrally. In ECS each task is its own process with its own pool, so the database sees <strong>tasks × pool size</strong> connections, plus migrations and admin sessions. Scale from 4 to 20 tasks with a pool of 10 and you go from 40 to 200 connections without touching the database.</p><p>Postgres runs a backend process per connection, and RDS derives the default <code>max_connections</code> from instance memory. Keep pools small (5 to 10 per task is common) and read host, user and password from the environment that ECS fills from Secrets Manager.</p>`,
          bridge: {
            left: {

  type="javax.sql.DataSource"

  username="wo_app"
  password="********"
  maxTotal="20" />`

            right: {
              label: "Nest + TypeORM",
              lang: "ts",
              code: `TypeOrmModule.forRoot({
  type: 'postgres',

  database: 'wo',
  username: process.env.DB_USER,

}),`

        },
        {
          h: "Backups and point-in-time restore",
          body: `<p>With automated backups on (retention 1 to 35 days), RDS takes a daily storage snapshot in your backup window and archives transaction logs every few minutes. Together they let you <strong>restore to any second</strong> in the retention period, up to about five minutes ago.</p><p>A restore always creates a <strong>new instance</strong> with a new endpoint; it never rewinds the existing one. You then point the app at it (update the secret or DNS name) or copy the lost rows back into production.</p><p><strong>Manual snapshots</strong> persist until you delete them, survive deletion of the instance, and can be copied to another account or Region. A backup copy in a separate account is a common pattern, and AWS Backup can manage both on a schedule.</p>`,
          tip: `<p>Test a restore before you need one and time it for your data size. That number is your real recovery time.</p>`
        },
        {
          h: "Decide these at creation",
          body: `<p><strong>Encryption at rest</strong> is fixed when the instance is created. It uses a KMS key (the AWS managed <code>aws/rds</code> key or a customer managed key) and covers storage, backups, snapshots and replicas. You can't switch it on later. To encrypt an existing database: snapshot it, copy the snapshot with encryption and a KMS key, restore a new instance from the copy, cut over.</p><p><strong>Parameter groups</strong> hold engine settings, the equivalent of <code>postgresql.conf</code>. The default group can't be edited, so create a custom one up front. Dynamic parameters such as <code>log_min_duration_statement</code> apply immediately; static ones such as <code>shared_preload_libraries</code> wait for a reboot (the console shows <code>pending-reboot</code>). Attaching a different group also takes effect at the next reboot.</p>`,
          tip: `<p>Gotcha: snapshots encrypted with the AWS managed key can't be shared with another account. If cross-account backups are in the plan, use a customer managed key from day one.</p>`
        },
        {
          h: "Credentials, rotation and RDS Proxy",
          body: `<p>Keep database credentials in <strong>Secrets Manager</strong>. RDS can manage the master password there, and Secrets Manager rotates app passwords on a schedule. Rotation updates the database and the secret together, but running tasks got the old value as an env var at startup. Either read the secret at runtime and refresh it on an authentication failure, or use the alternating-users strategy, where the previous credentials stay valid until the next rotation.</p><p><strong>IAM database authentication</strong> is the other option: the app signs a token (valid 15 minutes) with its role and uses it as the password over TLS.</p><p><strong>RDS Proxy</strong> is a managed pooler that multiplexes many client connections onto fewer database connections and holds them through a failover. Session state such as <code>SET</code> or temporary tables <em>pins</em> a client to one connection and reduces the benefit.</p>`

        {
          id: "aws-5-q1",

      summary: "Read and change infrastructure code in CloudFormation, CDK or Terraform, and follow a pipeline that builds, migrates and deploys across accounts without stored keys.",
      cards: [
        {
          h: "Infrastructure as code, and what CDK really does",
          body: `<p>Console changes can't be reviewed, repeated or promoted. With three accounts that must match, and an assessment process that wants evidence of every change, infrastructure lives in Git and changes through pull requests.</p><p>AWS CDK looks like Spring Java config: code that builds an object graph. The difference is when it runs. Spring instantiates beans at runtime. CDK code runs only at <strong>synth</strong> time, builds a tree of constructs, and serializes it to a CloudFormation template. CloudFormation then does the real work of creating, updating and rolling back resources. Your TypeScript never runs in AWS.</p>`,

      props: DbStackProps) {

    new rds.DatabaseInstance(this, 'Db', {

        {
          h: "CloudFormation: stacks, change sets, drift",
          body: `<p>A <strong>stack</strong> is a set of resources managed from one template. On update, CloudFormation diffs the new template against the last deployed one, orders operations by dependency, and rolls back if anything fails.</p><p>A <strong>change set</strong> previews an update. Read the <code>Replacement</code> column: some property changes can't be applied in place, so CloudFormation creates a new resource and deletes the old one. Renaming an RDS instance identifier is one of them, and the new instance starts empty.</p><p><strong>Drift detection</strong> compares live resources with the template and flags console edits. Drift matters because CloudFormation compares templates, not live state, so drifted resources behave unpredictably on the next update.</p>`,
          tip: `<p>Protect stateful resources with <code>DeletionPolicy</code> and <code>UpdateReplacePolicy</code> set to <code>Snapshot</code> or <code>Retain</code>, so a replacement or stack deletion keeps the data.</p>`

        {
          h: "CDK constructs and commands",
          body: `<p>Constructs come in three levels. <strong>L1</strong> (<code>CfnBucket</code>) maps one-to-one to a CloudFormation resource. <strong>L2</strong> (<code>Bucket</code>) adds sensible defaults and helpers such as <code>bucket.grantRead(role)</code>, which writes a least-privilege IAM statement for you. <strong>L3</strong> patterns wire several resources together, such as an ALB plus a Fargate service.</p><p><code>cdk bootstrap</code> runs once per account and Region. It creates the <code>CDKToolkit</code> stack: a staging bucket and ECR repository for assets, and the roles that <code>cdk deploy</code> assumes. For cross-account pipelines you bootstrap each target account with <code>--trust</code> for the pipeline's account.</p>`,
          code: `# once per account and Region
npx cdk bootstrap aws://111122223333/ca-central-1

npx cdk synth    # run the app, write templates to cdk.out/
npx cdk diff     # compare with what's deployed
npx cdk deploy WoApiStack-dev`,

          code: `import { Stack, StackProps } from 'aws-cdk-lib';
import * as ecr from 'aws-cdk-lib/aws-ecr';
import * as ecs from 'aws-cdk-lib/aws-ecs';
import * as patterns from 'aws-cdk-lib/aws-ecs-patterns';
import { Construct } from 'constructs';

interface ApiProps extends StackProps { imageTag: string }

export class WoApiStack extends Stack {
  constructor(scope: Construct, id: string, props: ApiProps) {

    const repo = ecr.Repository.fromRepositoryName(
      this, 'Repo', 'wo-api');

        memoryLimitMiB: 1024,
        desiredCount: 2,
        circuitBreaker: { rollback: true },
        taskImageOptions: { image, containerPort: 3000 },

  }
}`,

          tip: `<p>Gotcha: with no <code>vpc</code> or <code>cluster</code> prop, the pattern creates a brand-new VPC, NAT gateways included. In a landing zone, look up the VPC you were given (<code>ec2.Vpc.fromLookup</code>) and pass it in.</p>`

        {
          h: "Terraform, and which one your team uses",
          body: `<p><strong>Terraform</strong> describes resources in HCL and calls AWS APIs directly through its provider, with no CloudFormation underneath. It records what it manages in a <strong>state file</strong>, usually stored in S3 with locking so two runs can't collide. <code>terraform plan</code> compares configuration, state and live resources and prints a diff; <code>terraform apply</code> executes it.</p><p>CDK gives you TypeScript, L2 defaults and CloudFormation's rollback. Terraform gives one tool across clouds and SaaS providers, plus a state file to protect: it can hold secrets in plain text.</p><p>Check which one your team uses, and never let two tools manage the same resource. Each assumes it's the only owner.</p>`,
          tip: `<p>Terraform doesn't roll back a failed apply. Whatever it created before the failure stays in state, and the next plan starts from there.</p>`

    {

      cards: [
        {
          h: "Where container logs go",
          body: `<p>With the <code>awslogs</code> driver, whatever your process writes to stdout and stderr becomes <strong>log events</strong> in a CloudWatch <strong>log group</strong> (one per service, such as <code>/ecs/wo-api</code>), with one <strong>log stream</strong> per task. Each line is a separate event, so a stack trace printed as text becomes many unrelated events. That's one reason to log one JSON object per line.</p><p>New log groups default to <strong>never expire</strong>. You pay for the storage indefinitely, and nobody notices until the bill does. Create log groups in your IaC with a retention period, rather than letting the driver create them.</p>`,
          tip: `<p>Federal context: logs can contain personal or Protected information and may fall under records-retention rules. Agree on retention periods, and on what must never be logged (tokens, passwords, full payloads), with your security team.</p>`

        {
          h: "Structured logs and Logs Insights",
          body: `<p>Log one JSON object per line with stable field names: <code>level</code>, <code>msg</code>, <code>correlationId</code>, <code>path</code>, <code>status</code>, <code>durationMs</code>. Nest's default logger writes coloured text; a JSON logger such as pino (through <code>nestjs-pino</code>) or your own <code>LoggerService</code> fixes that.</p><p><strong>Logs Insights</strong> discovers JSON fields automatically. A query is a pipeline: <code>fields</code> picks columns, <code>filter</code> keeps matching events, <code>stats</code> aggregates, <code>sort</code> and <code>limit</code> shape the output. You pay per gigabyte scanned, so narrow the time range first.</p>`,
          code: `# Latest errors
fields @timestamp, level, msg, correlationId
| filter level = "error"

        {
          h: "Correlation ids: MDC without threads",
          body: `<p>Generate an id per user action in the Vue app, send it as an <code>X-Correlation-Id</code> header, and have Nest put it on every log line for that request. Searching one id in Logs Insights then shows the whole story.</p><p>Spring's MDC keeps the id in a <code>ThreadLocal</code>, which works because one thread serves the request. Node serves every request on one thread, interleaved at each <code>await</code>, so a thread-local value would bleed between requests. <code>AsyncLocalStorage</code> carries a store along the async call chain instead: everything that runs inside <code>als.run(store, fn)</code>, including continuations after <code>await</code>, sees that store.</p>`,

export function correlation(

) {

}`

        {

          body: `<ul><li><strong>ALB</strong>: <code>HTTPCode_Target_5XX_Count</code> (errors your app returned), <code>HTTPCode_ELB_5XX_Count</code> (502, 503 and 504 the ALB generated itself), <code>TargetResponseTime</code> at p95 or p99 rather than the average, and <code>UnHealthyHostCount</code> per target group.</li><li><strong>ECS</strong>: service <code>CPUUtilization</code> and <code>MemoryUtilization</code>. Memory creeping up between deploys suggests a leak; hitting the limit kills the task.</li><li><strong>RDS</strong>: <code>CPUUtilization</code>, <code>FreeableMemory</code>, <code>DatabaseConnections</code> against your ceiling, <code>FreeStorageSpace</code>, and read/write latency.</li></ul><p>An alarm evaluates one statistic per period and changes state when <em>M of N</em> datapoints breach. Alarms publish to an <strong>SNS</strong> topic, which fans out to email, chat or paging. Dashboards put the same metrics side by side for people.</p>`,

        {

        {
          h: "Encryption in transit, end to end",
          body: `<p>Browser to CloudFront, and CloudFront or browser to the ALB, use <strong>ACM</strong> certificates, which ACM renews automatically while the DNS validation record stays in place. Pick a current TLS security policy on the ALB listener. ALB to tasks is often plain HTTP inside the VPC; some projects require TLS on that hop too, so check.</p><p>App to database: set <code>rds.force_ssl</code> to <code>1</code> in the parameter group so the server refuses unencrypted connections (newer engine versions default to it; set it explicitly anyway). The client must also <strong>verify</strong> the server: load the RDS CA bundle AWS publishes (<code>global-bundle.pem</code>) and keep certificate checks on. Encryption without verification still lets a man-in-the-middle present its own certificate.</p>`,

          body: "<p>A cross-origin request that isn't <em>simple</em> gets a preflight. Yours qualify three ways: an <code>Authorization</code> header, <code>Content-Type: application/json</code>, and methods such as PATCH and DELETE.</p><p>The browser first sends <code>OPTIONS</code> with <code>Origin</code>, <code>Access-Control-Request-Method</code> and <code>Access-Control-Request-Headers</code>. It carries no Authorization header and no cookies. The server must reply 2xx with an <code>Access-Control-Allow-Origin</code> that matches the page's origin exactly, plus allow-lists covering the method and headers. Only then does the browser send the real request, and it checks <code>Access-Control-Allow-Origin</code> again on that response.</p><p>In Nest, <code>app.enableCors()</code> registers the <code>cors</code> middleware in Express. It answers preflights itself with 204, before routing, so guards never see them.</p>",

        {

          body: "<p>Most architecture questions on this stack have two defensible answers. A useful recommendation names the factor that decides it, in a form someone can check: “Fargate, because load is steady through business hours; revisit if usage turns bursty with long idle periods.” That also tells the next architect when the decision expires.</p><p>Record each decision as an ADR in the repo: one short Markdown file per decision, numbered, left unchanged once accepted. A new ADR supersedes an old one. Federal projects get audited and change vendors, and ADRs answer “why is it like this?” years later without you in the room.</p>",
          code: `# ADR-012: Run the API on ECS Fargate
Status: Accepted (supersedes ADR-004)
Context: ~400 staff, 07:00-18:00 weekdays, steady load.
  RDS for PostgreSQL, Protected B, ca-central-1.
Decision: ECS Fargate behind an ALB, 2-12 tasks.

        {
          h: "Modular monolith first",
          body: "<p>For one team shipping one product, start with a single Nest app split into feature modules: work orders, inspections, assets, training. Nest enforces part of each boundary: a provider is visible outside its module only if the module exports it, and boot fails if another module injects a private one.</p><p>Microservices pay off when parts need independent deploys, separate teams, or different scaling and availability. They cost network calls where there were method calls, no single transaction across work orders and inspections, and versioned contracts between services. Deciding factor: how many teams need to ship independently.</p><p>Where the analogy breaks: Nest checks injection only. Code can still import another module's entity file directly; a lint rule (dependency-cruiser, for example) catches that.</p>",

        {
          h: "Fargate or Lambda for the API",
          body: "<p>Nest on Lambda runs through an adapter that wraps the Express app. Every cold start rebuilds the DI container, scanning modules and instantiating providers, before the first request is served. Each concurrent request gets its own execution environment with its own database pool, so a burst of 200 concurrent requests means 200 pools; plan on RDS Proxy. An invocation can run at most 15 minutes.</p><p>Fargate runs long-lived processes: warm pools, predictable latency, background work in the same process. You pay for tasks while they idle, and you run at least two for availability.</p><p>Deciding factor: traffic shape. Long idle periods and spiky bursts favour Lambda. Steady business-hours load, typical of internal line-of-business apps, favours Fargate.</p>"
