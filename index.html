          h: "RDS or Aurora for Postgres",
          body: "<p><strong>RDS for PostgreSQL</strong> runs the community engine on EBS volumes. Multi-AZ adds a synchronous standby in another AZ; read replicas replicate asynchronously, each with its own storage. It is simple and well understood.</p><p><strong>Aurora PostgreSQL</strong> replaces the storage layer with six copies across three AZs, shared by the writer and up to 15 replicas. Replicas read the same storage, so replica lag stays low and failover is typically faster. Storage grows on its own. Pricing includes I/O unless you choose the I/O-Optimized configuration, and Serverless v2 scales capacity with load.</p><p>Deciding factor: availability and read-scaling requirements. A modest internal app usually fits RDS Multi-AZ; strict recovery targets or several read replicas point to Aurora. Confirm the instance classes you want exist in your Canadian region.</p>"
        },
        {
          h: "ORMs and where types come from",
          body: "<p>TypeORM maps decorated classes and feels closest to JPA. Its weak spot is type honesty: a <code>WorkOrder</code> loaded without relations still claims <code>asset: Asset</code>, and you find out at runtime. Prisma generates a client from a <code>schema.prisma</code> file, and the result type of <code>findMany({ include: { asset: true } })</code> includes <code>asset</code> only when you asked for it. It brings its own migration tool. MikroORM, with a unit of work and identity map, is the closest to Hibernate.</p><p>Deciding factor: what is already in production. Switching means rewriting every query and re-verifying every migration, which rarely pays back on a running system. On a new service, weigh result-type safety against team familiarity.</p><p>Front-to-back types follow the same logic: a workspace package for one repo, OpenAPI when others consume the API.</p>"
        },
        {
          h: "Where authorization lives",
          body: "<p>Three layers, three jobs:</p><ul><li><strong>The UI hides.</strong> Route <code>meta</code> and <code>v-if</code> keep supervisor actions away from inspectors. Anyone with DevTools can get past it; it exists for usability.</li><li><strong>The API enforces roles.</strong> A guard reads <code>@Roles()</code> metadata and the user's claims. It runs before the handler and can't see which row the handler will load.</li><li><strong>Queries enforce rows.</strong> “Inspectors see only their sites” belongs in the <code>WHERE</code> clause of every query that loads work orders, driven by the user's site list. Return 404 for rows outside it, so ids can't be probed.</li></ul><p>Postgres row-level security can back this up: set the user's sites per transaction with <code>set_config(name, value, true)</code> and let policies filter.</p>",
          tip: "<p>Gotcha: row-level security doesn't apply to the table's owner unless you enable <code>FORCE ROW LEVEL SECURITY</code>. If the API connects as the role that ran the migrations, your policies do nothing.</p>"
        },
        {
          h: "Accounts, environments and cost",
          body: "<p>Put dev, test and prod in separate AWS accounts under one organization. An account is the strongest boundary AWS offers: IAM mistakes, quotas and bills stay contained. Many federal departments provide a landing zone with guardrails already applied; learn what yours enforces before designing around it.</p><p>Cost drivers people forget:</p><ul><li><strong>NAT gateway data processing.</strong> Tasks in private subnets that pull images and ship logs through NAT pay per GB. VPC endpoints cut it: a free gateway endpoint for S3, interface endpoints for ECR, CloudWatch Logs and Secrets Manager.</li><li><strong>Idle RDS.</strong> Dev and test instances running nights and weekends. A stopped instance restarts on its own after seven days.</li><li><strong>CloudWatch Logs.</strong> Ingestion is billed per GB, and new log groups never expire by default. Set retention and keep debug logging out of prod.</li></ul>"
        }
      ],
      quiz: [
        {
          id: "x-7-q1",
          type: "mcq",
          q: "Six developers, one product, one pipeline. A stakeholder asks for microservices <em>so each module can scale independently</em>. Load tests show the API at 15% CPU on two tasks. Which factor should decide?",
          options: [
            "Whether parts need independent deploys or scaling, which the data says they don't",
            "Whether NestJS supports microservice transports out of the box",
            "Whether the codebase has grown past a certain number of lines",
            "Whether each module could own its own database schema"
          ],
          answer: 0,
          explain: "<p>Microservices buy independent deployment and scaling at the price of network calls, distributed data and versioned contracts. The stated reason is scaling, and two tasks at 15% CPU show nothing that needs to scale separately; one team and one pipeline show no need to deploy separately. Nest's transports make a later split easier, which argues for clean module boundaries now. Line count doesn't decide it, and schema-per-module works inside a modular monolith too.</p>"
        },
        {
          id: "x-7-q2",
          type: "mcq",
          q: "Which fact about the API most favours ECS Fargate over Lambda?",
          options: [
            "Load is steady through the working day, so tasks are rarely idle",
            "Requests finish in well under a second",
            "The team wants to pay only for requests actually served",
            "Traffic arrives in short bursts separated by hours of silence"
          ],
          answer: 0,
          explain: "<p>Lambda's advantage is not paying for idle capacity. With steady load, Fargate tasks are busy most of the day, so that advantage shrinks, while Lambda still adds cold starts that rebuild Nest's DI container and a database pool per execution environment, usually with RDS Proxy on top. Short requests suit both platforms. Pay-per-request billing and long silences are arguments for Lambda.</p>"
        },
        {
          id: "x-7-q3",
          type: "mcq",
          q: "Which requirement most justifies Aurora PostgreSQL over RDS for PostgreSQL?",
          options: [
            "Several read replicas with low lag and quick promotion on failure",
            "Data must stay in a Canadian AWS region",
            "The schema uses JSONB columns with GIN indexes",
            "Automated backups with point-in-time recovery"
          ],
          answer: 0,
          explain: "<p>Aurora's distinguishing feature is its shared, replicated storage layer: replicas read the same storage as the writer, so lag stays low and a replica can take over quickly. Both services run in <code>ca-central-1</code>. Both support JSONB and GIN, since the query engine is Postgres in each. Both offer automated backups with point-in-time recovery.</p>"
        },
        {
          id: "x-7-q4",
          type: "bug",
          q: "Inspectors may see only work orders for their assigned sites (<code>user.siteIds</code>). An inspector edited the id in the URL and opened another site's work order. Tap the line to change.",
          code: `@Controller('work-orders')
@UseGuards(JwtAuthGuard, RolesGuard)
export class WorkOrdersController {
  constructor(
    @InjectRepository(WorkOrder)
    private readonly repo: Repository<WorkOrder>,
  ) {}

  @Get(':id')
  @Roles('inspector', 'supervisor')
  findOne(
    @Param('id', ParseUUIDPipe) id: string,
    @CurrentUser() user: AuthUser,
  ) {
    return this.repo.findOneBy({ id });
  }
}`,
          lang: "ts",
          answer: 14,
          explain: "<p>The guard checked the role, which is all a guard can check: it runs before the handler and doesn't know which row will be loaded. The query then fetches any work order by id. Scope it to the user with <code>findOneBy({ id, siteId: In(user.siteIds) })</code> and throw <code>NotFoundException</code> when it returns null, so other sites' ids can't be probed. Put that scoping in a service or repository helper that every read goes through.</p>"
        },
        {
          id: "x-7-q5",
          type: "mcq",
          q: "The test account's largest bill line is NAT gateway data processing. Its ECS tasks run in private subnets, pull a 900 MB image on every task start, and send logs to CloudWatch. What cuts that line most directly?",
          options: [
            "VPC endpoints for S3, ECR and CloudWatch Logs",
            "A Compute Savings Plan covering the Fargate tasks",
            "Shorter retention on the CloudWatch log groups",
            "A larger NAT gateway size for the private subnets"
          ],
          answer: 0,
          explain: "<p>Traffic from private subnets to AWS service endpoints goes through the NAT gateway unless a VPC endpoint offers a private path, and NAT bills per GB processed. ECR serves image layers from S3, so an S3 gateway endpoint (no charge) plus interface endpoints for ECR and CloudWatch Logs take that traffic off the NAT. Savings Plans discount compute. Retention changes storage cost, not ingestion or NAT. NAT gateways don't come in sizes. A smaller image helps too.</p>"
        },
        {
          id: "x-7-q6",
          type: "mcq",
          q: "The API has 40 TypeORM entities and two years of migrations in production. A new developer proposes switching to Prisma for its generated result types. As the architect, what should decide it?",
          options: [
            "Whether the typing gain outweighs rewriting every query and migration",
            "Whether Prisma's published benchmarks beat TypeORM's on simple queries",
            "Whether Prisma's generated types would let you drop ValidationPipe",
            "Whether the Vue app could import the Prisma client for its types"
          ],
          answer: 0,
          explain: "<p>On a running system the cost side is concrete: every query rewritten, the migration history re-baselined, behaviour re-verified. The benefit is better result typing, part of which you can get inside TypeORM with explicit return types and query helpers. Benchmarks rarely decide it for an internal app. Generated types exist only at compile time, so runtime validation stays. The Vue app should never import a database client.</p>"
        }
      ]
    }
  ]
});

</script>
<script>
(function () {
  'use strict';

  /* ---------- helpers ---------- */
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var esc = function (s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  };
  var fmt = function (s) { return esc(s).replace(/`([^`]+)`/g, '<code>$1</code>'); };
  var shuffle = function (a) {
    a = a.slice();
    for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  };
  var SEP = '<span class="sep" aria-hidden="true">·</span>';
  var plural = function (n, one, many) { return n + ' ' + (n === 1 ? one : (many || one + 's')); };

  /* ---------- content ---------- */
  var META = {
    ts: { name: 'TypeScript', letter: 'T', tag: 'The language under both halves of the stack' },
    nest: { name: 'NestJS', letter: 'N', tag: 'The API: Spring Boot ideas on the Node runtime' },
    vue: { name: 'Vue', letter: 'V', tag: 'The browser app your users actually see' },
    pg: { name: 'PostgreSQL', letter: 'P', tag: 'The database, and how it behaves under load' },
    aws: { name: 'AWS', letter: 'A', tag: 'Where it all runs, and how it gets there' },
    x: { name: 'Missions', letter: 'M', tag: 'Incidents and design calls that cross the whole stack' }
  };
  var ORDER = ['ts', 'nest', 'vue', 'pg', 'aws', 'x'];
  var ZONES = { 1: 'Basics', 2: 'Working knowledge', 3: 'Advanced' };
  var TYPE_LABEL = { mcq: 'Multiple choice', fill: 'Fill the blank', order: 'Put in order', bug: 'Find the bug' };
  var RANKS = [[0, 'Hello World'], [100, 'Junior'], [400, 'Intermediate'], [900, 'Senior'], [1600, 'Tech Lead'], [2400, 'Architect'], [3200, 'Principal']];
  var PASS = 0.6;

  var LBY = {}, ST = {}, Q = {};
  (window.LINES || []).forEach(function (l) {
    LBY[l.id] = l;
    l.stations.forEach(function (s, i) {
      s.line = l.id; s.idx = i;
      ST[s.id] = s;
      s.quiz.forEach(function (q) { q.sid = s.id; Q[q.id] = q; });
    });
  });
  var LINE_LIST = ORDER.filter(function (id) { return LBY[id]; }).map(function (id) { return LBY[id]; });
  var ALL = [];
  LINE_LIST.forEach(function (l) { ALL = ALL.concat(l.stations); });
  var TOTAL_Q = Object.keys(Q).length;

  var lineVars = function (id) { return '--lc:var(--l-' + id + ');--lci:var(--l-' + id + '-ink)'; };
  var bullet = function (id, cls) {
    return '<span class="bullet ' + (cls || '') + '" style="' + lineVars(id) + '" aria-hidden="true">' + META[id].letter + '</span>';
  };

  /* ---------- state + persistence ---------- */
  var LS_KEY = 'stack-transit:v1';
  var blank = function () { return { v: 1, st: {}, rv: {}, rxp: 0, days: [], open: false, upd: 0 }; };

  function merge(a, b) {
    a = a && typeof a === 'object' ? a : blank();
    b = b && typeof b === 'object' ? b : blank();
    var out = blank();
    var ids = Object.keys(a.st || {}).concat(Object.keys(b.st || {}));
    ids.forEach(function (id) {
      var x = (a.st || {})[id] || {}, y = (b.st || {})[id] || {};
      out.st[id] = {
        stars: Math.max(x.stars || 0, y.stars || 0),
        xp: Math.max(x.xp || 0, y.xp || 0),
        best: Math.max(x.best || 0, y.best || 0),
        n: Math.max(x.n || 0, y.n || 0)
      };
    });
    Object.keys(a.rv || {}).concat(Object.keys(b.rv || {})).forEach(function (id) {
      var x = (a.rv || {})[id], y = (b.rv || {})[id];
      var pick = !x ? y : !y ? x : ((y.t || 0) > (x.t || 0) ? y : x);
      out.rv[id] = { on: !!pick.on, t: pick.t || 0, m: Math.max((x && x.m) || 0, (y && y.m) || 0) };
    });
    out.rxp = Math.max(a.rxp || 0, b.rxp || 0);
    var days = {};
    (a.days || []).concat(b.days || []).forEach(function (d) { if (typeof d === 'string') days[d] = 1; });
    out.days = Object.keys(days).sort().slice(-400);
    var newer = (b.upd || 0) > (a.upd || 0) ? b : a;
    out.open = !!newer.open;
    out.upd = Math.max(a.upd || 0, b.upd || 0);
    return out;
  }

  var localOK = true;
  function loadLocal() {
    try { var s = localStorage.getItem(LS_KEY); return s ? JSON.parse(s) : null; } catch (e) { localOK = false; return null; }
  }
  function saveLocal() {
    try { localStorage.setItem(LS_KEY, JSON.stringify(state)); localOK = true; } catch (e) { localOK = false; }
  }

  var state = merge(blank(), loadLocal());
  var cloud = { ref: null, status: 'local', saving: false, pending: false, timer: null };

  function persist() {
    state.upd = Date.now();
    saveLocal();
    if (cloud.ref) { clearTimeout(cloud.timer); cloud.timer = setTimeout(flush, 1200); }
  }

  async function flush() {
    if (!cloud.ref) return;
    if (cloud.saving) { cloud.pending = true; return; }
    cloud.saving = true;
    for (var attempt = 0; attempt < 2; attempt++) {
      try {
        var snap = await cloud.ref.get();
        if (snap.exists) state = merge(state, snap.data());
        await cloud.ref.set(JSON.parse(JSON.stringify(state)));
        saveLocal();
        cloud.status = 'cloud';
        break;
      } catch (e) {
        if (e && e.code === 'unavailable' && attempt === 0) { await new Promise(function (r) { setTimeout(r, 600 + Math.random() * 900); }); continue; }
        cloud.status = 'err';
        break;
      }
    }
    cloud.saving = false;
    renderFoot(); renderTop();
    if (cloud.pending) { cloud.pending = false; flush(); }
  }

  async function initCloud() {
    var c = window.claude;
    if (!c || typeof c.use !== 'function') return;
    try {
      var caps = await Promise.all([c.use('db'), c.use('user')]);
      var db = caps[0], user = caps[1];
      if (!db || !user) return;
      var uid = await user.id();
      if (!uid) return;
      cloud.ref = db.doc('data/users/' + uid + '/progress');
      var snap = await cloud.ref.get();
      var remote = snap.exists ? merge(blank(), snap.data()) : null;
      var before = JSON.stringify(state);
      state = merge(state, remote);
      saveLocal();
      cloud.status = 'cloud';
      if (JSON.stringify(state) !== before && (ui.view === 'home' || ui.view === 'review-empty')) render();
      renderTop(); renderFoot();
      var hasProgress = Object.keys(state.st).length || Object.keys(state.rv).length;
      if (hasProgress && (!remote || JSON.stringify(remote) !== JSON.stringify(state))) flush();
    } catch (e) {
      cloud.status = cloud.ref ? 'err' : 'local';
      renderFoot();
    }
  }

  /* ---------- derived ---------- */
  var rec = function (sid) { return state.st[sid] || null; };
  var passed = function (sid) { return ((state.st[sid] || {}).stars || 0) > 0; };
  var unlocked = function (s) { return state.open || s.idx === 0 || passed(LBY[s.line].stations[s.idx - 1].id); };
  var totalXP = function () {
    var x = state.rxp || 0;
    Object.keys(state.st).forEach(function (k) { if (ST[k]) x += state.st[k].xp || 0; });
    return x;
  };
  var rankIdx = function (xp) { var i = 0; RANKS.forEach(function (r, j) { if (xp >= r[0]) i = j; }); return i; };
  var reviewIds = function () { return Object.keys(state.rv).filter(function (k) { return state.rv[k].on && Q[k]; }); };
  var doneCount = function () { return ALL.filter(function (s) { return passed(s.id); }).length; };
  var starCount = function () { return ALL.reduce(function (a, s) { return a + ((state.st[s.id] || {}).stars || 0); }, 0); };
  function nextStation() {
    for (var z = 1; z <= 3; z++) {
      for (var i = 0; i < LINE_LIST.length; i++) {
        var ss = LINE_LIST[i].stations;
        for (var j = 0; j < ss.length; j++) if (ss[j].zone === z && !passed(ss[j].id) && unlocked(ss[j])) return ss[j];
      }
    }
    return null;
  }
  var dayKey = function (d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
  function markDay() { var k = dayKey(new Date()); if (state.days.indexOf(k) < 0) state.days.push(k); }
  function streak() {
    var set = {}; state.days.forEach(function (d) { set[d] = 1; });
    var d = new Date(), n = 0;
    if (!set[dayKey(d)]) d.setDate(d.getDate() - 1);
    while (set[dayKey(d)]) { n++; d.setDate(d.getDate() - 1); }
    return n;
  }
  var starsHtml = function (n) {
    var s = '';
    for (var i = 0; i < 3; i++) s += i < n ? '★' : '<span class="off">★</span>';
    return '<span class="stars" aria-label="' + n + ' of 3 stars">' + s + '</span>';
  };

  /* ---------- code rendering ---------- */
  var LANG_MAP = { ts: 'typescript', js: 'javascript', vue: 'xml', html: 'xml', xml: 'xml', sql: 'sql', java: 'java', bash: 'bash', json: 'json', yaml: 'yaml', properties: 'ini', text: 'plaintext' };
  var LANG_LABEL = { ts: 'TypeScript', js: 'JavaScript', vue: 'Vue SFC', html: 'HTML', xml: 'XML', sql: 'SQL', java: 'Java', bash: 'Shell', json: 'JSON', yaml: 'YAML', properties: 'Properties', text: 'Text' };
  function hl(code, lang) {
    var l = LANG_MAP[lang] || 'plaintext';
    try {
      if (window.hljs && l !== 'plaintext' && window.hljs.getLanguage(l)) return window.hljs.highlight(code, { language: l, ignoreIllegals: true }).value;
    } catch (e) { /* fall through */ }
    return esc(code);
  }
  function splitLines(html) {
    var lines = [], open = [], cur = '', m;
    var re = /(<span[^>]*>)|(<\/span>)|(\n)|([^<\n]+)/g;
    while ((m = re.exec(html))) {
      if (m[1]) { open.push(m[1]); cur += m[1]; }
      else if (m[2]) { open.pop(); cur += m[2]; }
      else if (m[3]) { cur += '</span>'.repeat(open.length); lines.push(cur); cur = open.join(''); }
      else cur += m[4];
    }
    lines.push(cur);
    return lines;
  }
  var codeStore = [];
  function codeBlock(code, lang, label, extra) {
    var id = codeStore.push(code) - 1;
    return '<div class="code">' +
      '<div class="code-head"><span class="lbl">' + (label || esc(LANG_LABEL[lang] || lang)) + '</span>' +
      '<button class="copy" data-act="copy" data-c="' + id + '">Copy</button></div>' +
      '<pre><code>' + (extra ? extra(hl(code, lang)) : hl(code, lang)) + '</code></pre></div>';
  }

  /* ---------- UI state ---------- */
  var ui = { view: 'home', sid: null, card: 0, run: null, result: null, pbLine: 'all', pbQuery: '' };
  var app = $('#app');

  function go(view, opts) {
    Object.assign(ui, opts || {}, { view: view });
    render();
    try { window.scrollTo({ top: 0 }); } catch (e) { window.scrollTo(0, 0); }
    try { app.focus({ preventScroll: true }); } catch (e) { /* ignore */ }
  }

  var toastTimer;
  function toast(msg) {
    var t = $('#toast');
    t.textContent = msg; t.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.hidden = true; }, 2600);
  }

  /* ---------- top bar + footer ---------- */
  function renderTop() {
    var xp = totalXP(), r = RANKS[rankIdx(xp)][1], rv = reviewIds().length, sk = streak();
    $('#topstats').innerHTML =
      '<span class="chip hide-sm"><span class="k">Rank</span>' + esc(r) + '</span>' +
      '<span class="chip tnum"><span class="k">XP</span>' + xp + '</span>' +
      '<span class="chip tnum hide-sm" title="Days in a row with a finished quiz"><span class="k">Streak</span>' + plural(sk, 'day') + '</span>' +
      '<button class="chip" data-act="review">Review <span class="count tnum ' + (rv ? '' : 'zero') + '">' + rv + '</span></button>' +
      '<button class="chip" data-act="phrasebook">Phrasebook</button>';
  }

  var resetArmed = false, resetTimer;
  function renderFoot() {
    var msg, cls = '';
    if (cloud.status === 'cloud') { msg = 'Progress syncs to your Claude account, so it follows you between devices.'; cls = 'cloud'; }
    else if (cloud.status === 'err') { msg = 'Your account could not be reached just now. Progress is saved in this browser and syncs on your next visit.'; cls = 'err'; }
    else if (!localOK) { msg = 'This browser is blocking storage, so progress lasts until you close the page.'; cls = 'err'; }
    else msg = 'Progress is saved in this browser.';
    $('#foot').innerHTML =
      '<span class="sync ' + cls + '"><i aria-hidden="true"></i>' + esc(msg) + '</span>' +
      '<span class="foot-actions">' +
      '<label class="toggle"><input type="checkbox" id="open-all"' + (state.open ? ' checked' : '') + '> Open every station</label>' +
      '<button class="link reset' + (resetArmed ? ' armed' : '') + '" data-act="reset">' + (resetArmed ? 'Tap again to erase all progress' : 'Reset progress') + '</button>' +
      '</span>';
  }

  /* ---------- home ---------- */
  function renderHome() {
    var xp = totalXP(), ri = rankIdx(xp), nx = nextStation();
    var board;
    if (nx) {
      board = '<section class="board" aria-labelledby="board-title">' +
        '<div class="board-top"><span class="board-label">Next departure</span>' +
        '<span class="board-meta">Zone ' + nx.zone + SEP + ZONES[nx.zone] + SEP + nx.minutes + ' min' + SEP + plural(nx.quiz.length, 'question') + '</span></div>' +
        '<div class="board-main">' + bullet(nx.line, 'lg') +
        '<div><h1 class="board-title" id="board-title">' + fmt(nx.title) + '</h1>' +
        '<div class="board-line">' + META[nx.line].name + ' line' + SEP + 'station ' + (nx.idx + 1) + ' of ' + LBY[nx.line].stations.length + '</div></div></div>' +
        '<p class="board-sum">' + fmt(nx.summary) + '</p>' +
        '<div class="board-actions"><button class="btn go" data-act="open" data-sid="' + nx.id + '">Start lesson</button>' +
        '<button class="btn on-sign" data-act="quiz" data-sid="' + nx.id + '">Skip to the quiz</button></div></section>';
    } else {
      var rv = reviewIds().length;
      board = '<section class="board"><div class="board-top"><span class="board-label">End of the line</span></div>' +
        '<h1 class="board-title">Every station cleared.</h1>' +
        '<p class="board-sum">' + (rv ? 'You have ' + plural(rv, 'question') + ' in your review deck. Clear them, or retake stations to earn three stars.' : 'Retake any station to chase three stars, or browse the phrasebook.') + '</p>' +
        '<div class="board-actions">' + (rv ? '<button class="btn go" data-act="review">Open review deck</button>' : '') +
        '<button class="btn on-sign" data-act="phrasebook">Open phrasebook</button></div></section>';
    }

    var lo = RANKS[ri][0], hi = ri < RANKS.length - 1 ? RANKS[ri + 1][0] : null;
    var steps = RANKS.length - 1;
    var pct = Math.min(100, ((ri + (hi !== null ? (xp - lo) / (hi - lo) : 0)) / steps) * 100);
    var stops = RANKS.map(function (r, i) {
      return '<i class="ladder-stop ' + (i < ri ? 'reached' : i === ri ? 'here' : '') + '" style="left:' + (i / steps * 100) + '%" title="' + esc(r[1]) + ' · ' + r[0] + ' XP"></i>';
    }).join('');
    var career = '<section class="career" aria-label="Your progress">' +
      '<div class="rank-row"><div><div class="eyebrow">Your rank</div><div class="rank-name">' + esc(RANKS[ri][1]) + '</div></div>' +
      '<div class="rank-xp tnum">' + xp + ' XP</div></div>' +
      '<div class="ladder" aria-hidden="true"><span class="ladder-track"></span><span class="ladder-fill" style="width:' + pct + '%"></span>' + stops + '</div>' +
      '<p class="rank-next">' + (hi !== null ? '<span class="tnum">' + (hi - xp) + '</span> XP to ' + esc(RANKS[ri + 1][1]) + '. Each correct answer is 10 XP; a perfect quiz adds 20.' : 'Top rank reached.') + '</p>' +
      '<div class="stats">' +
      '<div class="stat"><b>' + doneCount() + '<small style="font-size:.6em;color:var(--muted)">/' + ALL.length + '</small></b><span>stations cleared</span></div>' +
      '<div class="stat"><b>' + starCount() + '<small style="font-size:.6em;color:var(--muted)">/' + ALL.length * 3 + '</small></b><span>stars</span></div>' +
      '<div class="stat"><b>' + streak() + '</b><span>day streak</span></div>' +
      '</div></section>';

    var intro = '<div class="intro"><p>Six lines, ' + ALL.length + ' stations, ' + TOTAL_Q + ' questions. Each station is a short lesson and a quiz. Score 60% or better to clear it and open the next station on that line. Questions you miss go to your review deck.</p>' +
      '<div class="zones" aria-label="Difficulty zones">' + [1, 2, 3].map(function (z) { return '<span class="zone-pill">Zone ' + z + SEP + ZONES[z] + '</span>'; }).join('') + '</div></div>';

    var lines = '<div class="lines">' + LINE_LIST.map(renderLine).join('') + '</div>';
    app.innerHTML = '<div class="hero">' + board + career + '</div>' + intro + lines;
  }

  function renderLine(l) {
    var done = l.stations.filter(function (s) { return passed(s.id); }).length;
    var nx = nextStation();
    var items = [], lastZone = l.stations[0].zone;
    l.stations.forEach(function (s, i) {
      var prevDone = i > 0 && passed(l.stations[i - 1].id);
      if (s.zone !== lastZone) {
        items.push('<li class="zone-break' + (prevDone ? ' up-on down-on' : '') + '"><span>Zone ' + s.zone + SEP + ZONES[s.zone] + '</span></li>');
        lastZone = s.zone;
      }
      var r = rec(s.id), isDone = passed(s.id), open = unlocked(s), isNext = nx && nx.id === s.id;
      var cls = ['stop', isDone ? 'is-done' : open ? 'is-open' : 'is-locked', isNext ? 'is-next' : '', l.id === 'x' ? 'is-mission' : '', prevDone ? 'up-on' : '', isDone ? 'down-on' : ''].join(' ');
      var meta = [];
      if (isNext) meta.push('<span class="next-tag">Next</span>');
      if (r && r.stars) meta.push(starsHtml(r.stars));
      else if (r && r.n) meta.push('<span>Not cleared yet</span>');
      meta.push('<span>' + s.minutes + ' min</span>');
      if (!open) meta.push('<span>Locked</span>');
      if (s.connects) meta.push('<span class="connects" aria-label="Uses ' + s.connects.map(function (c) { return META[c].name; }).join(', ') + '">' + s.connects.map(function (c) { return bullet(c, 'sm'); }).join('') + '</span>');
      items.push('<li class="' + cls + '"><button class="stop-btn" data-act="open" data-sid="' + s.id + '"' + (open ? '' : ' aria-disabled="true"') + '>' +
        '<span class="marker" aria-hidden="true"><i></i></span>' +
        '<span class="stop-text"><span class="stop-title">' + fmt(s.title) + '</span><span class="stop-meta">' + meta.join('') + '</span></span></button></li>');
    });
    return '<section class="line" style="' + lineVars(l.id) + '" aria-label="' + META[l.id].name + ' line">' +
      '<div class="line-head">' + bullet(l.id) + '<div><h2>' + META[l.id].name + '</h2><div class="line-tag">' + esc(META[l.id].tag) + '</div></div>' +
      '<span class="line-prog tnum">' + done + '/' + l.stations.length + '</span></div>' +
      '<ol class="strip">' + items.join('') + '</ol></section>';
  }

  /* ---------- station (lesson) ---------- */
  function stationTop(s, compact) {
    var L = LBY[s.line];
    return '<div class="st-top">' +
      '<div><button class="link" data-act="home">← All lines</button></div>' +
      '<div class="st-id">' + bullet(s.line) + '<span>' + META[s.line].name + ' line' + SEP + 'station ' + (s.idx + 1) + ' of ' + L.stations.length + SEP + 'Zone ' + s.zone + ' ' + ZONES[s.zone] + '</span>' +
      (s.connects ? '<span class="connects">' + s.connects.map(function (c) { return bullet(c, 'sm'); }).join('') + '</span>' : '') + '</div>' +
      '<h1>' + fmt(s.title) + '</h1>' +
      (compact ? '' : '<p class="st-sum">' + fmt(s.summary) + '</p>') +
      '</div>';
  }

  function renderLesson() {
    var s = ST[ui.sid], n = s.cards.length, i = Math.max(0, Math.min(ui.card, n - 1));
    ui.card = i;
    var c = s.cards[i];
    codeStore = [];
    var rail = '<ol class="rail" aria-label="Lesson progress">' + s.cards.map(function (cc, k) {
      return '<li class="' + (k <= i ? 'on' : '') + '"><button class="rail-stop ' + (k < i ? 'past' : k === i ? 'cur' : '') + '" data-act="card" data-i="' + k + '" aria-label="Card ' + (k + 1) + ': ' + esc(cc.h.replace(/`/g, '')) + '"' + (k === i ? ' aria-current="step"' : '') + '><i></i></button></li>';
    }).join('') + '<li><button class="rail-stop" data-act="quiz" data-sid="' + s.id + '" aria-label="Quiz"><i></i><span>Quiz</span></button></li></ol>';

    var body = '<div class="card-count">Card ' + (i + 1) + ' of ' + n + '</div>' +
      '<h2>' + fmt(c.h) + '</h2><div class="prose">' + c.body + '</div>';
    if (c.code) body += codeBlock(c.code, c.lang);
    if (c.bridge) {
      body += '<div class="bridge">' +
        codeBlock(c.bridge.left.code, c.bridge.left.lang, '<span class="side-tag">YOU KNOW</span><span>' + esc(c.bridge.left.label) + '</span>') +
        codeBlock(c.bridge.right.code, c.bridge.right.lang, '<span class="side-tag here">THIS STACK</span><span>' + esc(c.bridge.right.label) + '</span>') +
        '</div>';
    }
    if (c.tip) body += '<div class="tip"><span class="tip-label">Watch for</span><div class="prose">' + c.tip + '</div></div>';

    var last = i === n - 1;
    var nav = '<nav class="st-nav" aria-label="Lesson navigation">' +
      (i > 0 ? '<button class="btn ghost" data-act="prev">← Previous</button>' : '<span></span>') +
      '<span class="spacer"></span>' +
      (last ? '' : '<button class="link" data-act="quiz" data-sid="' + s.id + '">Skip to quiz</button>') +
      (last ? '<button class="btn primary" data-act="quiz" data-sid="' + s.id + '">Start the quiz · ' + plural(s.quiz.length, 'question') + '</button>'
        : '<button class="btn primary" data-act="next">Next card →</button>') +
      '</nav>';

    app.innerHTML = '<div class="station" style="' + lineVars(s.line) + '">' + stationTop(s) + rail +
      '<article class="lesson" style="margin-top:18px">' + body + '</article>' + nav +
      '<p class="sr">Use the left and right arrow keys to move between cards.</p></div>';
  }

  /* ---------- quiz ---------- */
  function prepQ(q) {
    var c = { sel: null, checked: false, ok: null };
    if (q.type === 'mcq' || q.type === 'fill') c.perm = shuffle(q.options.map(function (_, i) { return i; }));
    if (q.type === 'order') {
      var p, idx = q.items.map(function (_, i) { return i; });
      do { p = shuffle(idx); } while (p.every(function (v, i) { return v === i; }));
      c.pool = p; c.picked = [];
    }
    return c;
  }
  function startRun(mode, qids, sid) {
    if (!qids.length) return;
    ui.run = { mode: mode, sid: sid, qids: qids, i: 0, results: [], cur: prepQ(Q[qids[0]]) };
    go('quiz');
  }
  function startStationQuiz(sid) {
    var s = ST[sid];
    ui.sid = sid;
    startRun('station', s.quiz.map(function (q) { return q.id; }), sid);
  }
  function startReview() {
    var ids = reviewIds();
    if (!ids.length) { go('review-empty'); return; }
    ids.sort(function (a, b) { return (state.rv[b].m || 0) - (state.rv[a].m || 0) || (state.rv[a].t || 0) - (state.rv[b].t || 0); });
    startRun('review', shuffle(ids.slice(0, 8)), null);
  }

  function ready(q, c) {
    if (q.type === 'order') return c.picked.length === q.items.length;
    return c.sel !== null;
  }

  function renderQuiz() {
    var run = ui.run, q = Q[run.qids[run.i]], c = run.cur, s = ST[q.sid];
    codeStore = [];
    var head;
    if (run.mode === 'station') {
      head = stationTop(s, true);
    } else {
      head = '<div class="st-top"><div><button class="link" data-act="home">← All lines</button></div>' +
        '<div class="st-id">' + bullet(s.line) + '<span>Review deck' + SEP + 'from ' + META[s.line].name + SEP + fmt(s.title) + '</span></div>' +
        '<h1>Review deck</h1></div>';
    }
    var dots = run.qids.map(function (_, k) {
      var r = run.results[k];
      return '<i class="' + (r ? (r.ok ? 'ok' : 'bad') : k === run.i ? 'cur' : '') + '"></i>';
    }).join('');

    var body = '';
    var lock = c.checked ? ' disabled' : '';
    if (q.type === 'mcq') {
      if (q.code) body += codeBlock(q.code, q.lang);
      body += optionList(q, c, false);
    } else if (q.type === 'fill') {
      var slot;
      if (c.checked) {
        var chosen = q.options[c.perm[c.sel]];
        slot = c.ok ? '<span class="blank right">' + esc(chosen) + '</span>'
          : '<span class="blank wrong">' + esc(chosen) + '</span> <span class="blank right">' + esc(q.options[q.answer]) + '</span>';
      } else if (c.sel !== null) slot = '<span class="blank filled">' + esc(q.options[c.perm[c.sel]]) + '</span>';
      else slot = '<span class="blank" aria-label="blank">   </span>';
      body += codeBlock(q.code.replace('___', '___'), q.lang, null, function (h) { return h.replace('___', slot); });
      body += optionList(q, c, true);
    } else if (q.type === 'bug') {
      var lines = splitLines(hl(q.code, q.lang));
      body += '<div class="buglines"><div class="code-head"><span class="lbl">' + esc(LANG_LABEL[q.lang] || q.lang) + SEP + 'tap a line</span></div><div class="scroll"><ol>' +
        lines.map(function (h, k) {
          var cls = 'ln';
          if (c.checked) { if (k === q.answer) cls += ' right'; else if (k === c.sel) cls += ' wrong'; }
          else if (k === c.sel) cls += ' sel';
          return '<li><button class="' + cls + '" data-act="pick" data-i="' + k + '"' + lock + ' aria-pressed="' + (k === c.sel) + '"><span class="ln-no">' + (k + 1) + '</span><code>' + (h || ' ') + '</code></button></li>';
        }).join('') + '</ol></div></div>';
    } else if (q.type === 'order') {
      var picked = c.picked.length ? '<ol class="order-picked">' + c.picked.map(function (v, k) {
        var cls = 'oitem' + (c.checked ? (v === k ? ' right' : ' wrong') : '');
        return '<li><button class="' + cls + '" data-act="ounpick" data-i="' + k + '"' + lock + ' aria-label="Position ' + (k + 1) + ': ' + esc(q.items[v]) + (c.checked ? '' : '. Tap to remove') + '"><span class="num">' + (k + 1) + '</span><span class="txt">' + fmt(q.items[v]) + '</span></button></li>';
      }).join('') + '</ol>' : '<div class="order-empty">Tap the items below in the right order. Tap a placed item to send it back.</div>';
      var pool = c.pool.length ? '<div><div class="order-lbl">Remaining</div><div class="order-pool">' + c.pool.map(function (v, k) {
        return '<button class="oitem" data-act="opick" data-i="' + k + '"' + lock + '><span class="plus" aria-hidden="true">+</span><span class="txt">' + fmt(q.items[v]) + '</span></button>';
      }).join('') + '</div></div>' : '';
      body += '<div class="order"><div><div class="order-lbl">Your order</div>' + picked + '</div>' + pool + '</div>';
    }

    var fb = '';
    if (c.checked) {
      var extra = '';
      if (!c.ok && q.type === 'mcq') extra = '<p class="fb-ans">Answer: ' + fmt(q.options[q.answer]) + '</p>';
      if (!c.ok && q.type === 'order') extra = '<div><p class="fb-ans">Correct order:</p><ol>' + q.items.map(function (t) { return '<li>' + fmt(t) + '</li>'; }).join('') + '</ol></div>';
      if (!c.ok && q.type === 'bug') extra = '<p class="fb-ans">The bug is on line ' + (q.answer + 1) + '.</p>';
      fb = '<div class="fb ' + (c.ok ? 'ok' : 'bad') + '" role="status"><p class="fb-h">' + (c.ok ? (run.mode === 'review' ? 'Correct. Cleared from your deck.' : 'Correct') : 'Not quite') + '</p>' + extra + '<div class="prose">' + q.explain + '</div></div>';
    }
    var lastQ = run.i === run.qids.length - 1;
    var actions = '<div class="q-actions">' +
      (c.checked ? '<span class="hint hide-sm">Press <kbd>Enter</kbd> to continue</span><button class="btn primary" data-act="continue">' + (lastQ ? 'See results' : 'Next question →') + '</button>'
        : '<span class="hint hide-sm">' + (q.type === 'mcq' || q.type === 'fill' ? 'Keys <kbd>A</kbd>–<kbd>' + 'ABCDE'[q.options.length - 1] + '</kbd> pick, <kbd>Enter</kbd> checks' : '') + '</span><button class="btn primary" data-act="check"' + (ready(q, c) ? '' : ' disabled') + '>Check answer</button>') +
      '</div>';

    app.innerHTML = '<div class="station" style="' + lineVars(s.line) + '">' + head +
      '<article class="lesson">' +
      '<div class="q-head"><span class="q-type">' + TYPE_LABEL[q.type] + '</span><span class="card-count tnum">Question ' + (run.i + 1) + ' of ' + run.qids.length + '</span></div>' +
      '<div class="q-dots" aria-hidden="true">' + dots + '</div>' +
      '<div class="q-text">' + q.q + '</div>' + body + fb + actions +
      '</article>' +
      (run.mode === 'station' ? '<nav class="st-nav"><button class="link" data-act="open" data-sid="' + s.id + '">← Back to the lesson</button></nav>' : '') +
      '</div>';
  }

  function optionList(q, c, mono) {
    return '<div class="opts">' + c.perm.map(function (orig, k) {
      var cls = 'opt' + (mono ? ' mono' : '');
      if (c.checked) {
        if (orig === q.answer) cls += ' right';
        else if (k === c.sel) cls += ' wrong';
        else cls += ' dim';
      } else if (k === c.sel) cls += ' sel';
      var label = mono ? esc(q.options[orig]) : fmt(q.options[orig]);
      return '<button class="' + cls + '" data-act="pick" data-i="' + k + '"' + (c.checked ? ' disabled' : '') + ' aria-pressed="' + (k === c.sel) + '"><span class="key">' + 'ABCDE'[k] + '</span><span class="opt-t">' + label + '</span></button>';
    }).join('') + '</div>';
  }

  function check() {
    var run = ui.run, q = Q[run.qids[run.i]], c = run.cur;
    if (c.checked || !ready(q, c)) return;
    var ok;
    if (q.type === 'mcq' || q.type === 'fill') ok = c.perm[c.sel] === q.answer;
    else if (q.type === 'order') ok = c.picked.every(function (v, i) { return v === i; });
    else ok = c.sel === q.answer;
    c.checked = true; c.ok = ok;
    run.results[run.i] = { qid: q.id, ok: ok };
    if (run.mode === 'review') {
      var r = state.rv[q.id] || { m: 0 };
      if (ok) { state.rv[q.id] = { on: false, t: Date.now(), m: r.m || 0 }; state.rxp = (state.rxp || 0) + 5; }
      else state.rv[q.id] = { on: true, t: Date.now(), m: (r.m || 0) + 1 };
      persist();
      renderTop();
    }
    renderQuiz();
    var fb = $('.fb');
    if (fb && fb.scrollIntoView) {
      try { fb.scrollIntoView({ block: 'nearest', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' }); } catch (e) { /* ignore */ }
    }
    var btn = $('[data-act="continue"]');
    if (btn) btn.focus({ preventScroll: true });
  }

  function advance() {
    var run = ui.run;
    if (!run.cur.checked) return;
    if (run.i < run.qids.length - 1) {
      run.i++; run.cur = prepQ(Q[run.qids[run.i]]);
      go('quiz');
    } else finishRun();
  }

  function finishRun() {
    var run = ui.run, now = Date.now();
    var correct = run.results.filter(function (r) { return r.ok; }).length, total = run.qids.length;
    markDay();
    if (run.mode === 'station') {
      var sid = run.sid, prev = state.st[sid] || { stars: 0, xp: 0, best: 0, n: 0 };
      var score = correct / total, pass = score >= PASS;
      var stars = pass ? (correct === total ? 3 : score >= 0.8 ? 2 : 1) : 0;
      var runXP = correct * 10 + (correct === total ? 20 : 0);
      var gain = Math.max(0, runXP - (prev.xp || 0));
      var rankBefore = rankIdx(totalXP());
      state.st[sid] = { stars: Math.max(prev.stars || 0, stars), xp: Math.max(prev.xp || 0, runXP), best: Math.max(prev.best || 0, Math.round(score * 100)), n: (prev.n || 0) + 1 };
      var added = 0;
      run.results.forEach(function (r) {
        var old = state.rv[r.qid];
        if (!r.ok) { if (!old || !old.on) added++; state.rv[r.qid] = { on: true, t: now, m: ((old && old.m) || 0) + 1 }; }
        else if (old && old.on) state.rv[r.qid] = { on: false, t: now, m: old.m || 0 };
      });
      var rankAfter = rankIdx(totalXP());
      ui.result = { mode: 'station', sid: sid, correct: correct, total: total, stars: stars, pass: pass, gain: gain, firstClear: pass && !(prev.stars > 0), added: added, missed: run.results.filter(function (r) { return !r.ok; }).map(function (r) { return r.qid; }), promoted: rankAfter > rankBefore ? RANKS[rankAfter][1] : null };
    } else {
      ui.result = { mode: 'review', correct: correct, total: total, gain: correct * 5, left: reviewIds().length };
    }
    persist();
    renderTop();
    go('result');
  }

  function renderResult() {
    var r = ui.result;
    if (r.mode === 'review') {
      app.innerHTML = '<div class="station"><article class="lesson result">' +
        '<div class="eyebrow">Review deck</div><h1>' + (r.correct === r.total ? 'Deck run cleared' : 'Review run done') + '</h1>' +
        '<p class="result-score tnum">' + r.correct + ' of ' + r.total + ' cleared</p>' +
        (r.gain ? '<span class="xp-gain">+' + r.gain + ' XP</span>' : '') +
        '<p class="result-note">' + (r.left ? plural(r.left, 'question') + ' still in your deck.' : 'Your review deck is empty.') + '</p>' +
        '<div class="result-actions">' + (r.left ? '<button class="btn primary" data-act="review">Another review run</button>' : '') + '<button class="btn ghost" data-act="home">All lines</button></div>' +
        '</article></div>';
      return;
    }
    var s = ST[r.sid], L = LBY[s.line];
    var nextInLine = L.stations[s.idx + 1];
    var bigStars = '<div class="big-stars" aria-label="' + r.stars + ' of 3 stars">' + [0, 1, 2].map(function (k) { return '<span class="' + (k < r.stars ? 'on' : '') + '">★</span>'; }).join('') + '</div>';
    var title = r.pass ? (r.stars === 3 ? 'Perfect run' : 'Station cleared') : 'Not cleared yet';
    var note;
    if (r.pass && r.firstClear && nextInLine) note = 'Next on the ' + META[s.line].name + ' line: ' + fmt(nextInLine.title) + '.';
    else if (r.pass && !nextInLine) note = 'That was the last station on the ' + META[s.line].name + ' line.';
    else if (r.pass) note = 'Your best result on this station is kept.';
    else note = 'You need ' + Math.ceil(PASS * r.total) + ' of ' + r.total + ' to clear this station. Reread the lesson, then try again; questions are the same but the options are shuffled.';
    var missed = '';
    if (r.missed.length) {
      missed = '<div class="missed"><div class="eyebrow">' + (r.added ? plural(r.added, 'question') + ' added to your review deck' : 'Missed this run') + '</div><ul>' +
        r.missed.map(function (id) { return '<li>' + Q[id].q.replace(/<\/?p>/g, ' ') + '</li>'; }).join('') + '</ul></div>';
    }
    var actions = [];
    if (r.pass && nextInLine) actions.push('<button class="btn primary" data-act="open" data-sid="' + nextInLine.id + '">Next station →</button>');
    else if (r.pass) { var nx = nextStation(); if (nx) actions.push('<button class="btn primary" data-act="open" data-sid="' + nx.id + '">Next departure →</button>'); }
    if (!r.pass) actions.push('<button class="btn primary" data-act="open" data-sid="' + s.id + '">Reread the lesson</button>');
    actions.push('<button class="btn ghost" data-act="quiz" data-sid="' + s.id + '">Retake quiz</button>');
    actions.push('<button class="btn ghost" data-act="home">All lines</button>');
    app.innerHTML = '<div class="station" style="' + lineVars(s.line) + '"><article class="lesson result">' +
      '<div class="st-id">' + bullet(s.line) + '<span>' + META[s.line].name + ' line' + SEP + fmt(s.title) + '</span></div>' +
      bigStars + '<h1>' + title + '</h1>' +
      '<p class="result-score tnum">' + r.correct + ' of ' + r.total + ' correct</p>' +
      (r.gain ? '<span class="xp-gain">+' + r.gain + ' XP</span>' : '') +
      (r.promoted ? '<p class="result-score">Promoted to ' + esc(r.promoted) + '</p>' : '') +
      '<p class="result-note">' + note + '</p>' +
      '<div class="result-actions">' + actions.join('') + '</div>' + missed +
      '</article></div>';
  }

  function renderReviewEmpty() {
    app.innerHTML = '<div class="empty"><h1>Review deck is empty</h1>' +
      '<p>When you miss a question in a station quiz it lands here, so you can retry it later without retaking the whole station. Each question you clear here is worth 5 XP.</p>' +
      '<button class="btn primary" data-act="home">Back to all lines</button></div>';
  }

  /* ---------- phrasebook ---------- */
  var PHRASES = [
    ['@SpringBootApplication + SpringApplication.run', 'NestFactory.create(AppModule) in main.ts', 'nest', 'No classpath scanning: Nest walks the module imports graph from AppModule.'],
    ['Component scanning', 'An explicit module graph (@Module imports, providers, exports)', 'nest', 'A provider is only visible inside its module unless exported.'],
    ['@Service / @Component', '@Injectable() class listed in a module\'s providers', 'nest', ''],
    ['@RestController + @GetMapping', '@Controller() + @Get()', 'nest', ''],
    ['@PathVariable / @RequestParam / @RequestBody', '@Param() / @Query() / @Body()', 'nest', ''],
    ['@Valid + Bean Validation (@NotNull, @Size)', 'class-validator decorators + ValidationPipe', 'nest', 'DTOs must be classes, not interfaces, so the decorators exist at runtime.'],
    ['@ControllerAdvice / @ExceptionHandler', 'Exception filters (@Catch)', 'nest', ''],
    ['Servlet Filter', 'Middleware', 'nest', 'Runs before guards, interceptors and pipes.'],
    ['HandlerInterceptor / AOP around advice', 'Interceptors (RxJS Observable around the handler)', 'nest', ''],
    ['Spring Security filter chain / @PreAuthorize', 'Guards (CanActivate) + Passport strategies + Reflector metadata', 'nest', ''],
    ['@Value / application.yml / profiles', 'ConfigModule + ConfigService + environment variables', 'nest', 'In AWS, ECS injects env vars and secrets into the container.'],
    ['Bean scopes: singleton, request, prototype', 'Provider scopes: DEFAULT, REQUEST, TRANSIENT', 'nest', 'Request scope bubbles up to everything that depends on it.'],
    ['@Qualifier / injecting by interface', 'Injection tokens + @Inject(TOKEN)', 'nest', 'Interfaces vanish at compile time, so they cannot be DI keys.'],
    ['@Configuration + @Bean factory method', 'Custom provider with useFactory', 'nest', ''],
    ['JPA / Hibernate @Entity', 'TypeORM @Entity (or a Prisma schema)', 'nest', 'Check which ORM your team uses.'],
    ['Spring Data JpaRepository', 'Repository<Entity> via @InjectRepository', 'nest', ''],
    ['@Transactional', 'dataSource.transaction(async (manager) => …)', 'nest', 'No built-in declarative transactions; use the manager you are given.'],
    ['Actuator /health', '@nestjs/terminus health checks', 'nest', 'The load balancer\'s health check calls it.'],
    ['@Scheduled', '@nestjs/schedule and @Cron()', 'nest', ''],
    ['SLF4J + Logback', 'Nest Logger or pino, as JSON to CloudWatch', 'nest', ''],
    ['JUnit + Mockito', 'Jest (describe, it, expect, jest.fn)', 'nest', ''],
    ['@SpringBootTest / @MockBean', 'Test.createTestingModule + overrideProvider', 'nest', ''],
    ['MockMvc', 'supertest against app.getHttpServer()', 'nest', 'Apply the same global pipes as main.ts in e2e tests.'],
    ['pom.xml', 'package.json + package-lock.json', 'ts', '`npm ci` installs exactly what the lock file says.'],
    ['mvn verify (lifecycle phases)', 'npm scripts (npm test, npm run build)', 'ts', ''],
    ['Maven multi-module build', 'npm workspaces (monorepo)', 'ts', ''],
    ['CompletableFuture', 'Promise + async/await', 'ts', 'One thread runs your code; awaiting frees it for other requests.'],
    ['Optional<T>', 'T | undefined with ?. and ??', 'ts', ''],
    ['Streams: map / filter / collect', 'Array map / filter / reduce', 'ts', 'Eager, not lazy.'],
    ['Sealed interface + pattern-matching switch', 'Discriminated union + narrowing', 'ts', ''],
    ['Annotations + reflection', 'Decorators + reflect-metadata', 'ts', 'Decorators run when the class is defined.'],
    ['Nominal types (implements)', 'Structural types (matching shape)', 'ts', 'Types are erased: nothing checks them at runtime.'],
    ['JSP / Thymeleaf page rendered on the server', 'Vue single-file component rendered in the browser', 'vue', 'The server sends JSON; the browser builds the page.'],
    ['JavaFX property binding', 'ref / reactive / computed', 'vue', ''],
    ['A session-scoped bean holding UI state', 'A Pinia store', 'vue', ''],
    ['Servlet URL mapping for pages', 'Vue Router routes', 'vue', 'History mode needs the CDN to serve index.html for unknown paths.'],
    ['messages_fr.properties ResourceBundle', 'vue-i18n message files', 'vue', ''],
    ['Selenium', 'Playwright end-to-end tests', 'vue', ''],
    ['Flyway / Liquibase', 'TypeORM migrations (or Prisma Migrate)', 'pg', ''],
    ['Sequence or IDENTITY column', 'GENERATED ALWAYS AS IDENTITY, or uuid with gen_random_uuid()', 'pg', ''],
    ['TIMESTAMP WITH TIME ZONE', 'timestamptz', 'pg', 'Stores an instant in UTC; use it by default.'],
    ['MERGE for upserts', 'INSERT … ON CONFLICT … DO UPDATE', 'pg', 'MERGE also exists in recent versions.'],
    ['HikariCP / JNDI DataSource pool', 'node-postgres pool (TypeORM extra.max) or RDS Proxy', 'pg', 'Tasks × pool size must fit under max_connections.'],
    ['Tomcat / WebLogic server', 'A Node process in a container on ECS Fargate', 'aws', ''],
    ['F5 or hardware load balancer', 'Application Load Balancer + target group health checks', 'aws', ''],
    ['Firewall rules between tiers', 'Security groups that reference each other', 'aws', ''],
    ['Keystore / encrypted properties', 'Secrets Manager or SSM Parameter Store', 'aws', ''],
    ['Service account with a password', 'IAM role with temporary credentials', 'aws', 'No access keys in images or env vars.'],
    ['Ops-run deploy scripts', 'CDK / CloudFormation / Terraform + a CI/CD pipeline', 'aws', '']
  ];

  function renderPhrasebook() {
    var f = '<div class="pb-filter"><label class="sr" for="pb-q">Filter the phrasebook</label>' +
      '<input id="pb-q" type="search" placeholder="Filter, e.g. Transactional, pool, scope" value="' + esc(ui.pbQuery) + '" autocomplete="off">' +
      '<button class="chip" data-act="pbline" data-l="all" aria-pressed="' + (ui.pbLine === 'all') + '">All</button>' +
      ORDER.filter(function (id) { return id !== 'x'; }).map(function (id) {
        return '<button class="chip" data-act="pbline" data-l="' + id + '" aria-pressed="' + (ui.pbLine === id) + '">' + bullet(id, 'sm') + META[id].name + '</button>';
      }).join('') + '</div>';
    app.innerHTML = '<div class="pb"><div class="pb-head"><div><button class="link" data-act="home">← All lines</button></div>' +
      '<h1>Phrasebook</h1><p>The Java and Spring ideas you already know, and what they are called in this stack. Use it as a quick lookup while you work through the lines.</p></div>' +
      f + '<div class="pb-table" id="pb-table"></div></div>';
    renderPbRows();
  }
  function renderPbRows() {
    var q = ui.pbQuery.trim().toLowerCase();
    var rows = PHRASES.filter(function (p) {
      return (ui.pbLine === 'all' || p[2] === ui.pbLine) && (!q || (p[0] + ' ' + p[1] + ' ' + p[3]).toLowerCase().indexOf(q) >= 0);
    });
    var t = $('#pb-table');
    if (!t) return;
    t.innerHTML = '<div class="pb-row head"><span>You know</span><span></span><span>In this stack</span><span></span></div>' +
      (rows.length ? rows.map(function (p) {
        return '<div class="pb-row"><span class="pb-from">' + esc(p[0]) + '</span><span class="pb-arrow" aria-hidden="true">→</span>' +
          '<span class="pb-to"><b>' + fmt(p[1]) + '</b>' + (p[3] ? '<span>' + fmt(p[3]) + '</span>' : '') + '</span>' + bullet(p[2], 'sm') + '</div>';
      }).join('') : '<div class="pb-empty">Nothing matches that filter.</div>');
  }

  /* ---------- render ---------- */
  function render() {
    if (ui.view === 'lesson' && ui.sid && ST[ui.sid]) renderLesson();
    else if (ui.view === 'quiz' && ui.run) renderQuiz();
    else if (ui.view === 'result' && ui.result) renderResult();
    else if (ui.view === 'phrasebook') renderPhrasebook();
    else if (ui.view === 'review-empty') renderReviewEmpty();
    else { ui.view = 'home'; renderHome(); }
    renderTop();
    renderFoot();
  }

  /* ---------- events ---------- */
  function openStation(sid) {
    var s = ST[sid];
    if (!s) return;
    if (!unlocked(s)) {
      var prev = LBY[s.line].stations[s.idx - 1];
      toast('Clear "' + prev.title.replace(/`/g, '') + '" to open this station.');
      return;
    }
    go('lesson', { sid: sid, card: 0 });
  }

  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-act]');
    if (!t || t.disabled) return;
    var act = t.getAttribute('data-act');
    var run = ui.run;
    switch (act) {
      case 'home': go('home'); break;
      case 'open': openStation(t.getAttribute('data-sid')); break;
      case 'card': go('lesson', { card: +t.getAttribute('data-i') }); break;
      case 'prev': go('lesson', { card: ui.card - 1 }); break;
      case 'next': go('lesson', { card: ui.card + 1 }); break;
      case 'quiz': {
        var sid = t.getAttribute('data-sid');
        if (ST[sid] && !unlocked(ST[sid])) { openStation(sid); break; }
        startStationQuiz(sid); break;
      }
      case 'pick': if (run && !run.cur.checked) { run.cur.sel = +t.getAttribute('data-i'); renderQuiz(); } break;
      case 'opick': if (run && !run.cur.checked) { var k = +t.getAttribute('data-i'); run.cur.picked.push(run.cur.pool.splice(k, 1)[0]); renderQuiz(); } break;
      case 'ounpick': if (run && !run.cur.checked) { var j = +t.getAttribute('data-i'); run.cur.pool.push(run.cur.picked.splice(j, 1)[0]); renderQuiz(); } break;
      case 'check': check(); break;
      case 'continue': advance(); break;
      case 'review': startReview(); break;
      case 'phrasebook': go('phrasebook'); break;
      case 'pbline': ui.pbLine = t.getAttribute('data-l'); renderPhrasebook(); break;
      case 'copy': {
        var code = codeStore[+t.getAttribute('data-c')];
        var pre = t.closest('.code').querySelector('pre');
        var fallback = function () {
          try { var r = document.createRange(); r.selectNodeContents(pre); var sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); } catch (err) { /* ignore */ }
          toast('Code selected. Press Ctrl+C (or ⌘C) to copy.');
        };
        try {
          if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(code).then(function () { toast('Copied'); }, fallback);
          else fallback();
        } catch (err) { fallback(); }
        break;
      }
      case 'reset': {
        if (!resetArmed) {
          resetArmed = true; renderFoot();
          clearTimeout(resetTimer);
          resetTimer = setTimeout(function () { resetArmed = false; renderFoot(); }, 4000);
        } else {
          resetArmed = false;
          var keepOpen = state.open;
          state = blank(); state.open = keepOpen;
          persist();
          if (cloud.ref) { clearTimeout(cloud.timer); cloud.ref.set(JSON.parse(JSON.stringify(state))).catch(function () { /* ignore */ }); }
          toast('Progress erased');
          go('home');
        }
        break;
      }
    }
  });

  document.addEventListener('change', function (e) {
    if (e.target && e.target.id === 'open-all') {
      state.open = e.target.checked;
      persist();
      toast(state.open ? 'Every station is open' : 'Stations open in order again');
      render();
    }
  });

  document.addEventListener('input', function (e) {
    if (e.target && e.target.id === 'pb-q') { ui.pbQuery = e.target.value; renderPbRows(); }
  });

  document.addEventListener('keydown', function (e) {
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    var tag = (e.target && e.target.tagName) || '';
    if (tag === 'INPUT' || tag === 'TEXTAREA') return;
    if (ui.view === 'lesson') {
      var n = ST[ui.sid].cards.length;
      if (e.key === 'ArrowRight' && ui.card < n - 1) { e.preventDefault(); go('lesson', { card: ui.card + 1 }); }
      else if (e.key === 'ArrowLeft' && ui.card > 0) { e.preventDefault(); go('lesson', { card: ui.card - 1 }); }
    } else if (ui.view === 'quiz' && ui.run) {
      var run = ui.run, q = Q[run.qids[run.i]], c = run.cur;
      if (e.key === 'Enter') {
        if (tag === 'BUTTON' && e.target.getAttribute('data-act') !== 'check' && e.target.getAttribute('data-act') !== 'continue' && !c.checked) return;
        e.preventDefault();
        if (c.checked) advance(); else check();
      } else if (!c.checked && (q.type === 'mcq' || q.type === 'fill')) {
        var k = 'abcde'.indexOf(e.key.toLowerCase());
        if (k < 0) k = '12345'.indexOf(e.key);
        if (k >= 0 && k < q.options.length) { c.sel = k; renderQuiz(); }
      }
    }
  });

  /* ---------- boot ---------- */
  function start(data) {
    try {
      var u = data && data.ui;
      if (u && u.view === 'lesson' && ST[u.sid]) { ui.view = 'lesson'; ui.sid = u.sid; ui.card = u.card || 0; }
      else if (u && u.view === 'phrasebook') ui.view = 'phrasebook';
    } catch (e) { /* ignore */ }
    render();
    initCloud();
  }
  var hot = window.claude && window.claude.hot;
  try {
    if (hot && typeof hot.snapshot === 'function') {
      hot.snapshot(function () {
        return { ui: { view: ui.view === 'quiz' || ui.view === 'result' ? (ui.sid ? 'lesson' : 'home') : ui.view, sid: ui.sid, card: ui.card } };
      });
    }
  } catch (e) { /* ignore */ }
  if (hot && typeof hot.ready === 'function') hot.ready(start);
  else start((hot && hot.data) || {});
})();

</script>
</body>
</html>
