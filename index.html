    {
      id: "nest-4",
      title: "Validation with pipes",
      zone: 2,
      minutes: 12,
      summary: "Validate and convert request input with ValidationPipe, class-validator DTOs and the built-in parse pipes.",
      cards: [
        {
          h: "Pipes: transform or reject one argument",
          body: "<p>A pipe is a class with <code>transform(value, metadata)</code>. For each handler argument, Nest calls the bound pipes with the raw value and an <code>ArgumentMetadata</code>: <code>type</code> (<code>'body' | 'query' | 'param' | 'custom'</code>), <code>metatype</code> (the declared class, from <code>design:paramtypes</code>) and <code>data</code> (the name passed to the decorator, e.g. <code>'id'</code>).</p><p>Whatever <code>transform</code> returns replaces the argument. Throwing, usually <code>BadRequestException</code>, aborts the request before the handler runs. Pipes bind to one parameter (<code>@Param('tag', AssetTagPipe)</code>), to a method or controller (<code>@UsePipes</code>), or globally.</p>",
          code: `import {
  ArgumentMetadata, BadRequestException,
  Injectable, PipeTransform,
} from '@nestjs/common';

@Injectable()
export class AssetTagPipe implements PipeTransform<string, string> {
  transform(value: string, meta: ArgumentMetadata): string {
    const tag = (value ?? '').trim().toUpperCase();
    if (!/^[A-Z]{3}-\\d{5}$/.test(tag)) {
      throw new BadRequestException(
        \`\${meta.data} must look like ABC-12345\`,
      );
    }
    return tag;
  }
}`,
          lang: "ts"
        },
        {
          h: "Global `ValidationPipe` vs `@Valid`",
          body: "<p>Bean Validation runs where you ask for it with <code>@Valid</code>. With a global <code>ValidationPipe</code>, Nest validates every argument whose declared type is a DTO class, on every route. Failure throws <code>BadRequestException</code>; the default body is a 400 whose <code>message</code> is an array of strings such as <em>title must be a string</em>. Spring gives you <code>MethodArgumentNotValidException</code> for a <code>@ControllerAdvice</code> to format; in Nest you reshape it with an exception filter or the pipe's <code>exceptionFactory</code>.</p><p>The pipe needs the <code>class-validator</code> and <code>class-transformer</code> packages installed.</p>",
          bridge: {
            left: { label: "Spring Boot", lang: "java", code: `public record CreateWorkOrderRequest(
    @NotBlank @Size(max = 120) String title,
    @NotNull UUID assetId,
    @Min(1) @Max(5) Integer priority) {}

@PostMapping
public WorkOrderDto create(
    @Valid @RequestBody CreateWorkOrderRequest req) {
  // invalid -> MethodArgumentNotValidException -> 400
}` },
            right: { label: "NestJS", lang: "ts", code: `export class CreateWorkOrderDto {
  @IsString() @Length(1, 120)
  title: string;

  @IsUUID()
  assetId: string;

  @IsOptional() @IsInt() @Min(1) @Max(5)
  priority?: number;
}

// main.ts: applies to every route
app.useGlobalPipes(new ValidationPipe({
  whitelist: true,
  forbidNonWhitelisted: true,
  transform: true,
}));` }
          }
        },
        {
          h: "What `whitelist`, `forbidNonWhitelisted` and `transform` do",
          body: "<p>Internally the pipe always calls <code>plainToInstance(CreateWorkOrderDto, body)</code> and runs class-validator on that instance. The options decide what happens around it. Take a body of <code>{ title, assetId, status: 'CLOSED' }</code> where the DTO has no <code>status</code>:</p><ul><li><code>whitelist: true</code>: properties with no class-validator decorator are stripped, so <code>status</code> disappears. The decorators are the whitelist; a bare TypeScript field declaration emits nothing and doesn't count.</li><li><code>forbidNonWhitelisted: true</code>: instead of stripping, reject with 400 <em>property status should not exist</em>.</li><li><code>transform: true</code>: the handler receives the DTO instance (so <code>instanceof</code>, default values and methods work), and primitive params are converted to their declared type, so <code>@Param('id') id: number</code> arrives as a number. Without it you get a plain object back.</li></ul>",
          tip: "<p>Gotcha: a field with no rule of its own still needs a decorator to survive <code>whitelist</code>. <code>@Allow()</code> marks it as permitted.</p>"
        },
        {
          h: "Nested objects, arrays and query strings need `@Type`",
          body: "<p><code>plainToInstance</code> only knows the top-level class. For <code>items: ChecklistItemDto[]</code> the emitted design type is just <code>Array</code>, because element types are erased. Without <code>@Type</code> the elements stay plain objects, class-validator has no class metadata for them, and the rules on <code>ChecklistItemDto</code> are not applied. <code>@Type(() =&gt; ChecklistItemDto)</code> tells class-transformer what to build; <code>@ValidateNested({ each: true })</code> tells class-validator to recurse.</p><p>Query values are always strings, so <code>@Type(() =&gt; Number)</code> converts <code>?page=2</code> before <code>@IsInt()</code> checks it. The global alternative is <code>transformOptions: { enableImplicitConversion: true }</code>, which converts from the reflected property types.</p>",
          code: `import { Type } from 'class-transformer';
import {
  IsArray, IsEnum, IsInt, IsOptional, IsString,
  Length, Min, ValidateNested,
} from 'class-validator';

export class ChecklistItemDto {
  @IsString() @Length(1, 200)
  text: string;
}

export class CreateInspectionDto {
  @IsEnum(InspectionKind)
  kind: InspectionKind;

  @IsArray()
  @ValidateNested({ each: true })
  @Type(() => ChecklistItemDto)
  items: ChecklistItemDto[];
}

export class ListInspectionsQuery {
  @IsOptional() @Type(() => Number) @IsInt() @Min(1)
  page?: number;
}`,
          lang: "ts",
          tip: "<p>Gotcha: implicit conversion turns <code>?archived=false</code> into <code>true</code> for a boolean field, because <code>Boolean('false')</code> is <code>true</code>. Convert booleans explicitly.</p>"
        },
        {
          h: "Built-in parse pipes",
          body: "<p>Parse pipes convert a single value and throw 400 when they can't: <code>ParseIntPipe</code>, <code>ParseFloatPipe</code>, <code>ParseBoolPipe</code>, <code>ParseUUIDPipe</code>, <code>ParseEnumPipe</code>, <code>ParseArrayPipe</code>. Pass the class and Nest instantiates it; pass an instance to configure it, as in <code>new ParseUUIDPipe({ version: '4' })</code>.</p><p>Pipes on one parameter run left to right. <code>DefaultValuePipe</code> replaces <code>undefined</code> with a default, so it must come <em>before</em> <code>ParseIntPipe</code>; otherwise the parse pipe sees <code>undefined</code> and rejects the request. Spring folds both jobs into <code>@RequestParam(defaultValue = \"1\") int page</code>.</p>",
          code: `@Get()
list(
  @Query('page', new DefaultValuePipe(1), ParseIntPipe) page: number,
  @Query('status', new ParseEnumPipe(Status)) status: Status,
) {}

@Get(':id')
findOne(@Param('id', ParseUUIDPipe) id: string) {}`,
          lang: "ts"
        },
        {
          h: "Update DTOs with mapped types",
          body: "<p>These helpers return a new class at runtime, which is why they work where TypeScript's <code>Partial&lt;T&gt;</code> can't: <code>Partial&lt;T&gt;</code> exists only for the compiler and gives <code>ValidationPipe</code> nothing. <code>PartialType</code> copies the validation and transformation metadata from the source class and makes every property optional, so a PATCH body is validated only for the fields it contains. <code>PickType</code> and <code>OmitType</code> keep or drop named properties; <code>IntersectionType</code> combines two classes.</p><p>If the project uses <code>@nestjs/swagger</code>, import the same helpers from there so the OpenAPI schema is inherited too. Spring has no direct equivalent; you'd write separate records or use validation groups.</p>",
          code: `import {
  OmitType, PartialType, PickType,
} from '@nestjs/mapped-types';

export class UpdateWorkOrderDto
  extends PartialType(CreateWorkOrderDto) {}

export class RenameWorkOrderDto
  extends PickType(CreateWorkOrderDto, ['title'] as const) {}

export class ImportWorkOrderDto
  extends OmitType(CreateWorkOrderDto, ['assetId'] as const) {}`,
          lang: "ts"
        }
      ],
      quiz: [
        {
          id: "nest-4-q1", type: "bug",

        {

          code: `export class CreateInspectionDto {

          lang: "ts",
          options: ["@Type(() => ChecklistItemDto)", "@IsType(ChecklistItemDto)", "@Nested(ChecklistItemDto)", "@ArrayOf(ChecklistItemDto)"],

          explain: "<p>The reflected type of <code>items</code> is plain <code>Array</code>, so class-transformer can't know the element class. <code>@Type</code> from class-transformer supplies it, the elements become <code>ChecklistItemDto</code> instances, and <code>@ValidateNested</code> then has metadata to validate against.</p>"

        {

          answer: 0,
          explain: "<p>The pipe always builds an instance to validate it. Without <code>transform</code> it returns a plain object to the handler (stripped, because whitelisting is a validation option). Turn on <code>transform</code> if you rely on <code>instanceof</code>, default property values or DTO methods.</p>"

        {

          options: [

        {

          q: "<p>Why write <code>class UpdateDto extends PartialType(CreateDto) {}</code> instead of <code>type UpdateDto = Partial&lt;CreateDto&gt;</code>?</p>",

    {
      id: "nest-5",
      title: "The request lifecycle",
      zone: 2,
      minutes: 13,
      summary: "Trace a request through middleware, guards, interceptors, pipes and filters, and choose the right hook for a cross-cutting concern.",
      cards: [
        {
          h: "The pipeline, in order",
          body: "<ol><li><strong>Middleware</strong>: Express-style <code>(req, res, next)</code>. Global (<code>app.use</code>) first, then module-bound.</li><li><strong>Guards</strong>: may this request proceed? Global, then controller, then method.</li><li><strong>Interceptors, before</strong>: code that runs before <code>next.handle()</code>. Global, controller, method.</li><li><strong>Pipes</strong>: transform and validate each argument. Global, controller, method, parameter.</li><li><strong>Route handler</strong>.</li><li><strong>Interceptors, after</strong>: operators on the result stream, unwinding in reverse: method, controller, global.</li><li><strong>Exception filters</strong>: only if something threw. Method, then controller, then global; the first match handles it.</li></ol><p>Within one level, items run in the order listed: <code>@UseGuards(A, B)</code> runs A, then B.</p>",
          tip: "<p>Gotcha: Nest writes the response only after the interceptors' after-phase completes, so an interceptor can still reshape the body the handler returned.</p>"
        },
        {
          h: "Mapping it to Spring",

          h: "`ExecutionContext`: what guards and interceptors see",
          body: "<p><code>ExecutionContext</code> extends <code>ArgumentsHost</code>, which wraps the raw handler arguments (they differ between HTTP, microservices and WebSockets). It adds <code>getClass()</code> and <code>getHandler()</code>, and those two are the keys to decorator metadata: <code>@Roles('supervisor')</code> on a method stores data on that function object, and a guard reads it back through <code>Reflector</code>.</p><p>Middleware never receives an <code>ExecutionContext</code>. It sees only <code>req</code>, <code>res</code> and <code>next</code>, so it can't know which handler will run or what metadata it carries. That's the mechanical reason authorization belongs in guards.</p>",

          h: "Interceptors wrap the handler with RxJS",
          body: "<p><code>next.handle()</code> returns an <code>Observable</code> of the handler's result, and the handler does not run until Nest subscribes to it. Code before <code>next.handle()</code> is the before-phase. Operators piped onto the stream (<code>map</code>, <code>tap</code>, <code>catchError</code>, <code>timeout</code>) are the after-phase, and they unwind in reverse binding order, so a global interceptor wraps everything inside it.</p><p>Return a different <code>Observable</code> without calling <code>next.handle()</code> and the handler is skipped entirely. That's how a cache interceptor answers from cache.</p>",
          code: `import {
  CallHandler, ExecutionContext, Injectable,
  Logger, NestInterceptor,
} from '@nestjs/common';
import { Observable, tap } from 'rxjs';

@Injectable()
export class TimingInterceptor implements NestInterceptor {
  private readonly logger = new Logger('Timing');

  intercept(
    ctx: ExecutionContext,
    next: CallHandler,
  ): Observable<unknown> {
    const start = Date.now(); // before the handler
    const name = \`\${ctx.getClass().name}.\${ctx.getHandler().name}\`;
    return next.handle().pipe( // handler runs on subscribe
      tap(() => this.logger.log(\`\${name} \${Date.now() - start}ms\`)),
    );
  }
}`,

          h: "Where each piece binds",
          body: "<p>Decorators bind at controller or method level. Global binding has two forms. <code>app.useGlobalGuards(new X())</code> in <code>main.ts</code> runs outside any module, so <code>X</code> gets no injected dependencies unless you pass them by hand. The <code>APP_GUARD</code>, <code>APP_PIPE</code>, <code>APP_INTERCEPTOR</code> and <code>APP_FILTER</code> tokens register the same thing as a provider, so the container builds it and it can inject <code>Reflector</code> or <code>ConfigService</code>. It is global whichever module declares it.</p><p>Middleware binds in a module that implements <code>NestModule</code>, via <code>consumer.apply(X).forRoutes(...)</code>, or with <code>app.use()</code> for plain Express middleware such as helmet.</p>",
          code: `@UseGuards(SiteAccessGuard)

@UseFilters(WorkOrderLockedFilter)
@Controller('work-orders')
export class WorkOrdersController {}

@Module({

    { provide: APP_INTERCEPTOR, useClass: TimingInterceptor },

}`,

          body: "<p>An exception thrown from a guard, interceptor, pipe or handler, whether synchronous, a rejected <code>Promise</code> or an errored <code>Observable</code>, ends up in the filters. They resolve from the most specific level outwards: method-bound, then controller, then global. The first filter whose <code>@Catch()</code> matches handles it, and the others never see that exception. If none matches, Nest's built-in filter writes the default JSON. <code>@Catch()</code> with no argument matches everything.</p><p>This is <code>@ControllerAdvice</code> with <code>@ExceptionHandler(WorkOrderLockedException.class)</code>.</p>",
          code: `@Catch(WorkOrderLockedError)
export class WorkOrderLockedFilter implements ExceptionFilter {
  catch(err: WorkOrderLockedError, host: ArgumentsHost) {

    res.status(409).json({

}`,

          tip: "<p>Gotcha: interceptors see an error first. It travels back through their streams, where <code>catchError</code> can map or swallow it, before any filter runs.</p>"

      id: "nest-6",
      title: "Data access with TypeORM",

      summary: "Map entities to Postgres with TypeORM, load relations deliberately, run transactions correctly and evolve the schema with migrations.",
      cards: [
        {
          h: "Wiring TypeORM into Nest",
          body: "<p><code>TypeOrmModule.forRootAsync</code> creates one <code>DataSource</code>, which owns a connection pool from the <code>pg</code> driver, and registers it as a provider. <code>useFactory</code> plus <code>inject</code> means the options are built from <code>ConfigService</code> after config has loaded. <code>autoLoadEntities: true</code> registers every entity that any module passes to <code>forFeature</code>, so you don't maintain a list of entity files.</p><p>Spring Boot auto-configures a <code>DataSource</code> and <code>EntityManagerFactory</code> from properties. Here you write that factory yourself.</p><p>TypeORM is one common choice. Prisma is the other (a <code>schema.prisma</code> file, a generated typed client, <code>prisma migrate</code>), and MikroORM, with its unit of work and identity map, is closest to Hibernate. Check which your team uses before going deep.</p>",
          code: `// app.module.ts (ConfigModule is global: see nest-7)
TypeOrmModule.forRootAsync({
  inject: [ConfigService],
  useFactory: (config: ConfigService) => ({
    type: 'postgres',
    host: config.getOrThrow<string>('DB_HOST'),
    port: Number(config.getOrThrow('DB_PORT')),
    username: config.getOrThrow<string>('DB_USER'),
    password: config.getOrThrow<string>('DB_PASSWORD'),
    database: config.getOrThrow<string>('DB_NAME'),
    autoLoadEntities: true,
    synchronize: false,
  }),
}),`,
          lang: "ts"
        },
        {
          h: "Entities, and which side holds the FK",
          body: "<p>Decorators record mapping metadata, the same job JPA annotations do. Give a column an explicit <code>type</code> whenever the TypeScript type is ambiguous to reflection: a union such as <code>Date | null</code>, or an enum.</p><p>The foreign key column (<code>assetId</code> by default) lives on the <code>@ManyToOne</code> side, like JPA's owning side. <code>@OneToMany</code> is the inverse: it creates no column and requires the matching <code>@ManyToOne</code>. The <code>() =&gt; Asset</code> arrow functions defer the class reference so two entity files can import each other.</p>",
          code: `@Entity('work_orders')
export class WorkOrder {
  @PrimaryGeneratedColumn('uuid')
  id: string;

  @Column({ length: 120 })
  title: string;

  @Column({ type: 'enum', enum: Status, default: Status.Open })
  status: Status;

  @Column({ type: 'timestamptz', nullable: true })
  dueAt: Date | null;

  @CreateDateColumn({ type: 'timestamptz' })
  createdAt: Date;

  @ManyToOne(() => Asset, (asset) => asset.workOrders, {
    nullable: false,
  })
  asset: Asset;
}

// in asset.entity.ts
@OneToMany(() => WorkOrder, (wo) => wo.asset)
workOrders: WorkOrder[];`,
          lang: "ts",
          tip: "<p>Gotcha: the <code>pg</code> driver returns <code>bigint</code> and <code>numeric</code> columns as strings, because a JavaScript number can't hold every value exactly. Type those fields as <code>string</code> or add a column transformer.</p>"
        },
        {
          h: "Repositories: `forFeature` + `@InjectRepository`",
          body: "<p><code>TypeOrmModule.forFeature([WorkOrder])</code> registers a <code>Repository&lt;WorkOrder&gt;</code> provider in this module under a generated token, and <code>@InjectRepository(WorkOrder)</code> is <code>@Inject(thatToken)</code>. The explicit token is needed because <code>Repository&lt;WorkOrder&gt;</code> erases to plain <code>Repository</code> at runtime; type alone can't tell entities apart.</p><p>There are no derived query methods. You don't declare an interface for TypeORM to implement; you pass options objects to <code>find</code>, <code>findOne</code>, <code>findOneBy</code>, <code>count</code> and friends.</p>",
          bridge: {

}

@Service

}` },

  imports: [TypeOrmModule.forFeature([WorkOrder])],
  providers: [WorkOrdersService],
})
export class WorkOrdersModule {}

@Injectable()
export class WorkOrdersService {
  constructor(
    @InjectRepository(WorkOrder)
    private readonly repo: Repository<WorkOrder>,
  ) {}

  listOpen() {
    return this.repo.find({

  }
}` }

        {
          h: "Find options vs QueryBuilder",
          body: "<p>Find options are typed objects that compile to parameterized SQL and cover most CRUD. An array for <code>where</code> means OR. Operators such as <code>In</code>, <code>LessThan</code>, <code>ILike</code> and <code>IsNull</code> come from <code>typeorm</code>.</p><p><code>createQueryBuilder</code> is the escape hatch for joins, grouping and aggregates, the role Criteria or JPQL plays. Always pass values as named parameters (<code>:siteId</code>); building the string with template literals is SQL injection. <code>getMany()</code> maps rows to entities; <code>getRawMany()</code> returns plain rows for aggregates. For hand-written SQL, <code>dataSource.query(sql, params)</code> takes Postgres-style <code>$1</code> placeholders.</p>",
          code: `import { In, LessThan } from 'typeorm';

const overdue = await this.repo.find({
  where: {
    status: In([Status.Open, Status.OnHold]),
    dueAt: LessThan(new Date()),
  },
  order: { dueAt: 'ASC' },
  take: 50,
});

const counts = await this.repo
  .createQueryBuilder('wo')
  .innerJoin('wo.asset', 'asset')
  .select('wo.status', 'status')
  .addSelect('COUNT(*)', 'total')
  .where('asset.siteId = :siteId', { siteId })
  .groupBy('wo.status')
  .getRawMany();`,

        },
        {
          h: "Relations load only when you ask",
          body: "<p>Hibernate defaults <code>@ManyToOne</code> to eager and gives you lazy proxies for collections. TypeORM has no proxies: a relation you didn't request is simply <code>undefined</code> on the object. No <code>LazyInitializationException</code>, and no hidden query either.</p><p>Ask explicitly with the <code>relations</code> option or <code>leftJoinAndSelect</code>. <code>eager: true</code> on a relation applies to <code>find*</code> methods only, never to QueryBuilder. Lazy relations typed as <code>Promise&lt;Asset&gt;</code> run a query when awaited.</p><p>The N+1 problem shows up when you loop over a result and query once per row, or await a lazy relation per row. Fix it with a join, or one <code>In([...ids])</code> query and an in-memory map.</p>",
          code: `// asset is undefined: no relations requested
const wo = await this.repo.findOneBy({ id });
wo?.asset.name; // TypeError

// find options
await this.repo.findOne({
  where: { id },
  relations: { asset: true },
});

// QueryBuilder
await this.repo
  .createQueryBuilder('wo')
  .leftJoinAndSelect('wo.asset', 'asset')
  .where('wo.id = :id', { id })
  .getOne();`,
          lang: "ts"
        },
        {
          h: "Saving and transactions: no persistence context",
          body: "<p>TypeORM has no persistence context: no dirty checking, no flush at commit, no identity map (loading the same row twice gives two objects). Changing a property does nothing until you call <code>save()</code>. <code>save()</code> first selects the row to decide between INSERT and UPDATE, then writes the columns that differ; <code>insert()</code> and <code>update()</code> send one statement with no select.</p><p>There's no built-in <code>@Transactional</code>. <code>dataSource.transaction()</code> takes one connection from the pool, runs BEGIN, hands you an <code>EntityManager</code> bound to that connection, and COMMITs when your callback resolves or ROLLBACKs if it throws. Only queries made through that <code>manager</code> are inside the transaction. <code>this.repo</code> uses whatever pooled connection is free.</p>",
          bridge: {
            left: { label: "Spring + JPA", lang: "java", code: `@Transactional
public void close(UUID id) {
  WorkOrder wo = repo.findById(id).orElseThrow();
  wo.setStatus(Status.CLOSED);   // dirty checking
  audit.save(new AuditEntry(wo)); // flushed at commit
}` },
            right: { label: "NestJS + TypeORM", lang: "ts", code: `async close(id: string) {
  await this.dataSource.transaction(async (manager) => {
    const wo = await manager.findOneByOrFail(WorkOrder, { id });
    wo.status = Status.Closed;
    await manager.save(wo); // explicit
    await manager.insert(AuditEntry, {
      workOrderId: wo.id,
      action: 'CLOSED',
    });
  });
}` }
          },
          tip: "<p>On the job: <code>manager.getRepository(WorkOrder)</code> gives a repository bound to the transaction if you prefer the repository API inside the callback. Some teams add a library for decorator-style transactions; check before adding one.</p>"

          body: "<p><code>forRoot</code> reads the listed <code>.env</code> files with dotenv. Variables already present in <code>process.env</code> take precedence over the files, and among files the first one that defines a key wins. It then runs your validation over the merged result and registers <code>ConfigService</code>. <code>isGlobal: true</code> makes <code>ConfigService</code> injectable in every module without importing <code>ConfigModule</code> again.</p><p>If validation throws, <code>NestFactory.create</code> rejects and the process exits before it listens. That's what you want on ECS: a task with a missing variable fails its deployment at once, where a lazily read variable would surface as 500s hours later.</p>",

          h: "Validating env vars with class-validator",
          body: "<p>The <code>validate</code> option receives the raw key/value record. The usual pattern reuses the DTO tooling from nest-4: convert to a class instance, run <code>validateSync</code>, throw on errors. <code>ConfigService</code> serves the values your function returns, so conversions made here stick: <code>DB_PORT</code> comes back as a number.</p><p>The alternative is <code>validationSchema</code> with a Joi schema. Either way you get what <code>@ConfigurationProperties</code> with <code>@Validated</code> gives you in Spring: startup fails with a list of what's wrong.</p>",
          code: `import { plainToInstance } from 'class-transformer';
import {
  IsInt, IsString, IsUrl, Max, Min, validateSync,
} from 'class-validator';

export class EnvVars {
  @IsString() DB_HOST: string;
  @IsInt() @Min(1) @Max(65535) DB_PORT: number;
  @IsString() DB_PASSWORD: string;
  @IsUrl({ require_tld: false }) OIDC_ISSUER: string;
}

export function validate(raw: Record<string, unknown>) {
  const env = plainToInstance(EnvVars, raw, {
    enableImplicitConversion: true, // '5432' -> 5432
  });
  const errors = validateSync(env, { skipMissingProperties: false });

}`,

          body: "<p>Spring Boot layers <code>application.yml</code>, <code>application-{profile}.yml</code>, environment variables and more, and <code>SPRING_PROFILES_ACTIVE</code> picks the layer. Nest has no profile system. The convention is twelve-factor: the code carries defaults at most, and each environment supplies its own variables.</p><p><code>NODE_ENV=production</code> is a convention that some libraries read to change behaviour, so set it in deployed containers. Avoid using it as your own dev/test/staging/prod switch; staging should run with <code>production</code> too, differing only in its variables.</p><p>Locally, keep a git-ignored <code>.env</code> and commit a <code>.env.example</code> listing every key with dummy values.</p>",

      title: "Auth: JWT, guards, roles",

      minutes: 15,
      summary: "Validate OIDC access tokens with passport-jwt and JWKS, then enforce authentication globally and roles per handler with guards.",
      cards: [
        {
          h: "Guards: `CanActivate`, 401 and 403",
          body: "<p>A guard is a provider with <code>canActivate(context)</code> returning <code>boolean</code>, <code>Promise&lt;boolean&gt;</code> or <code>Observable&lt;boolean&gt;</code>. <code>true</code> lets the request continue to interceptors and pipes. <code>false</code> makes Nest throw <code>ForbiddenException</code>: a 403 with message <em>Forbidden resource</em>. For any other status or message, throw the exception yourself.</p><p>Keep the two codes distinct. <strong>401</strong> means there's no valid identity: token missing, expired, badly signed, or for another audience. <strong>403</strong> means the identity is known and lacks permission. A client reacts differently: re-authenticate on 401, show an access-denied message on 403.</p>",
          code: `@Injectable()
export class SiteAccessGuard implements CanActivate {
  canActivate(ctx: ExecutionContext): boolean {
    const req = ctx.switchToHttp().getRequest();
    if (!req.user) throw new UnauthorizedException(); // 401
    return req.user.sites.includes(req.params.siteId); // 403
  }
}`,
          lang: "ts"
        },
        {
          h: "Validating OIDC tokens: passport-jwt + JWKS",
          body: "<p>Your API is a resource server. It never sees passwords; it verifies bearer tokens issued by the identity provider (Keycloak, Microsoft Entra ID, or whatever your team uses). passport-jwt reads the <code>kid</code> from the token header; <code>passportJwtSecret</code> from jwks-rsa fetches the provider's public keys from its JWKS URI (listed as <code>jwks_uri</code> in <code>/.well-known/openid-configuration</code>), caches them, and returns the matching key. passport-jwt then verifies the signature, expiry, issuer and audience.</p><p>Only then does it call <code>validate()</code> with the decoded claims. Its return value becomes <code>request.user</code>; returning <code>null</code> or throwing gives a 401. Pinning <code>algorithms</code> stops a token from choosing its own.</p>",
          code: `import { Injectable } from '@nestjs/common';
import { ConfigService } from '@nestjs/config';
import { PassportStrategy } from '@nestjs/passport';
import { passportJwtSecret } from 'jwks-rsa';
import { ExtractJwt, Strategy } from 'passport-jwt';

@Injectable()
export class JwtStrategy extends PassportStrategy(Strategy) {
  constructor(config: ConfigService) {
    super({
      jwtFromRequest: ExtractJwt.fromAuthHeaderAsBearerToken(),
      secretOrKeyProvider: passportJwtSecret({
        jwksUri: config.getOrThrow('OIDC_JWKS_URI'),
        cache: true,
        rateLimit: true,
      }),
      issuer: config.getOrThrow('OIDC_ISSUER'),
      audience: config.getOrThrow('OIDC_AUDIENCE'),
      algorithms: ['RS256'],
    });
  }

  validate(claims: TokenClaims): AuthUser {
    return { id: claims.sub, roles: rolesFrom(claims) };
  }
}`,

        {
          h: "Authenticated by default: global guard + `@Public()`",
          body: "<p><code>AuthGuard('jwt')</code> from <code>@nestjs/passport</code> runs the strategy registered under the name <code>'jwt'</code>, which is passport-jwt's default name. Register <code>JwtStrategy</code> as a provider in an auth module that imports <code>PassportModule</code>.</p><p>Binding the guard with <code>APP_GUARD</code> makes every route require a valid token, so a forgotten decorator fails closed. <code>@Public()</code> stores metadata the guard checks first, for the health check and anything else that must stay open. Several <code>APP_GUARD</code> providers run in registration order, so register authentication before roles.</p>",
          code: `export const IS_PUBLIC = 'isPublic';
export const Public = () => SetMetadata(IS_PUBLIC, true);

@Injectable()
export class JwtAuthGuard extends AuthGuard('jwt') {
  constructor(private readonly reflector: Reflector) {
    super();
  }

  canActivate(ctx: ExecutionContext) {
    const isPublic = this.reflector.getAllAndOverride<boolean>(
      IS_PUBLIC,
      [ctx.getHandler(), ctx.getClass()],
    );
    return isPublic ? true : super.canActivate(ctx);
  }
}

// auth.module.ts providers, in this order
{ provide: APP_GUARD, useClass: JwtAuthGuard },
{ provide: APP_GUARD, useClass: RolesGuard },`,

          h: "Roles: metadata plus `Reflector`",
          body: "<p><code>SetMetadata(key, value)</code> returns a decorator that stores <code>value</code> on the method or class through reflect-metadata. The guard reads it back via <code>ctx.getHandler()</code> and <code>ctx.getClass()</code>. <code>getAllAndOverride</code> checks the targets in order and returns the first defined value, so a method-level <code>@Roles</code> overrides the class-level one; <code>getAllAndMerge</code> combines them instead. <code>Reflector.createDecorator()</code> is a newer typed alternative that bundles the key and the decorator.</p><p>Roles come from token claims, and the claim differs by provider: Keycloak puts realm roles in <code>realm_access.roles</code>; Entra ID sends app roles in a <code>roles</code> claim. Map them to <code>user.roles</code> in <code>validate()</code> so the guard stays provider-neutral.</p>",
          code: `export enum Role { Planner = 'planner', Supervisor = 'supervisor' }
export const ROLES = 'roles';
export const Roles = (...roles: Role[]) => SetMetadata(ROLES, roles);

@Injectable()
export class RolesGuard implements CanActivate {
  constructor(private readonly reflector: Reflector) {}

  canActivate(ctx: ExecutionContext): boolean {
    const required = this.reflector.getAllAndOverride<Role[]>(
      ROLES,
      [ctx.getHandler(), ctx.getClass()],
    );
    if (!required?.length) return true;
    const user: AuthUser | undefined =
      ctx.switchToHttp().getRequest().user;
    return required.some((r) => user?.roles.includes(r));
  }
}

@Roles(Role.Supervisor)
@Post(':id/approve')
approve(@Param('id', ParseUUIDPipe) id: string) {}`,

      cards: [
        {
          h: "Jest for a JUnit and Mockito developer",
          body: "<p><code>describe</code>/<code>it</code> stand in for the test class and <code>@Test</code>; <code>beforeEach</code> for <code>@BeforeEach</code>. <code>jest.fn()</code> is a mock function that records its calls; <code>mockResolvedValue(v)</code> makes it return <code>Promise.resolve(v)</code>; <code>toHaveBeenCalledWith</code> is <code>verify</code>. <code>toBe</code> compares with <code>Object.is</code> (identity for objects), <code>toEqual</code> compares structure: think <code>assertSame</code> vs <code>assertEquals</code>.</p><p>You don't need <code>@Mock</code> or <code>@InjectMocks</code>. TypeScript types are structural, so any object with the methods the code calls will do, and a service is a plain class you can construct with <code>new</code>.</p>",

class WorkOrderServiceTest {

      id: "nest-10",
      title: "Production-ready Nest",

      summary: "Ship a Nest API to ECS with consistent errors, structured logs, health checks, graceful shutdown, basic hardening and OpenAPI docs.",
      cards: [
        {
          h: "One error body for everything",
          body: "<p><code>@Catch()</code> with no argument catches every exception, including non-HTTP ones. Register the filter with <code>APP_FILTER</code> so it can inject dependencies and so e2e tests that import <code>AppModule</code> get it too. Log 5xx errors with their stack on the server; send the client a stable shape with no stack traces or SQL.</p><p>This is also where domain errors get mapped: TypeORM's <code>EntityNotFoundError</code> to 404, your own <code>WorkOrderLockedError</code> to 409, so services don't need HTTP types. It plays the part of <code>@RestControllerAdvice</code>; if your team standardizes on RFC 9457 problem details, this filter is where you'd build them.</p>",
          code: `@Catch()
export class AllExceptionsFilter implements ExceptionFilter {
  private readonly logger = new Logger(AllExceptionsFilter.name);

  catch(exception: unknown, host: ArgumentsHost) {
    const ctx = host.switchToHttp();
    const req = ctx.getRequest<Request>();
    const res = ctx.getResponse<Response>();
    const isHttp = exception instanceof HttpException;
    const status = isHttp ? exception.getStatus() : 500;

    if (status >= 500) this.logger.error(exception);
    res.status(status).json({
      statusCode: status,
      // ValidationPipe details stay inside getResponse()
      detail: isHttp ? exception.getResponse() : 'Internal error',
      path: req.url,
      requestId: req.header('x-request-id'),
    });
  }
}`,
          lang: "ts"
        },
        {
          h: "Structured JSON logs for CloudWatch",
          body: "<p>On ECS, the <code>awslogs</code> log driver ships each line the container writes to stdout to CloudWatch Logs. If each line is one JSON object, CloudWatch Logs Insights discovers its fields, so you can filter by request id or count errors by route instead of grepping text.</p><p>Nest's built-in <code>Logger</code> prints human-readable lines by default; newer versions' <code>ConsoleLogger</code> can emit JSON. <code>nestjs-pino</code> adds an automatic log line per request, request ids, redaction and a fast JSON logger. <code>bufferLogs</code> holds bootstrap messages until pino is attached. After <code>useLogger</code>, the <code>new Logger(WorkOrdersService.name)</code> calls in your services write through pino, so service code doesn't change.</p>",
          code: `// app.module.ts
LoggerModule.forRoot({
  pinoHttp: {
    level: process.env.LOG_LEVEL ?? 'info',
    genReqId: (req, res) => {
      const id = req.headers['x-request-id'] ?? randomUUID();
      res.setHeader('x-request-id', id);
      return id;
    },
    redact: ['req.headers.authorization', 'req.headers.cookie'],
  },
}),

// main.ts (Logger imported from 'nestjs-pino')
const app = await NestFactory.create(AppModule, { bufferLogs: true });
app.useLogger(app.get(Logger));`,
          lang: "ts",
          tip: "<p>Gotcha: without <code>redact</code>, a request log line includes headers, and the <code>Authorization</code> header carries a usable bearer token. Treat logs as sensitive, especially for Protected B workloads.</p>"
        },
        {
          h: "Correlation ids across async code",
          body: "<p>Spring's MDC sits on a <code>ThreadLocal</code>, which works because a servlet request owns its thread. Node interleaves many requests on one thread, so a thread-bound or plain global value would mix them up. <code>AsyncLocalStorage</code> follows async continuations instead: a store set with <code>run()</code> is visible to every callback and <code>await</code> that descends from it, and to nothing else.</p><p>That is how per-request context (request id, user id) reaches log lines and outgoing calls without request-scoped providers. Accept an incoming <code>x-request-id</code> or create one, echo it in the response, and forward it on calls to other services. The ALB also adds an <code>X-Amzn-Trace-Id</code> header that is worth logging.</p>",
          bridge: {
            left: { label: "Spring (servlet filter)", lang: "java", code: `MDC.put("requestId", requestId);
try {
  chain.doFilter(req, res);
} finally {
  MDC.remove("requestId");
}
// MDC is a ThreadLocal:
// one request per thread` },
            right: { label: "NestJS (middleware)", lang: "ts", code: `import { AsyncLocalStorage } from 'node:async_hooks';

export const als = new AsyncLocalStorage<{ requestId: string }>();

use(req: Request, res: Response, next: NextFunction) {
  const requestId = req.header('x-request-id') ?? randomUUID();
  res.setHeader('x-request-id', requestId);
  als.run({ requestId }, () => next());
}

// anywhere later, across awaits:
als.getStore()?.requestId;` }
          }

        {
          h: "Health checks with Terminus",
          body: "<p><code>@nestjs/terminus</code> runs health indicators and returns 200 with <code>status: 'ok'</code>, or 503 with details of what failed. A <strong>liveness</strong> check asks whether the process works and shouldn't touch dependencies. A <strong>readiness</strong> check asks whether this instance can serve traffic, so it pings the database. Mark the controller <code>@Public()</code> and keep it out of the global prefix if the target group expects <code>/health</code>.</p><p>On ECS behind an ALB, the target group health check decides routing, and ECS replaces tasks that fail it. If that check includes the DB ping, a database outage makes every task unhealthy and ECS churns them all without fixing anything. Decide deliberately with your team which endpoint the ALB calls.</p>",
          bridge: {
            left: { label: "Spring Boot Actuator", lang: "yaml", code: `management:
  endpoints:
    web:

        include: health,info
  endpoint:

# /actuator/health/liveness
# /actuator/health/readiness` },
            right: { label: "NestJS + Terminus", lang: "ts", code: `@Public()
@Controller('health')
export class HealthController {
  constructor(
    private readonly health: HealthCheckService,
    private readonly db: TypeOrmHealthIndicator,
  ) {}

  @Get('live')
  @HealthCheck()
  live() {
    return this.health.check([]);
  }

  @Get('ready')
  @HealthCheck()
  ready() {
    return this.health.check([
      () => this.db.pingCheck('database'),
    ]);
  }
}` }
          },
          tip: "<p>On the job: Actuator also gives you metrics and info endpoints out of the box. Nest has no equivalent bundle; teams add a metrics library or OpenTelemetry. Check what yours uses.</p>"
        },
        {
          h: "Graceful shutdown on ECS",
          body: "<p>When ECS stops a task (deployment, scale-in, failed health check), it sends SIGTERM, waits the container's stop timeout (30 seconds by default), then sends SIGKILL. Without <code>enableShutdownHooks()</code>, nothing closes cleanly: depending on how the process runs, it either exits at once or ignores the signal until SIGKILL. Either way in-flight requests and pooled connections are cut.</p><p>With it, Nest runs <code>onModuleDestroy</code>, then <code>beforeApplicationShutdown</code>, then closes the HTTP server, then <code>onApplicationShutdown</code>, where the TypeORM module destroys its <code>DataSource</code>. Meanwhile the ALB's deregistration delay stops sending the task new requests.</p>",
          code: `// main.ts
app.enableShutdownHooks(); // handle SIGTERM and SIGINT

// any provider with work to finish
@Injectable()
export class OutboxWorker implements OnApplicationShutdown {
  async onApplicationShutdown(signal?: string) {
    await this.flushPending();
  }
}`,
          lang: "ts",
          tip: "<p>Gotcha: start the container with <code>CMD [\"node\", \"dist/main.js\"]</code> so Node receives the signal itself. Launched through <code>npm start</code>, npm sits in between and may not pass SIGTERM on, so the app is killed after the timeout. ECS can also run an init process for you (<code>initProcessEnabled</code>).</p>"
        },
        {
          h: "Hardening: helmet, CORS, rate limits",
          body: "<p><code>helmet()</code> sets security headers such as HSTS and <code>X-Content-Type-Options</code>. <code>enableCors</code> passes its options to the <code>cors</code> package; list exact origins. If the Vue app and the API share an origin (for example CloudFront or the ALB routing <code>/api</code> to Nest), you don't need CORS at all.</p><p><code>@nestjs/throttler</code> counts requests per client and answers 429 over the limit. Two mechanics to know: the default storage is in memory per task, so three ECS tasks triple the effective limit; and behind an ALB, <code>req.ip</code> is the load balancer's address unless you set Express's <code>trust proxy</code> (<code>app.set('trust proxy', 1)</code> on a <code>NestExpressApplication</code>). AWS WAF rate-based rules are a common edge-level complement.</p>",
          code: `// main.ts
app.use(helmet());
app.enableCors({
  origin: ['https://workorders.example.ca'],
  credentials: true,
});

// app.module.ts
imports: [
  ThrottlerModule.forRoot([{ ttl: 60_000, limit: 100 }]),
],
providers: [{ provide: APP_GUARD, useClass: ThrottlerGuard }],

// stricter on one route
@Throttle({ default: { limit: 5, ttl: 60_000 } })
@Post('bulk-import')
bulkImport(@Body() dto: BulkImportDto) {}`,
          lang: "ts"
        },
        {
          h: "OpenAPI with `@nestjs/swagger`",
          body: "<p><code>SwaggerModule.createDocument</code> walks your controllers, routes and DTO metadata to build an OpenAPI document; <code>setup('docs', ...)</code> serves Swagger UI at <code>/docs</code> and the JSON at <code>/docs-json</code>. <code>@ApiProperty()</code> describes DTO fields, and the Swagger CLI plugin (enabled in <code>nest-cli.json</code>) can infer most of that from TypeScript types and class-validator decorators.</p><p>Import <code>PartialType</code> and friends from <code>@nestjs/swagger</code> so update DTOs keep their schema. Generating a typed client for the Vue app from this document is common. Decide whether <code>/docs</code> should be reachable in production.</p>",

  .setTitle('Work orders API')
  .setVersion('1')
  .addBearerAuth()
  .build();
const document = SwaggerModule.createDocument(app, config);
SwaggerModule.setup('docs', app, document);

export class CreateWorkOrderDto {

  @IsString() @Length(1, 120)
  title: string;
}`,

      cards: [

          body: `<p><code>defineProps</code> is a compiler macro: you don't import it, and it only works in <code>&lt;script setup&gt;</code>. The SFC compiler reads the TypeScript type and generates the runtime props declaration, including which props are required. You get a reactive, read-only props object.</p><p>For defaults, wrap it in <code>withDefaults</code>. Arrays and objects need a factory function so each instance gets its own copy. Since Vue 3.5 you can also destructure with default values; the compiler rewrites each use of a destructured name to <code>props.name</code>, so it stays reactive.</p>`,
          code: `<script setup lang="ts">
import type { WorkOrder } from '@/types';

const props = withDefaults(

          body: `<p>Props flow one way: the parent owns the data and the child renders it. In development, the props object from <code>defineProps</code> is read-only, so <code>props.priority++</code> fails with a console warning, and the TypeScript type marks props <code>readonly</code> too.</p><p>Two legitimate needs look like prop mutation:</p><ul><li><strong>The child needs an editable copy</strong>, such as a form seeded from a record. Copy it into a local ref and emit the result on save.</li><li><strong>The parent's value should change.</strong> Emit an event and let the parent update its own state, or use <code>v-model</code> on the component.</li></ul>`,

          code: `// keys.ts
import type { InjectionKey, Ref } from 'vue';
export const SiteKey: InjectionKey<Ref<string>> = Symbol('site');

    // ───────────────────────────────────────────── vue-4
    {
      id: "vue-4",
      title: "Composables and lifecycle",
      zone: 2,
      minutes: 11,
      summary: "Hook into a component's lifecycle, clean up after it, and package reusable stateful logic as composables.",
      cards: [
        {
          h: "When setup code runs",
          body: `<p>The top level of <code>&lt;script setup&gt;</code> is the body of <code>setup()</code>. It runs once per component instance, when the instance is created and before anything renders. There's no DOM yet, so template refs are still <code>null</code>.</p><p>Lifecycle hooks register callbacks for later. While setup runs, Vue sets a module-level "current instance", and <code>onMounted(fn)</code> adds <code>fn</code> to that instance's list. So hooks must be called synchronously during setup, directly or from a composable that setup calls. Called from a <code>setTimeout</code>, or after an <code>await</code> inside an async function, there is no current instance: Vue warns and the hook never runs.</p>`,
          code: `import { onMounted, onBeforeUnmount, useTemplateRef } from 'vue';

// runs now, once per instance: no DOM yet
const input = useTemplateRef<HTMLInputElement>('title');

onMounted(() => {
  // DOM exists; children are already mounted
  input.value?.focus();
});

onBeforeUnmount(() => {
  // still in the DOM: last chance to read it
});`,
          lang: "ts",
          tip: `<p><code>useTemplateRef('title')</code> (Vue 3.5+) pairs with <code>ref="title"</code> in the template. Older code declares <code>const title = ref&lt;HTMLInputElement | null&gt;(null)</code>, with the variable name matching the <code>ref</code> attribute.</p>`
        },
        {
          h: "Lifecycle hooks vs bean callbacks",
          body: `<p>The hooks, in order: <code>onBeforeMount</code>, <code>onMounted</code>, then <code>onBeforeUpdate</code> and <code>onUpdated</code> around each re-render, then <code>onBeforeUnmount</code> and <code>onUnmounted</code>. Children finish mounting before their parent's <code>onMounted</code> fires.</p><p>They play the role of <code>@PostConstruct</code> and <code>@PreDestroy</code>. The difference is lifetime. A singleton bean lives as long as the context. A component instance lives only while it's rendered: navigating away, a <code>v-if</code> turning false or a list item being removed all unmount it, and coming back creates a new instance. Think prototype scope, created and destroyed constantly.</p>`,
          bridge: {
            left: { label: "Spring", lang: "java", code: `@Component
public class SyncPoller {
  @PostConstruct
  void start() { scheduler.start(); }

  @PreDestroy
  void stop() { scheduler.stop(); }
}` },
            right: { label: "Vue", lang: "ts", code: `// in <script setup>
onMounted(() => poller.start());
onBeforeUnmount(() => poller.stop());` }
          }
        },
        {
          h: "Clean up what Vue doesn't know about",
          body: `<p>Watchers and computeds created during setup belong to the component and are stopped automatically on unmount. Vue knows nothing about anything else you start: <code>window</code> listeners, intervals, WebSockets, in-flight requests.</p><p>If you don't stop them, they keep running after the component is gone. Each callback's closure holds the component's refs, so the instance can't be garbage-collected, and handlers keep updating state nobody displays. Every mount adds another copy.</p><p>Pair every start with a stop in <code>onBeforeUnmount</code> or <code>onUnmounted</code>, and remove listeners using the <em>same function reference</em> you added.</p>`,
          code: `const width = ref(window.innerWidth);
const onResize = () => (width.value = window.innerWidth);
let timer: number | undefined;

onMounted(() => {
  window.addEventListener('resize', onResize);
  timer = window.setInterval(refresh, 30_000);
});

onBeforeUnmount(() => {
  window.removeEventListener('resize', onResize);
  window.clearInterval(timer);
});`,
          lang: "ts"
        },
        {
          h: "Composables: reusable stateful logic",
          body: `<p>A composable is a function, named <code>useSomething</code> by convention, that uses the Composition API (refs, computed, watchers, lifecycle hooks) and returns state and functions. You call it from setup. Hooks it registers attach to the calling component, so its cleanup runs when that component unmounts.</p><p>It looks like injecting a small service. The difference: each call runs the function again and creates new refs. Every caller gets its own state, which is closer to a prototype-scoped bean than to a Spring singleton.</p>`,
          bridge: {
            left: { label: "Spring singleton", lang: "java", code: `@Service  // one instance for every caller
public class SelectionService {
  private final Set<Long> selected = new HashSet<>();

  public void toggle(long id) {
    if (!selected.remove(id)) selected.add(id);
  }
}` },
            right: { label: "Composable", lang: "ts", code: `// each call creates its own state
export function useSelection() {
  const selected = ref(new Set<number>());

  function toggle(id: number) {
    const s = selected.value;
    if (!s.delete(id)) s.add(id);
  }
  return { selected, toggle };
}` }
          }
        },
        {
          h: "Where the state lives decides who shares it",
          body: `<p>An ES module is evaluated once per page load. A <code>ref</code> declared at module scope, outside the composable function, is therefore created once and shared by every caller. Declared inside the function, it's per call.</p><p>That gives you a cheap singleton for something like the current user, and a classic bug when you meant per-component state: two tables on one page sharing one selection.</p>`,
          code: `// module scope: shared by every caller in the app
const currentUser = ref<User | null>(null);

export function useCurrentUser() {
  // function scope: created per call
  const isAdmin = computed(
    () => currentUser.value?.roles.includes('ADMIN') ?? false,
  );
  return { currentUser, isAdmin };
}`,
          lang: "ts",
          tip: `<p>For app-wide state, prefer a Pinia store over module-scope refs: you get DevTools inspection, a fresh store per test, and no state leaking between requests if the app is ever server-rendered.</p>`
        },
        {
          h: "A `useFetch`-style composable",
          body: `<p>A common composable wraps an async call in <code>data</code>, <code>error</code> and <code>loading</code> refs. This one accepts the URL as a string, a ref or a getter (<code>MaybeRefOrGetter</code>). <code>toValue()</code> reads it inside the watcher's getter, so the composable refetches when the URL changes and aborts the stale request. <code>data</code> is a <code>shallowRef</code> because the response is replaced as a whole; there's no need to proxy every nested field.</p>`,
          code: `import { ref, shallowRef, watch, toValue } from 'vue';
import type { MaybeRefOrGetter } from 'vue';

export function useFetch<T>(url: MaybeRefOrGetter<string>) {
  const data = shallowRef<T | null>(null);
  const error = ref<Error | null>(null);
  const loading = ref(false);

  watch(() => toValue(url), async (u, _old, onCleanup) => {
    const ctrl = new AbortController();
    onCleanup(() => ctrl.abort());
    loading.value = true;
    error.value = null;
    try {
      const res = await fetch(u, { signal: ctrl.signal });
      if (!res.ok) throw new Error(\`HTTP \${res.status}\`);
      data.value = (await res.json()) as T;
    } catch (e) {
      if (!ctrl.signal.aborted) error.value = e as Error;
    } finally {
      if (!ctrl.signal.aborted) loading.value = false;
    }
  }, { immediate: true });

  return { data, error, loading };
}`,
          lang: "ts",
          tip: `<p>In a real project you'd call your shared axios instance here, and your team may already use VueUse's <code>useFetch</code> or a server-state library. Check before writing another one.</p>`
        },
        {
          h: "VueUse: composables you don't have to write",
          body: `<p>VueUse (<code>@vueuse/core</code>) is a large, widely used collection of composables: <code>useEventListener</code>, <code>useIntervalFn</code>, <code>useDebounceFn</code>, <code>useLocalStorage</code>, <code>useMediaQuery</code>, <code>onClickOutside</code> and many more. They register their own cleanup, so a listener added with <code>useEventListener</code> inside a component is removed when that component unmounts.</p><p>Their source is also a good way to learn composable patterns. Most functions are short and accept <code>MaybeRefOrGetter</code> arguments the same way.</p>`,
          code: `import { useEventListener, useDebounceFn } from '@vueuse/core';

// removed automatically on unmount
useEventListener(window, 'keydown', (e) => {
  if (e.key === 'Escape') close();
});

const search = useDebounceFn((q: string) => runSearch(q), 300);`,
          lang: "ts"
        }
      ],

        {
          id: "vue-4-q2", type: "bug",
          q: `<p>Two asset tables on the same page each call <code>useSelection()</code>. Selecting a row in one table selects it in the other. Tap the line to change.</p>`,

        {
          id: "vue-4-q3", type: "order",
          q: `<p>A parent component renders one child. Put these in the order Vue runs them on first mount.</p>`,

titleInput.value?.focus();`,

          code: `import { defineStore } from 'pinia';
import { ref, computed } from 'vue';
import { getCurrentUser } from '@/api/auth';
import type { User } from '@/types';

export const useAuthStore = defineStore('auth', () => {
  const user = ref<User | null>(null);
  const isLoggedIn = computed(() => user.value !== null);

  function hasRole(role: string) {
    return user.value?.roles.includes(role) ?? false;
  }
  async function load() {
    user.value = await getCurrentUser();
  }
  function clear() {
    user.value = null;
  }

});`,

          h: "`v-model` on native inputs",
          body: `<p>On native elements, <code>v-model</code> expands to a value binding plus a listener, chosen by element type. Text inputs and textareas use <code>value</code> and the <code>input</code> event. Checkboxes and radios use <code>checked</code> and <code>change</code>. Selects use <code>value</code> and <code>change</code>. A checkbox bound to an array adds and removes its <code>value</code>.</p><p>Modifiers adjust the listener. <code>.trim</code> strips whitespace. <code>.number</code> passes the input through <code>parseFloat</code> and keeps the original string if that fails; Vue applies it automatically on <code>type="number"</code>. <code>.lazy</code> syncs on <code>change</code> instead of on every keystroke.</p>`,
          code: `<script setup lang="ts">
import { reactive } from 'vue';

const form = reactive({
  title: '', hours: 0, priority: 'LOW', tags: [] as string[],
});
<\/script>

<template>
  <input v-model.trim="form.title" />
  <input v-model="form.hours" type="number" min="0" step="0.5" />
  <select v-model="form.priority">
    <option>LOW</option>
    <option>HIGH</option>

    Safety
  </label>
</template>`,

          body: `<p>Validating in the browser gives instant feedback. It proves nothing to the server: anyone can send a request with <code>curl</code>, replay it with edited JSON, or change the bundle. The NestJS API must validate every request again, typically with DTOs and a validation pipe.</p><p>On the client, teams use a form library such as VeeValidate, a schema library such as Zod, or both. Check which your team uses. Some teams share schemas between front end and back end so the rules stay aligned.</p>`,

          h: "One configured axios instance",
          body: `<p>Create one axios instance for the API and import it everywhere. It holds the <code>baseURL</code> and timeout, and its interceptors run on every call: a request interceptor attaches the access token, and a response interceptor handles 401s in one place. It's the same idea as a <code>RestClient</code> built once with a <code>ClientHttpRequestInterceptor</code>.</p><p>Unlike <code>fetch</code>, axios parses JSON for you and rejects the promise for non-2xx statuses by default. How you obtain the token depends on your auth provider; the interceptor only reads it.</p>`,
          code: `import axios from 'axios';
import { useAuthStore } from '@/stores/auth';

  baseURL: import.meta.env.VITE_API_BASE_URL,
  timeout: 15_000,
});

api.interceptors.request.use((config) => {
  const token = useAuthStore().accessToken;
  if (token) config.headers.Authorization = \`Bearer \${token}\`;
  return config;
});

          h: "Every request has four states",
          body: `<p>A view backed by an API call is always in one of four states: loading, failed, loaded but empty, or loaded with data. Render all four explicitly. The missing ones are where UIs look broken: a blank page while loading, "No results" flashing before the first request, or a failed request that looks like an empty list.</p><p>For writes, disable the submit button while the request is in flight, so a double click can't create two work orders.</p>`,

          code: `// vite.config.ts

        {

    // ───────────────────────────────────────────── vue-8
    {

      cards: [
        {
          h: "What `vite build` produces",
          body: `<p><code>vite build</code> writes a static site to <code>dist/</code>: an <code>index.html</code> plus JS and CSS files under <code>assets/</code>, each with a content hash in its name. The entry chunk holds the app shell. Each dynamic <code>import()</code> becomes its own chunk, and code shared between chunks is split out so it downloads once.</p><p>A hash changes only when the file's content does. That permits a cache policy that is both safe and fast: hashed assets can be cached for a year, while <code>index.html</code>, the one file with a fixed name, is served with <code>no-cache</code> so browsers pick up the new hashes on their next load. <code>vite preview</code> serves <code>dist/</code> locally.</p>`,
          code: `dist/
  index.html
  assets/
    index-B4x9kQ2e.js          entry chunk
    index-Cq81zZ0p.css
    ReportsView-D2fT7aLm.js    lazy route chunk
    TrendChart-Ahf03pQx.js     async component chunk`,
          lang: "text",
          tip: `<p>On CloudFront or any CDN, set the long cache lifetime on <code>assets/*</code> only. A long-cached <code>index.html</code> keeps pointing users at the previous build.</p>`

        {
          h: "Vite doesn't type-check: add `vue-tsc`",
          body: `<p>Vite transpiles each TypeScript file on its own and simply strips the types. That's why it's fast, and why a type error fails neither the dev server nor <code>vite build</code>. Coming from <code>javac</code>, where a type error stops the build, this surprises people.</p><p>Type checking is a separate step. Plain <code>tsc</code> can't read <code>.vue</code> files. <code>vue-tsc</code> wraps it with Vue's language tooling so it checks SFC scripts <em>and</em> template expressions; a typo such as <code>{{ order.tittle }}</code> is an error. Run it in CI and in the build script. The Vue extension in your editor uses the same engine.</p>`,
          code: `{
  "scripts": {
    "dev": "vite",
    "type-check": "vue-tsc --noEmit",
    "lint": "eslint .",
    "test": "vitest run",
    "build": "vue-tsc --noEmit && vite build",
    "preview": "vite preview"
  }
}`,

        {
          h: "ESLint and Prettier",
          body: `<p><strong>ESLint</strong> finds likely bugs and enforces conventions, like Checkstyle and SpotBugs together. <code>eslint-plugin-vue</code> adds template-aware rules such as <code>vue/require-v-for-key</code>, <code>vue/no-mutating-props</code> and <code>vue/no-v-html</code>. TypeScript rules come from <code>typescript-eslint</code>.</p><p><strong>Prettier</strong> only formats, like a Spotless formatting step in Maven. Teams switch off ESLint's formatting-related rules with a Prettier-compatible config so the two don't fight. Current ESLint versions use a flat <code>eslint.config.js</code>; older projects have <code>.eslintrc</code> files.</p>`,
          tip: `<p>ESLint and <code>vue-tsc</code> catch different classes of problems. Lint rules mostly work on syntax; the type checker understands types across files. CI should run both.</p>`

          h: "Component tests: Vitest and Vue Test Utils",
          body: `<p><strong>Vitest</strong> is the test runner, in JUnit's role, and includes mocking, in Mockito's role, through <code>vi</code>. It reuses your Vite config, so <code>.vue</code> files and path aliases just work. Component tests need a DOM, so set <code>environment: 'jsdom'</code> (or <code>'happy-dom'</code>) in the test config.</p><p><strong>@vue/test-utils</strong> mounts a component into that DOM and returns a wrapper: <code>find()</code> elements, <code>trigger()</code> events, <code>setValue()</code> on inputs, read <code>text()</code> and <code>emitted()</code>. <code>vi.mock()</code> without a factory replaces a module's exported functions with mocks, much like <code>@Mock</code> on a dependency.</p>`,

          body: `<p>Vue batches DOM updates into a microtask, so a test must wait after changing state before asserting on the DOM. <code>trigger()</code> and <code>setValue()</code> return a promise that resolves after Vue's next flush; <code>await</code> them.</p><p><code>nextTick()</code> waits for Vue's pending flush and nothing else. It doesn't wait for other promises, such as a mocked API call and the <code>await</code> chain behind it inside your component. <code>flushPromises()</code> resolves on a later macrotask, by which time the microtask queue, including promise callbacks and Vue's flush, has drained.</p>`,
          code: `test('emits save with the trimmed title', async () => {

    // ───────────────────────────────────────────── vue-10
    {
      id: "vue-10",
      title: "Performance and structure",
      zone: 3,
      minutes: 13,
      summary: "Find what actually slows a Vue SPA, apply the right fix for each cause, and organize a growing codebase by feature.",
      cards: [
        {
          h: "What actually makes an SPA slow",
          body: `<p>Measure before optimizing. The usual causes:</p><ul><li><strong>Bundle size.</strong> All JS on the initial path must download, parse and run before the first view appears.</li><li><strong>Request waterfalls.</strong> Sequential <code>await</code>s, or a parent and child each fetching only after the other renders.</li><li><strong>Large deep-reactive data.</strong> Proxies and dependency tracking on thousands of nested objects.</li><li><strong>Too many re-renders or DOM nodes</strong>, such as a 5,000-row table.</li></ul><p>The browser's Performance panel, Lighthouse and the Vue DevTools timeline tell you which one you have. A waterfall is the frontend's N+1 problem: each round trip over a real network costs tens to hundreds of milliseconds.</p>`,
          bridge: {
            left: { label: "JPA N+1", lang: "java", code: `// N+1: one extra query per order
for (WorkOrder wo : repo.findAll()) {
  wo.getAsset().getTag();   // lazy load
}

// fix: fetch everything in one round trip
@Query("select w from WorkOrder w join fetch w.asset")
List<WorkOrder> findAllWithAsset();` },
            right: { label: "Vue waterfall", lang: "ts", code: `// waterfall: two sequential round trips
async function loadSlow(id: number) {
  const order = await getWorkOrder(id);
  const types = await getAssetTypes();
  return { order, types };
}

// parallel: as long as the slowest call
async function loadFast(id: number) {
  const [order, types] = await Promise.all([
    getWorkOrder(id),
    getAssetTypes(),
  ]);
  return { order, types };
}` }
          }
        },
        {
          h: "Split the bundle: routes and heavy components",
          body: `<p>Route-level lazy loading keeps each view out of the initial bundle. Inside a view, <code>defineAsyncComponent</code> does the same for one heavy component, such as a chart library, a rich-text editor or a PDF viewer. The wrapper renders nothing, or a loading component, until the chunk arrives, then renders the real component. The chunk is requested only when the wrapper first renders, so pair it with <code>v-if</code> to load on demand.</p>`,
          code: `<script setup lang="ts">
import { defineAsyncComponent, ref } from 'vue';

defineProps<{ points: number[] }>();

const TrendChart = defineAsyncComponent(
  () => import('./TrendChart.vue'),
);
const showChart = ref(false);
<\/script>

<template>
  <button type="button" @click="showChart = true">Show trend</button>
  <TrendChart v-if="showChart" :points="points" />
</template>`,
          lang: "vue",
          tip: `<p>Gotcha: if any module on the initial path imports the same component statically, it's already in the main bundle and the dynamic import saves nothing. Vite prints a warning when this happens.</p>`
        },
        {
          h: "`shallowRef` and `markRaw` for big data",
          body: `<p>Deep reactivity has a cost. Each nested object you read through a <code>reactive</code> proxy gets its own proxy, and each property read inside an effect records a dependency. For 10,000 rows that you display and later replace wholesale, that work buys nothing.</p><p><code>shallowRef</code> tracks only <code>.value</code>. Assigning a new array triggers; mutating a row inside it doesn't, unless you call <code>triggerRef</code>. <code>markRaw(obj)</code> flags an object so Vue never proxies it, which matters for third-party instances such as map or chart objects. A proxy adds overhead to every access, and it breaks classes with <code>#private</code> fields, because methods then run with the proxy as <code>this</code>.</p>`,
          code: `import { shallowRef, reactive, markRaw, triggerRef } from 'vue';

const rows = shallowRef<Inspection[]>([]);

async function load() {
  rows.value = await listInspections();   // triggers
}

function passFirst() {
  rows.value[0].result = 'PASS';          // no trigger
  triggerRef(rows);                       // force it
}

const view = reactive({ zoom: 1, chart: null as Chart | null });
view.chart = markRaw(new Chart(canvasEl, config)); // never proxied`,
          lang: "ts"
        },
        {
          h: "Re-render less: stable props, `v-once`, `v-memo`",
          body: `<p>A child re-renders when any prop it receives changes, compared with <code>!==</code>. Pass each child only what it needs. If every row gets <code>activeId</code>, changing the selection re-renders every row; pass a boolean and only the two rows whose flag flipped update. For the same reason, avoid fresh object or array literals as props in large lists.</p><p><code>v-once</code> renders an element once and skips it in every later update. <code>v-memo="[a, b]"</code> skips a subtree's update unless a listed value changed; it's intended for large <code>v-for</code> lists, placed on the same element as <code>v-for</code>. Both cause stale UI when misused, so reach for them only after measuring. Prefer <code>computed</code> over method calls in templates for anything non-trivial.</p>`,
          code: `<\!-- every row re-renders when activeId changes -->
<AssetRow
  v-for="a in assets" :key="a.id"
  :asset="a" :active-id="activeId"
/>

<\!-- only rows whose flag flips re-render -->

  v-for="a in assets" :key="a.id"
  :asset="a" :active="a.id === activeId"
/>`,
          lang: "vue"
        },
        {
          h: "Deep watchers and long lists",
          body: `<p><code>watch(state, cb, { deep: true })</code>, or watching a <code>reactive</code> object directly (implicitly deep), makes Vue traverse every nested property on each run to register dependencies. On large state that cost adds up. Watch the specific getter you care about instead, such as <code>() =&gt; filters.status</code>.</p><p>For long lists, the fastest DOM is the DOM you never create. Paginate on the server when users don't need everything at once; that also cuts payload size and JSON parsing. When they must scroll thousands of rows, use <strong>virtual scrolling</strong>: render only the visible rows plus a small buffer in a fixed-height container, and reuse them as the user scrolls. VueUse's <code>useVirtualList</code> and dedicated virtual-scroller components exist; check what your UI library offers.</p>`,
          tip: `<p>Virtual scrolling complicates accessibility and the browser's find-in-page, because off-screen rows aren't in the DOM. Server-side filtering and pagination often suit a work-order list better.</p>`
        },
        {
          h: "`KeepAlive`: keep a view alive across navigation",
          body: `<p>Normally, leaving a route unmounts its component, and coming back runs setup again and refetches. Wrapping the routed component in <code>&lt;KeepAlive&gt;</code> caches the instance instead: it is deactivated and detached from the DOM, then reattached later with its state and loaded data intact. Use <code>onActivated</code> and <code>onDeactivated</code> to resume and pause work such as polling.</p><p>Limit the cache with <code>include</code>, which matches component names (a <code>&lt;script setup&gt;</code> SFC's name is inferred from its file name), and <code>max</code>. Cached instances keep their memory and watchers alive.</p>`,
          code: `<RouterView v-slot="{ Component }">

    <component :is="Component" />
  </KeepAlive>
</RouterView>`,
          lang: "vue"
        },
        {
          h: "Feature folders, and when SSR is worth it",
          body: `<p>Organize by feature once the app has more than a handful of views, as you would choose package-by-feature over package-by-layer in Java. Each feature folder holds its views, components, store, API module and routes; shared building blocks live in <code>shared/</code>. Reviewing or deleting a feature then touches one folder.</p><p><strong>Nuxt</strong> is the Vue meta-framework: server-side rendering, file-based routing, server routes. SSR mainly buys a faster first paint and SEO for public pages. An internal, authenticated app gains little from either, and a plain SPA deploys as static files to S3 and CloudFront with no Node server to run. That's why internal tools are usually plain SPAs.</p>`,

  app/            main.ts, App.vue, router.ts, i18n.ts
  shared/

        {
          h: "CTEs, recursive ones too",
          body: "<p><code>WITH</code> names a subquery so a long query reads top to bottom. Before Postgres 12, every CTE was materialized: computed once, stored, and opaque to the outer query, so filters could not be pushed into it. Since 12, a non-recursive CTE without side effects that is referenced once is inlined like a subquery. One referenced twice is still materialized. You can force either way with <code>AS MATERIALIZED</code> or <code>AS NOT MATERIALIZED</code>.</p><p><code>WITH RECURSIVE</code> walks hierarchies, replacing Oracle's <code>CONNECT BY</code>. The first branch seeds the result; the second joins back to the rows found so far until no new rows appear.</p>",

        {
          h: "Window functions",
          body: "<p>A window function computes over related rows without collapsing them. <code>PARTITION BY</code> works like GROUP BY that keeps every row; <code>ORDER BY</code> inside the window turns an aggregate into a running one. <code>row_number()</code> numbers rows uniquely, <code>rank()</code> gives ties the same rank and leaves gaps, <code>dense_rank()</code> leaves none. The syntax matches Oracle analytic functions and SQL Server window functions.</p><p>Window functions run after WHERE, GROUP BY and HAVING, so you can't filter on them in WHERE. Wrap the query in a subquery or CTE and filter outside.</p>",
          code: `SELECT asset_id, closed_at, hours,

                        ORDER BY closed_at)

FROM work_order
WHERE status = 'DONE';`,
          lang: "sql",
          tip: "<p>With ORDER BY in the window, the default frame includes all peer rows that share the sort value, so ties get the same running total. Add a unique tiebreaker such as <code>id</code>, or write <code>ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW</code>.</p>"

          body: "<p><code>DISTINCT ON (expr)</code> keeps the first row of each group, where first is decided by ORDER BY. The ORDER BY must start with the DISTINCT ON expressions; the columns after them pick the winner. It is the shortest way to get the latest row per parent.</p><p><code>RETURNING</code> hands back rows from INSERT, UPDATE or DELETE in the same round trip. It covers what Oracle's <code>RETURNING INTO</code> and SQL Server's <code>OUTPUT</code> do, for any number of rows. TypeORM uses it on Postgres to read back generated ids and defaults after an insert.</p>",
          code: `-- latest inspection per asset
SELECT DISTINCT ON (asset_id)

ORDER BY asset_id, inspected_at DESC;

-- close several and get the rows back
UPDATE work_order
SET status = 'DONE', closed_at = now()
WHERE id = ANY($1)
RETURNING id, closed_at;`,

        {
          h: "Upsert with `ON CONFLICT`",
          body: "<p>The insert is attempted. If a unique index reports a conflict, Postgres locks the existing row and runs the <code>DO UPDATE</code> instead. <code>EXCLUDED</code> is the row you proposed. This is atomic under concurrency, unlike SELECT-then-INSERT, which races.</p><p>The conflict target must match a unique index or constraint. Proposing the same key twice in one statement raises <em>cannot affect row a second time</em>. <code>DO NOTHING</code> skips conflicts silently.</p><p>Postgres 15 added <code>MERGE</code>, but for concurrent upserts ON CONFLICT is the safer choice: MERGE can still hit a unique violation when two sessions insert the same key at once.</p>",
          bridge: {

USING (SELECT :asset_id asset_id,
              :read_on read_on,

ON (r.asset_id = s.asset_id
    AND r.read_on = s.read_on)
WHEN MATCHED THEN UPDATE

WHEN NOT MATCHED THEN INSERT

            right: { label: "PostgreSQL", lang: "sql", code: `INSERT INTO asset_reading

VALUES ($1, $2, $3)
ON CONFLICT (asset_id, read_on)

RETURNING id;` }

        },
        {
          h: "Pagination: `OFFSET` vs keyset",
          body: "<p><code>OFFSET 100000</code> makes the server produce 100,000 rows and throw them away before returning your page. Cost grows with page number, and rows shift between requests when new ones arrive.</p><p>Keyset pagination remembers the last row's sort key and asks for rows after it. With an index on <code>(created_at, id)</code>, Postgres descends the index straight to that point, so page 5,000 costs the same as page 1. The row-value comparison <code>(a, b) &lt; ($1, $2)</code> compares column by column, like sorting, and can use the composite index. The unique <code>id</code> breaks ties. The trade-off: no jumping to page N.</p>",
          code: `CREATE INDEX ix_wo_created ON work_order (created_at, id);

-- first page
SELECT id, title, created_at FROM work_order
ORDER BY created_at DESC, id DESC
LIMIT 50;

-- next page: pass the last row's created_at and id
SELECT id, title, created_at FROM work_order
WHERE (created_at, id) < ($1, $2)
ORDER BY created_at DESC, id DESC
LIMIT 50;`,
          lang: "sql"

        {
          h: "Parameters, never concatenation",
          body: "<p>With values passed separately, node-postgres uses the extended query protocol: the SQL text is parsed with <code>$1</code>, <code>$2</code> placeholders, then values are bound as data. A value can never become SQL, whatever it contains. Concatenating input into the text gives you SQL injection, exactly as in JDBC.</p><p>TypeORM's QueryBuilder uses named parameters (<code>:term</code>) and translates them to <code>$n</code>. <code>ILIKE</code> is case-insensitive LIKE; a leading <code>%</code> can't use a B-tree index (a trigram GIN index from <code>pg_trgm</code> can). Escape <code>%</code> and <code>_</code> in user input if they should match literally.</p>",

            left: { label: "JDBC", lang: "java", code: `PreparedStatement ps = con.prepareStatement(

ps.setString(1, "%" + term + "%");

        {
          h: "What a B-tree index actually holds",
          body: "<p>A Postgres table is a <strong>heap</strong>: rows sit in 8 kB pages in no particular order. A B-tree index stores sorted <code>(key, TID)</code> entries, where the TID is the row's page and slot. An index lookup descends the tree, walks the leaf entries in order, and fetches each heap row by TID. That fetch is random I/O, and it is also where visibility is checked, because the index has no MVCC information.</p><p>B-tree is the default and serves <code>=</code>, ranges, <code>IN</code>, <code>IS NULL</code> and ORDER BY. Other types exist for other shapes: GIN for multi-valued data (jsonb, arrays, full-text), GiST for ranges and geometry, BRIN for huge append-only tables ordered by time.</p>",
          tip: "<p>Postgres has no clustered index. SQL Server and MySQL's InnoDB store the table in primary-key order; Postgres doesn't. <code>CLUSTER</code> reorders a table once, under an exclusive lock, and new rows don't keep the order.</p>"

    {
      id: "pg-4",
      title: "Transactions, MVCC and locks",
