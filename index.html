<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="A learning game for NestJS, Vue 3, PostgreSQL and AWS, written for Java developers.">
<title>Stack Transit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;600&family=Overpass:wght@600;800;900&display=swap">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<style>
/* Layout: transit strip maps. Each technology is a line, each lesson a station, difficulty is fare zones;
   a signage board announces the next departure. */
:root {
  --bg: #edf0f4; --surface: #ffffff; --surface-2: #f5f7fa; --ink: #111827; --ink-2: #2b3445; --muted: #586275;
  --rule: #d2d8e1; --rule-2: #e4e8ee;
  --sign: #13213c; --sign-2: #22365e; --sign-ink: #f3f6fb; --sign-muted: #aab6cb;
  --next: #f5b800; --next-ink: #1a1300;
  --btn: #13213c; --btn-ink: #ffffff; --focus: #1d5bc2;
  --ok: #10744a; --ok-bg: #e1f3e9; --bad: #b02b26; --bad-bg: #fae5e3;
  --l-ts: #2d61d6; --l-nest: #cf2748; --l-vue: #10845a; --l-pg: #7350cb; --l-aws: #e08600; --l-x: #3a4150;
  --l-ts-ink: #fff; --l-nest-ink: #fff; --l-vue-ink: #fff; --l-pg-ink: #fff; --l-aws-ink: #1a1300; --l-x-ink: #fff;
  --code-bg: #f4f6f9; --code-ink: #1b2231; --code-rule: #dde3ea;
  --hl-kw: #8a2ea6; --hl-str: #14714a; --hl-num: #a8530a; --hl-com: #687184; --hl-fn: #1d5bc2; --hl-type: #0b7480; --hl-attr: #9a3412;
  --shadow: 0 1px 2px rgba(17, 24, 39, .05), 0 6px 18px rgba(17, 24, 39, .06);
  --f-display: "Overpass", "Arial Narrow", system-ui, sans-serif;
  --f-body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --radius: 12px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d121b; --surface: #151c28; --surface-2: #1a2230; --ink: #e9edf3; --ink-2: #c9d1dd; --muted: #98a4b7;
    --rule: #2b3546; --rule-2: #212a39;
    --sign: #182848; --sign-2: #2a4170; --sign-ink: #f3f6fb; --sign-muted: #aab6cb;
    --next: #ffc629; --next-ink: #1a1300;
    --btn: #ffc629; --btn-ink: #1a1300; --focus: #ffc629;
    --ok: #52d192; --ok-bg: #11301f; --bad: #ff7d74; --bad-bg: #3b1714;
    --l-ts: #6f97ff; --l-nest: #ff5e79; --l-vue: #36c487; --l-pg: #a88cff; --l-aws: #ffab2e; --l-x: #b0b9c9;
    --l-ts-ink: #0d121b; --l-nest-ink: #0d121b; --l-vue-ink: #0d121b; --l-pg-ink: #0d121b; --l-aws-ink: #0d121b; --l-x-ink: #0d121b;
    --code-bg: #0f1520; --code-ink: #dfe5ee; --code-rule: #253043;
    --hl-kw: #d59df5; --hl-str: #86d9a9; --hl-num: #f7b866; --hl-com: #8490a5; --hl-fn: #8db6ff; --hl-type: #67d3db; --hl-attr: #f6a37c;
    --shadow: 0 1px 2px rgba(0, 0, 0, .35), 0 8px 22px rgba(0, 0, 0, .25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d121b; --surface: #151c28; --surface-2: #1a2230; --ink: #e9edf3; --ink-2: #c9d1dd; --muted: #98a4b7;
  --rule: #2b3546; --rule-2: #212a39;
  --sign: #182848; --sign-2: #2a4170; --sign-ink: #f3f6fb; --sign-muted: #aab6cb;
  --next: #ffc629; --next-ink: #1a1300;
  --btn: #ffc629; --btn-ink: #1a1300; --focus: #ffc629;
  --ok: #52d192; --ok-bg: #11301f; --bad: #ff7d74; --bad-bg: #3b1714;
  --l-ts: #6f97ff; --l-nest: #ff5e79; --l-vue: #36c487; --l-pg: #a88cff; --l-aws: #ffab2e; --l-x: #b0b9c9;
  --l-ts-ink: #0d121b; --l-nest-ink: #0d121b; --l-vue-ink: #0d121b; --l-pg-ink: #0d121b; --l-aws-ink: #0d121b; --l-x-ink: #0d121b;
  --code-bg: #0f1520; --code-ink: #dfe5ee; --code-rule: #253043;
  --hl-kw: #d59df5; --hl-str: #86d9a9; --hl-num: #f7b866; --hl-com: #8490a5; --hl-fn: #8db6ff; --hl-type: #67d3db; --hl-attr: #f6a37c;
  --shadow: 0 1px 2px rgba(0, 0, 0, .35), 0 8px 22px rgba(0, 0, 0, .25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; }
h1, h2, h3 { font-family: var(--f-display); line-height: 1.15; text-wrap: balance; margin: 0; letter-spacing: -0.01em; }
p { margin: 0; }
code { font-family: var(--f-mono); font-variant-ligatures: none; font-size: .86em; background: var(--surface-2); border: 1px solid var(--rule-2); border-radius: 5px; padding: .05em .35em; overflow-wrap: anywhere; }
kbd { font-family: var(--f-mono); font-size: .8em; border: 1px solid var(--rule); border-bottom-width: 2px; border-radius: 4px; padding: 0 .35em; background: var(--surface); }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 6px; }
.tnum { font-variant-numeric: tabular-nums; }
.sep { display: inline-block; margin-inline: .45em; opacity: .7; }
.eyebrow { font-family: var(--f-display); font-weight: 800; font-size: .72rem; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }

.shell { max-width: 1180px; margin: 0 auto; padding-inline: 16px; padding-block: 0 48px; }
@media (min-width: 720px) { .shell { padding-inline: 28px; } }

/* Top bar */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); border-bottom: 1px solid var(--rule); display: flex; align-items: center; gap: 12px 18px; flex-wrap: wrap; padding-block: 10px; margin-bottom: 24px; }
.brand { display: flex; align-items: center; gap: 10px; background: none; border: 0; padding: 4px 2px; cursor: pointer; }
.brand-name { font-family: var(--f-display); font-weight: 900; font-size: 1.2rem; letter-spacing: -.01em; }
.brand svg { flex: none; }
.topstats { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-left: auto; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-family: var(--f-display); font-weight: 800; font-size: .82rem; padding: 6px 11px; border-radius: 999px; background: var(--surface); border: 1px solid var(--rule); white-space: nowrap; }
.chip .k { color: var(--muted); font-weight: 600; }
button.chip { cursor: pointer; }
button.chip:hover { border-color: var(--ink-2); }
.chip .count { background: var(--bad); color: #fff; border-radius: 999px; padding: 0 7px; font-size: .75rem; line-height: 1.5; }
.chip .count.zero { background: var(--rule); color: var(--muted); }
@media (max-width: 560px) { .hide-sm { display: none !important; } }

/* Bullets */
.bullet { --s: 34px; width: var(--s); height: var(--s); flex: none; border-radius: 50%; display: inline-grid; place-items: center; background: var(--lc); color: var(--lci); font-family: var(--f-display); font-weight: 900; font-size: calc(var(--s) * .52); line-height: 1; padding-top: .08em; }
.bullet.sm { --s: 20px; }
.bullet.lg { --s: 48px; }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 10px 18px; border-radius: 9px; border: 1px solid transparent; font-family: var(--f-display); font-weight: 800; font-size: .95rem; cursor: pointer; text-decoration: none; }
.btn.primary { background: var(--btn); color: var(--btn-ink); }
.btn.primary:hover { filter: brightness(1.12); }
.btn.go { background: var(--next); color: var(--next-ink); }
.btn.go:hover { filter: brightness(1.06); }
.btn.ghost { background: transparent; border-color: var(--rule); color: var(--ink); }
.btn.ghost:hover { border-color: var(--ink-2); }
.btn.on-sign { background: transparent; border-color: var(--sign-2); color: var(--sign-ink); }
.btn.on-sign:hover { border-color: var(--sign-muted); }
.btn[disabled] { opacity: .45; cursor: not-allowed; filter: none; }
.link { background: none; border: 0; padding: 6px 0; color: var(--muted); font-family: var(--f-display); font-weight: 800; font-size: .88rem; cursor: pointer; }
.link:hover { color: var(--ink); }

/* Home: hero */
.hero { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: 18px; margin-bottom: 18px; }
@media (max-width: 820px) { .hero { grid-template-columns: minmax(0, 1fr); } }
.board { background: var(--sign); color: var(--sign-ink); border-radius: var(--radius); padding: 20px 22px 22px; display: grid; gap: 14px; position: relative; overflow: hidden; }
.board::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 5px; background: linear-gradient(90deg, var(--l-ts) 0 16.6%, var(--l-nest) 0 33.3%, var(--l-vue) 0 50%, var(--l-pg) 0 66.6%, var(--l-aws) 0 83.3%, var(--l-x) 0); }
.board-top { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: baseline; }
.board-label { font-family: var(--f-display); font-weight: 900; font-size: .78rem; letter-spacing: .18em; text-transform: uppercase; color: var(--next); }
.board-meta { font-family: var(--f-display); font-weight: 600; font-size: .85rem; color: var(--sign-muted); }
.board-main { display: flex; gap: 14px; align-items: flex-start; }
.board-title { font-size: clamp(1.55rem, 3.6vw, 2.3rem); font-weight: 900; }
.board-line { font-family: var(--f-display); font-weight: 600; color: var(--sign-muted); font-size: .92rem; margin-top: 4px; }
.board-sum { color: var(--sign-muted); max-width: 60ch; }
.board-actions { display: flex; gap: 10px; flex-wrap: wrap; }
.board .bullet { box-shadow: 0 0 0 3px var(--sign); }

.career { background: var(--surface); border: 1px solid var(--rule); border-radius: var(--radius); padding: 18px 20px; display: grid; gap: 14px; align-content: start; }
.rank-row { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.rank-name { font-size: 1.9rem; font-weight: 900; }
.rank-xp { font-family: var(--f-display); font-weight: 800; color: var(--muted); }
.ladder { position: relative; height: 22px; margin-inline: 8px; }
.ladder-track, .ladder-fill { position: absolute; left: 0; top: 8px; height: 6px; border-radius: 3px; }
.ladder-track { right: 0; background: var(--rule); }
.ladder-fill { background: var(--ink); }
.ladder-stop { position: absolute; top: 4px; width: 14px; height: 14px; margin-left: -7px; border-radius: 50%; background: var(--surface); border: 3px solid var(--rule); }
.ladder-stop.reached { border-color: var(--ink); }
.ladder-stop.here { border-color: var(--ink); background: var(--next); }
.rank-next { font-size: .9rem; color: var(--muted); }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; border-top: 1px solid var(--rule-2); padding-top: 12px; }
.stat b { display: block; font-family: var(--f-display); font-weight: 900; font-size: 1.35rem; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat span { font-size: .8rem; color: var(--muted); }

.intro { display: flex; gap: 12px 24px; flex-wrap: wrap; align-items: center; justify-content: space-between; margin: 26px 0 16px; }
.intro p { max-width: 70ch; color: var(--ink-2); }
.zones { display: flex; gap: 8px; flex-wrap: wrap; }
.zone-pill { font-family: var(--f-display); font-weight: 800; font-size: .76rem; letter-spacing: .04em; padding: 4px 10px; border-radius: 6px; border: 1px dashed var(--muted); color: var(--ink-2); white-space: nowrap; }

/* Home: lines (strip maps) */
.lines { columns: 3 320px; column-gap: 18px; }
.line { break-inside: avoid; background: var(--surface); border: 1px solid var(--rule); border-radius: var(--radius); padding: 16px 16px 10px; margin-bottom: 18px; display: inline-block; width: 100%; }
.line-head { display: flex; gap: 12px; align-items: center; margin-bottom: 10px; }
.line-head h2 { font-size: 1.25rem; font-weight: 900; }
.line-tag { font-size: .85rem; color: var(--muted); line-height: 1.35; }
.line-prog { margin-left: auto; font-family: var(--f-display); font-weight: 800; font-size: .85rem; color: var(--muted); white-space: nowrap; align-self: flex-start; padding-top: 4px; }
.strip { list-style: none; margin: 0; padding: 0; }
.strip > li { position: relative; }
.strip > li::before, .strip > li::after { content: ""; position: absolute; left: 15px; width: 6px; background: var(--lc); opacity: .22; }
.strip > li::before { top: 0; height: 50%; }
.strip > li::after { top: 50%; bottom: 0; }
.strip > li.up-on::before, .strip > li.down-on::after { opacity: 1; }
.strip > li:first-child::before, .strip > li:last-child::after { display: none; }
.stop-btn { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; background: none; border: 0; padding: 8px 6px 8px 0; cursor: pointer; border-radius: 8px; position: relative; z-index: 1; min-height: 52px; }
.stop-btn:hover .stop-title { text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 3px; }
.marker { flex: none; width: 36px; height: 36px; display: grid; place-items: center; }
.marker i { display: block; width: 18px; height: 18px; border-radius: 50%; background: var(--surface); border: 4px solid var(--lc); }
.is-done .marker i { background: var(--lc); }
.is-locked .marker i { border-color: var(--rule); border-width: 3px; width: 14px; height: 14px; }
.is-next .marker i { width: 22px; height: 22px; border-width: 5px; box-shadow: 0 0 0 4px var(--next); }
.is-mission .marker i { border-color: var(--ink); width: 20px; height: 20px; }
.is-mission.is-done .marker i { background: var(--ink); }
.is-mission.is-locked .marker i { border-color: var(--rule); width: 16px; height: 16px; }
@media (prefers-reduced-motion: no-preference) { .is-next .marker i { animation: halo 2.2s ease-in-out infinite; } }
@keyframes halo { 0%, 100% { box-shadow: 0 0 0 4px var(--next); } 50% { box-shadow: 0 0 0 8px color-mix(in srgb, var(--next) 35%, transparent); } }
.stop-text { min-width: 0; flex: 1; display: grid; gap: 1px; }
.stop-title { font-weight: 700; line-height: 1.3; }
.is-locked .stop-title { color: var(--muted); font-weight: 400; }
.stop-meta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: .8rem; color: var(--muted); }
.stars { color: var(--next); letter-spacing: 1px; font-size: .95rem; }
.stars .off { color: var(--rule); }
.next-tag { font-family: var(--f-display); font-weight: 900; font-size: .68rem; letter-spacing: .12em; text-transform: uppercase; background: var(--next); color: var(--next-ink); padding: 2px 6px; border-radius: 4px; }
.connects { display: inline-flex; gap: 3px; }
.connects .bullet { --s: 16px; font-size: 9px; }
.zone-break { padding: 8px 0 8px 48px; }
.zone-break span { display: flex; align-items: center; gap: 10px; font-family: var(--f-display); font-weight: 800; font-size: .7rem; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.zone-break span::after { content: ""; flex: 1; border-top: 1px dashed var(--rule); }

/* Station */
.station { --w: 880px; max-width: var(--w); margin: 0 auto; }
.st-top { display: grid; gap: 10px; margin-bottom: 20px; }
.st-id { display: flex; align-items: center; gap: 10px; font-family: var(--f-display); font-weight: 800; font-size: .88rem; color: var(--muted); flex-wrap: wrap; }
.st-top h1 { font-size: clamp(1.7rem, 4.4vw, 2.5rem); font-weight: 900; }
.st-sum { color: var(--ink-2); font-size: 1.05rem; max-width: 62ch; }
.rail { list-style: none; display: flex; padding: 0; margin: 6px 0 0; }
.rail li { flex: 1; position: relative; display: flex; justify-content: center; }
.rail li::before { content: ""; position: absolute; top: 13px; left: -50%; right: 50%; height: 5px; background: var(--lc); opacity: .2; }
.rail li:first-child::before { display: none; }
.rail li.on::before { opacity: 1; }
.rail-stop { position: relative; z-index: 1; background: none; border: 0; padding: 0; cursor: pointer; display: grid; justify-items: center; gap: 4px; min-width: 32px; }
.rail-stop i { display: block; width: 18px; height: 18px; margin-top: 6px; border-radius: 50%; background: var(--surface); border: 4px solid var(--lc); }
.rail-stop.past i { background: var(--lc); }
.rail-stop.cur i { width: 24px; height: 24px; margin-top: 3px; box-shadow: 0 0 0 4px var(--next); }
.rail-stop span { font-family: var(--f-display); font-weight: 800; font-size: .66rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.lesson { background: var(--surface); border: 1px solid var(--rule); border-radius: var(--radius); padding: 22px clamp(16px, 4vw, 30px) 26px; display: grid; gap: 16px; box-shadow: var(--shadow); }
.lesson h2 { font-size: 1.45rem; font-weight: 900; }
.prose { display: grid; gap: 12px; max-width: 68ch; }
.prose ul, .prose ol { margin: 0; padding-left: 1.3em; display: grid; gap: 6px; }
.card-count { font-family: var(--f-display); font-weight: 800; font-size: .78rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.st-nav { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
.st-nav .spacer { flex: 1; }

.code { border: 1px solid var(--code-rule); background: var(--code-bg); border-radius: 10px; min-width: 0; overflow: hidden; }
.code-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 8px 6px 12px; border-bottom: 1px solid var(--code-rule); font-family: var(--f-display); font-weight: 800; font-size: .72rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.copy { background: none; border: 1px solid transparent; border-radius: 6px; padding: 3px 8px; font-family: var(--f-display); font-weight: 800; font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); cursor: pointer; }
.copy:hover { border-color: var(--code-rule); color: var(--ink); }
.code pre { font-variant-ligatures: none; margin: 0; padding: 12px 14px; overflow-x: auto; font-family: var(--f-mono); font-size: .84rem; line-height: 1.6; color: var(--code-ink); tab-size: 2; }
.code pre code, .buglines code { background: none; border: 0; padding: 0; font-size: inherit; overflow-wrap: normal; }
.hljs-keyword, .hljs-literal, .hljs-selector-tag, .hljs-meta .hljs-keyword { color: var(--hl-kw); }
.hljs-string, .hljs-regexp, .hljs-template-variable, .hljs-addition { color: var(--hl-str); }
.hljs-number, .hljs-symbol, .hljs-bullet { color: var(--hl-num); }
.hljs-comment, .hljs-quote, .hljs-meta, .hljs-deletion { color: var(--hl-com); font-style: italic; }
.hljs-title, .hljs-title.function_, .hljs-section, .hljs-name { color: var(--hl-fn); }
.hljs-type, .hljs-built_in, .hljs-title.class_, .hljs-class .hljs-title { color: var(--hl-type); }
.hljs-attr, .hljs-attribute, .hljs-variable, .hljs-params, .hljs-property, .hljs-tag .hljs-attr { color: var(--hl-attr); }
.hljs-tag { color: var(--hl-com); }

.bridge { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
@media (max-width: 999px) { .bridge { grid-template-columns: minmax(0, 1fr); } }
.side-tag { font-family: var(--f-display); font-weight: 900; font-size: .64rem; letter-spacing: .12em; padding: 2px 6px; border-radius: 4px; background: var(--rule); color: var(--ink-2); }
.side-tag.here { background: var(--lc); color: var(--lci); }
.code-head .lbl { display: inline-flex; gap: 8px; align-items: center; min-width: 0; }
.tip { border: 1px solid color-mix(in srgb, var(--next) 55%, var(--rule)); background: color-mix(in srgb, var(--next) 10%, var(--surface)); border-radius: 10px; padding: 12px 14px; display: grid; gap: 6px; max-width: 68ch; }
.tip-label { font-family: var(--f-display); font-weight: 900; font-size: .7rem; letter-spacing: .14em; text-transform: uppercase; color: var(--ink); display: inline-flex; gap: 6px; align-items: center; }
.tip-label::before { content: "!"; display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: 4px; background: var(--next); color: var(--next-ink); font-size: .8rem; letter-spacing: 0; }
.tip p + p { margin-top: 6px; }

/* Quiz */
.q-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.q-type { font-family: var(--f-display); font-weight: 900; font-size: .72rem; letter-spacing: .14em; text-transform: uppercase; padding: 4px 8px; border-radius: 5px; background: var(--lc); color: var(--lci); }
.q-dots { display: flex; gap: 6px; flex-wrap: wrap; }

/* Review empty + footer + toast */
.empty { max-width: 560px; margin: 30px auto; text-align: center; display: grid; gap: 14px; justify-items: center; }

.foot { margin-top: 36px; padding-top: 16px; border-top: 1px solid var(--rule); display: flex; gap: 12px 24px; flex-wrap: wrap; align-items: center; justify-content: space-between; font-size: .88rem; color: var(--muted); }
.sync { display: inline-flex; gap: 8px; align-items: center; }
.sync i { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); flex: none; }
.sync.cloud i { background: var(--ok); }

.foot-actions { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
.toggle { display: inline-flex; gap: 8px; align-items: center; cursor: pointer; }
.toggle input { width: 18px; height: 18px; accent-color: var(--ink); }
.reset.armed { color: var(--bad); }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--surface); padding: 10px 16px; border-radius: 9px; font-family: var(--f-display); font-weight: 800; font-size: .9rem; max-width: calc(100vw - 32px); box-shadow: var(--shadow); z-index: 50; }
@media (prefers-reduced-motion: no-preference) { .toast:not([hidden]) { animation: rise .2s ease-out; } }
@keyframes rise { from { transform: translate(-50%, 8px); opacity: 0; } }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
#app:focus { outline: none; }
</style>
</head>

<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script>
var LINES = [];
LINES.push({
  id: "ts",
  stations: [
    // ------------------------------------------------------------------
    {
      id: "ts-1",
      title: "Types without the JVM",
      zone: 1,
      minutes: 10,
      summary: "Explain what TypeScript checks at compile time and what nothing checks at runtime, and avoid the null, equality and number traps a Java developer hits first.",
      cards: [
        {
          h: "Types vanish before the code runs",
          body: "<p><code>tsc</code> does two jobs: it checks your types, then emits plain JavaScript with every annotation, interface and type alias deleted. Node runs that JavaScript. There is no bytecode verifier and no runtime type check, so a wrong type never throws a <code>ClassCastException</code>. It flows on until some property access fails.</p><p>This matters most at the edges. <code>JSON.parse</code> returns <code>any</code>, and so do many HTTP clients unless you pass a type argument, which the compiler takes on trust. The annotation below is a promise you make to the compiler. Nothing inspects the payload.</p>",
          code: `interface WorkOrder {
  id: number;
  dueDate: Date;
}

const wo: WorkOrder = JSON.parse(body); // any: unchecked
wo.dueDate.getTime();
// TypeError: wo.dueDate.getTime is not a function
// JSON has no Date type, so dueDate is still a string.`,
          lang: "ts",
          tip: "<p>Validate wherever data enters: request bodies, API responses, message payloads, environment variables. In Nest that's usually <code>ValidationPipe</code> with class-validator DTOs; some teams use a schema library such as zod on both ends.</p>"
        },
        {
          h: "Structural typing: the shape is the contract",
          body: "<p>Java is nominal: a class is an <code>Asset</code> only if it declares <code>implements Asset</code>. TypeScript is structural: any value whose members match the required shape is assignable. The compiler compares member by member, recursively. Writing <code>implements</code> is optional; it moves the error onto the class if its shape drifts.</p><p>One extra rule: a fresh object literal gets an excess property check, so a typo like <code>locaton</code> is caught. Put the same object in a variable first and the extra key passes silently.</p>",
          bridge: {
            left: {
              label: "Java (nominal)",
              lang: "java",
              code: `interface Asset {
  String tag();
  String location();
}

// Must name the interface to be an Asset
record Truck(String tag, String location, int axles)
    implements Asset {}`
            },
            right: {
              label: "TypeScript (structural)",
              lang: "ts",
              code: `interface Asset {
  tag: string;
  location: string;
}

// Never mentions Asset, still assignable
class Truck {
  constructor(
    public tag: string,
    public location: string,
    public axles: number,
  ) {}
}

const a: Asset = new Truck("T-114", "Hangar 3", 3);`
            }
          },
          tip: "<p>Where it breaks: types with the same shape are interchangeable. <code>type WorkOrderId = string</code> is only another name for <code>string</code>. If <code>AssetId</code> is also an alias of <code>string</code>, an asset ID passes wherever a work-order ID is expected.</p>"
        },
        {
          h: "`any` turns checking off; `unknown` keeps it on",
          body: "<p><code>any</code> disables checking for that value. You can call anything on it and assign it anywhere, and it spreads: a property read from an <code>any</code> is also <code>any</code>. <code>unknown</code> also accepts every value, but you can't use it until you narrow it with a check the compiler understands.</p><p>The nearest Java picture is <code>Object</code>, with the cast replaced by a check. Use <code>unknown</code> for anything you haven't validated yet: parsed JSON, <code>catch</code> variables, message payloads.</p>",
          code: `function viaAny(input: any) {
  input.site.code.trim();  // compiles, may crash
  const n: number = input; // any flows anywhere
}

function viaUnknown(input: unknown) {
  input.site;              // error: 'input' is of type 'unknown'
  if (typeof input === "string") {
    input.trim();          // ok: narrowed to string
  }
}`,
          lang: "ts"
        },
        {
          h: "`strict`, `null` and `undefined`",
          body: "<p><code>\"strict\": true</code> turns on a family of checks. The big one is <code>strictNullChecks</code>: <code>null</code> and <code>undefined</code> stop being members of every type, so <code>string</code> means a real string and <code>string | null</code> must be narrowed before use. It's the compiler enforcing <code>@NonNull</code> everywhere. <code>noImplicitAny</code> and <code>useUnknownInCatchVariables</code> come with it.</p><p>JavaScript has two empty values. <code>undefined</code> means never set: a missing property, an unassigned variable, a function with no <code>return</code>. <code>null</code> is an explicit empty. JSON has only <code>null</code>, and <code>JSON.stringify</code> drops properties whose value is <code>undefined</code>.</p>",
          bridge: {
            left: {
              label: "Java",
              lang: "java",
              code: `// Compiles. NullPointerException at runtime.
String label(Inspector i) {
  return i.badge().toUpperCase();
}`
            },
            right: {
              label: "TypeScript (strict)",
              lang: "ts",
              code: `interface Inspector {
  name: string;
  badge: string | null;
}

function label(i: Inspector): string {
  return i.badge.toUpperCase();
  // error: 'i.badge' is possibly 'null'.
}`
            }
          },
          tip: "<p>Check the team's tsconfig. Generated Nest projects have historically shipped with some strict checks switched off, and switching them on later can surface a large batch of errors at once.</p>"
        },
        {
          h: "`===` always; `==` converts first",
          body: "<p><code>==</code> converts both operands to a common type before comparing, by rules few people remember. <code>===</code> compares without conversion. Use <code>===</code>; most lint configs enforce it with the <code>eqeqeq</code> rule. <code>tsc</code> rejects some bad comparisons when both types are known, but a value typed <code>any</code> gets no such help.</p><p>Neither operator compares object contents. For objects, <code>===</code> is reference identity, like Java's <code>==</code>. There is no <code>equals()</code>/<code>hashCode()</code> protocol, so a <code>Set</code> or <code>Map</code> keyed by objects uses identity too. Key by an id string.</p>",
          code: `// JavaScript semantics. tsc rejects the first two,
// because number and string have no overlap.
0 == "";                      // true: "" converts to 0
"1" == 1;                     // true
null == undefined;            // true
null === undefined;           // false

const qty: any = JSON.parse('"0"');
qty == 0;                     // true, and tsc can't help

({ id: 1 }) === ({ id: 1 });  // false: two objects
const seen = new Set([{ id: 1 }]);
seen.has({ id: 1 });          // false: identity lookup`,
          lang: "ts",
          tip: "<p>One common exception: <code>x == null</code> is true for both <code>null</code> and <code>undefined</code>, and some teams allow exactly that pattern.</p>"
        },
        {
          h: "Optional, `readonly`, `?.` and `??`",
          body: "<p><code>notes?: string</code> means the property may be absent; its type is <code>string | undefined</code>. <code>readonly</code> blocks assignment at compile time only. Nothing freezes the object at runtime, and it's shallow, like a Java <code>final</code> field holding a mutable list.</p><p><code>a?.b</code> short-circuits to <code>undefined</code> when <code>a</code> is <code>null</code> or <code>undefined</code>. <code>??</code> supplies a default only for <code>null</code> or <code>undefined</code>. <code>||</code> supplies it for any falsy value: <code>0</code>, <code>\"\"</code>, <code>false</code>, <code>NaN</code>. That's how a legitimate zero turns into a default.</p>",
          code: `interface WorkOrder {
  readonly id: string;
  title: string;
  assignee?: { name: string };
  estimateHours?: number;
}

const who = wo.assignee?.name ?? "Unassigned";

const h1 = wo.estimateHours || 8; // 0 becomes 8: bug
const h2 = wo.estimateHours ?? 8; // 0 stays 0

wo.id = "WO-2";
// error: Cannot assign to 'id' because it is a
// read-only property.`,
          lang: "ts"
        },
        {
          h: "One number type: a 64-bit double",
          body: "<p><code>number</code> is an IEEE 754 double, like Java's <code>double</code>. There is no <code>int</code> or <code>long</code>. Integers are exact only up to <code>Number.MAX_SAFE_INTEGER</code> (2^53 - 1); beyond that, neighbouring integers collapse into one value. <code>bigint</code> (literal <code>123n</code>) is an exact integer of any size, but it can't be mixed with <code>number</code> in arithmetic, and <code>JSON.stringify</code> throws on it.</p><p>There is no <code>BigDecimal</code>. For money, store integer cents or use a decimal library such as decimal.js. On the database side, node-postgres returns <code>bigint</code> and <code>numeric</code> columns as strings by default, because converting them to <code>number</code> could silently change the value.</p>",
          code: `0.1 + 0.2 === 0.3;            // false
Number.MAX_SAFE_INTEGER;      // 9007199254740991
9007199254740993;             // evaluates to 9007199254740992
const id = 9007199254740993n; // bigint: exact
id + 1;                       // error: can't mix bigint, number
id + 1n;                      // 9007199254740994n
JSON.stringify({ id });       // TypeError at runtime`,
          lang: "ts",
          tip: "<p>Gotcha: a <code>bigint</code> primary key arrives as <code>\"42\"</code>, so <code>row.id === 42</code> is always false. Decide once how IDs are typed and convert them in the data layer.</p>"
        }
      ],
      quiz: [
        {
          id: "ts-1-q1",
          type: "mcq",
          q: "<p>The API sends <code>qty</code> as a string. What is <code>next</code> at runtime?</p>",
          code: `interface WorkOrder {
  id: number;
  qty: number;
}

const body = '{"id": 7, "qty": "3"}';
const wo: WorkOrder = JSON.parse(body);
const next = wo.qty + 1;`,
          lang: "ts",
          options: [
            "The string `\"31\"`",
            "The number `4`",
            "A compile error on the `JSON.parse` line",
            "A `TypeError` thrown by `JSON.parse`"
          ],
          answer: 0,
          explain: "<p><code>JSON.parse</code> returns <code>any</code>, so the annotation is accepted without a check, and the types are gone by runtime anyway. <code>wo.qty</code> really holds <code>\"3\"</code>, and <code>+</code> with a string operand concatenates. The compiler still types <code>next</code> as <code>number</code>, so the wrong value travels on silently. Parse into <code>unknown</code> and validate.</p>"
        },
        {
          id: "ts-1-q2",
          type: "bug",
          q: "<p>A reorder rule may set <code>minQty</code> to <code>0</code> to switch reordering off. Rules with <code>0</code> keep reordering at 5. Tap the line to change.</p>",
          code: `interface ReorderRule {
  minQty?: number;
}

function effectiveMin(rule: ReorderRule): number {
  const min = rule.minQty || 5;
  return min;
}`,
          lang: "ts",
          answer: 5,
          explain: "<p><code>||</code> falls back on any falsy value, and <code>0</code> is falsy, so an explicit zero becomes 5. Write <code>rule.minQty ?? 5</code>. <code>??</code> falls back only on <code>null</code> or <code>undefined</code>, which is exactly what an absent optional property is.</p>"
        },
        {
          id: "ts-1-q3",
          type: "mcq",
          q: "<p><code>Truck</code> never mentions <code>Asset</code>. What does <code>tsc</code> do with the last line?</p>",
          code: `interface Asset {
  tag: string;
  location: string;
}
function register(a: Asset): void {}

class Truck {
  constructor(
    public tag: string,
    public location: string,
    public axles: number,
  ) {}
}

register(new Truck("T-114", "Hangar 3", 3));`,
          lang: "ts",
          options: [
            "Accepts it: `Truck` has every member `Asset` needs",

          body: "<p>Both can name an object shape, and for plain DTOs they're interchangeable. An <code>interface</code> describes objects only, can <code>extends</code> other interfaces, and merges with any other declaration of the same name in scope. A <code>type</code> alias can name any type: a union, a tuple, a primitive, an intersection, or a type computed from another.</p><p>A class can <code>implements</code> either, as long as it's an object type. Many teams use <code>interface</code> for object shapes and <code>type</code> for everything else. Pick one convention and let the linter hold it.</p>",

      cards: [
        {
          h: "Generics look familiar",
          body: "<p>Syntax and intent match Java: type parameters on functions, classes and interfaces, with bounds written <code>&lt;T extends HasId&gt;</code>. The bound is structural, so any type with an <code>id: string</code> qualifies. Several bounds combine as an intersection: <code>&lt;T extends HasId &amp; Auditable&gt;</code>.</p><p>Inference is stronger than Java's. <code>first(orders)</code> infers <code>T</code> from the argument, and you rarely write type arguments at call sites. There are no wildcards: <code>? extends</code> and <code>? super</code> have no equivalent, because the compiler works out variance structurally from how <code>T</code> is used.</p>",

          h: "`keyof`, indexed access and mapped types",
          body: "<p>Types can be computed from other types. <code>keyof T</code> is the union of <code>T</code>'s property names. <code>T[K]</code> is the type of property <code>K</code>. A mapped type <code>{ [K in keyof T]: ... }</code> builds a new object type by transforming each property.</p><p>Together they let a signature relate its arguments: <code>K extends keyof T</code> restricts <code>key</code> to real property names, and <code>T[K]</code> gives the matching return type. The built-in utility types are nothing more than these constructs, declared in the standard library's <code>.d.ts</code> files.</p>",

        {
          h: "Utility types for DTOs",

          lang: "ts",
          tip: "<p>Gotcha: <code>Omit</code> doesn't check its keys. <code>Omit&lt;WorkOrder, \"createdOn\"&gt;</code> compiles and removes nothing. <code>Pick</code> does check, because its key parameter is constrained to <code>keyof T</code>.</p>"

        {
          h: "Typing API responses honestly",
          body: "<p>A generic envelope such as <code>Page&lt;T&gt;</code> types every paged endpoint once. A function like <code>getJson&lt;T&gt;()</code>, though, can only return what it received: the caller picks <code>T</code> and nothing verifies it. Treat it as a claim about the server, and validate at the boundary when the data matters.</p><p>On the Nest side, DTOs must be classes, because <code>ValidationPipe</code> needs a runtime class carrying validation decorators. <code>Partial&lt;CreateDto&gt;</code> is erased and carries neither. <code>PartialType</code>, <code>PickType</code> and <code>OmitType</code> from <code>@nestjs/mapped-types</code> (or <code>@nestjs/swagger</code>) generate real classes and copy the validation metadata across.</p>",

        {

          body: "<p>A Java cast compiles to a <code>checkcast</code> instruction and throws <code>ClassCastException</code> on the spot when it's wrong. A TypeScript assertion emits nothing. <code>raw as WorkOrder</code> tells the compiler to believe you, and the error surfaces later and somewhere else, as a <code>TypeError</code> or as bad data in the database.</p><p>The compiler refuses assertions between types that don't overlap, but <code>as unknown as X</code> bypasses even that. The non-null assertion <code>x!</code> is the same kind of promise about <code>null</code>. Prefer narrowing or validation, and in review treat each <code>as</code> as a claim that needs a reason.</p>",

      title: "async/await and the event loop",

      summary: "Predict when async code runs on Node's single thread, run independent I/O concurrently on purpose, and avoid the floating-promise and blocking bugs that stall a service.",
      cards: [
        {
          h: "One thread runs all your JavaScript",
          body: "<p>Spring MVC on Tomcat gives each request a worker thread from a pool (200 by default in Spring Boot). A JDBC call blocks that thread while the OS runs others.</p><p>Node runs all your JavaScript on one thread. A database driver writes the query to a socket and returns at once. When the reply arrives, the OS notifies libuv, Node's I/O layer, which queues a callback. The event loop takes queued callbacks one at a time and runs each to completion. A request waiting on Postgres holds no thread; it costs a pending promise and the closure that will resume it. One process can keep thousands of slow requests open, and only one piece of your code ever runs at a time.</p>",
          tip: "<p>The closer Java analogy is Spring WebFlux on Netty, where blocking an event-loop thread is a bug. The difference: Netty runs several event-loop threads, and Node runs one per process.</p>"
        },
        {
          h: "`Promise` vs `CompletableFuture`",
          body: "<p>A <code>Promise&lt;T&gt;</code> settles once, as fulfilled or rejected. <code>.then</code> covers both <code>thenApply</code> and <code>thenCompose</code>: if the callback returns a promise, it's flattened. <code>.catch</code> plays the role of <code>exceptionally</code>. Differences that matter:</p><ul><li>A promise is eager: the work has already started when you hold it.</li><li>There's no <code>join()</code>. You reach the value only through a callback or <code>await</code>.</li><li>No cancellation. APIs such as <code>fetch</code> accept an <code>AbortSignal</code> instead.</li><li>Callbacks never run on another thread. They're queued as microtasks on the same one.</li></ul>",

}`

              label: "TypeScript",
              lang: "ts",

  }

          h: "What `async` and `await` actually do",
          body: "<p><code>async</code> makes a function return a <code>Promise</code> whatever its body does: <code>return x</code> fulfills it, <code>throw</code> rejects it. <code>await p</code> suspends the function and hands control back to the event loop. When <code>p</code> settles, the rest of the function is queued as a microtask and resumes with its locals intact. It behaves as if the remainder were written inside <code>p.then(...)</code>.</p><p>Microtasks (promise continuations) run as soon as the current callback finishes, and the queue drains completely before the loop moves on to timers and I/O callbacks.</p>",

// Sequential: about N x latency

          h: "CPU-bound work stops everything",
          body: "<p>Because one thread runs all your JavaScript, a handler that computes for two seconds blocks every other request, timer and database callback for two seconds. Nothing preempts it, and no other thread picks up the waiting work. In Tomcat one slow request ties up one thread; here it stalls the whole process.</p><p>Common culprits: aggregating large arrays in memory, <code>JSON.parse</code> on huge payloads, synchronous APIs such as <code>readFileSync</code> or <code>pbkdf2Sync</code>, and catastrophic regexes. libuv has a small thread pool for file system, DNS and some crypto work, but your JavaScript never runs there.</p><p>Fixes: push aggregation into SQL, move heavy work to <code>worker_threads</code> or a separate job worker, or process it in chunks.</p>",

          body: "<p>Array methods look like Streams but run differently. Each call processes the whole array immediately and allocates a new array: no laziness, no fusion, no parallel mode. <code>find</code>, <code>some</code> and <code>every</code> do stop early. <code>reduce</code> is the general fold. <code>sort()</code> mutates in place and, without a comparator, compares as strings, so <code>[10, 9, 1].sort()</code> gives <code>[1, 10, 9]</code>.</p><p><code>forEach</code> ignores whatever its callback returns. Hand it an <code>async</code> callback and it starts every call, drops the promises and returns at once. Nothing waits and nothing catches. Use <code>for...of</code> with <code>await</code> for sequential work, or <code>Promise.all(items.map(...))</code> for concurrent work.</p>",

          h: "Files are modules; imports are paths",
          body: "<p>In Java, <code>import</code> names a class, and the class loader finds it on the classpath by its fully qualified name. In TypeScript every file is a module with its own scope, and an import names a file: a relative path for your code, or a package name resolved from <code>node_modules</code>. Nothing is visible outside a file unless it's exported.</p><p>A module runs once, on first import, and the result is cached, so module-level variables are shared singletons. <code>export class X</code> is a named export, imported with braces. <code>export default</code> is imported under any name the importer chooses, which is why many teams avoid it. Vue single-file components are the exception: a <code>.vue</code> file's component is its default export.</p>",

          h: "Semver ranges and the lockfile",
          body: "<p>npm writes ranges by default. <code>^1.4.2</code> accepts any <code>1.x.y</code> from 1.4.2 up. <code>~1.4.2</code> accepts only <code>1.4.x</code> patches. Below 1.0, <code>^</code> is tighter: <code>^0.3.1</code> stops before 0.4.0. Transitive dependencies use ranges too, so the same <code>package.json</code> can resolve to different trees on different days.</p><p><code>package-lock.json</code> records the exact resolved tree: every transitive package, its version and an integrity hash. Commit it. <code>npm ci</code> installs exactly that tree, deletes <code>node_modules</code> first, never writes the lockfile, and fails if the lockfile and <code>package.json</code> disagree. Maven gets reproducibility from exact versions in the pom; npm gets it from the lockfile.</p>",
          tip: "<p>Use <code>npm ci</code> in CI and Dockerfiles. Plain <code>npm install</code> may rewrite the lockfile, and a lockfile change in a pull request deserves the same review as any other dependency change.</p>"
        },
        {
          h: "How `node_modules` resolution works",
          body: "<p>For a bare specifier like <code>\"pg\"</code>, Node looks in the <code>node_modules</code> folder beside the importing file, then in each parent directory up to the root, and takes the first match. The package's own <code>package.json</code> (<code>exports</code> or <code>main</code>) picks the entry file.</p><p>npm hoists packages to the top-level <code>node_modules</code> where it can. When two packages need incompatible versions of one dependency, a copy nests inside its dependent, and both versions load. Maven's dependency mediation picks a single version for the whole classpath instead.</p><p><code>npx tsc</code> runs a binary from <code>node_modules/.bin</code>, and offers to download the package if it isn't installed.</p>",

      summary: "Explain how a Nest constructor parameter becomes an injected instance, and fix the interface, generic and circular-import cases where that mechanism fails.",
      cards: [
        {
          h: "A decorator is a function that runs once",
          body: "<p>A Java annotation is inert data in the class file. Nothing happens until a framework reads it through reflection, which is what Spring's classpath scan does at startup.</p><p>A TypeScript decorator is a function call. <code>@Controller(\"orders\")</code> calls the factory <code>Controller(\"orders\")</code>, which returns the decorator, and the compiled code then calls that with the class. Both happen once, when the file is first imported and the <code>class</code> statement executes, never per request or per instance. A decorator can wrap or replace what it decorates, but framework decorators mostly record metadata for later, which makes them behave much like annotations.</p>",
          bridge: {
            left: {
              label: "Java annotation",
              lang: "java",
              code: `@Retention(RetentionPolicy.RUNTIME)
@Target(ElementType.TYPE)
public @interface Audited {
  String value();
}

@Audited("inspections")
public class InspectionService {}

// Inert until someone asks:
InspectionService.class.getAnnotation(Audited.class);`
            },
            right: {
              label: "TypeScript decorator",
              lang: "ts",
              code: `import "reflect-metadata";

function Audited(area: string): ClassDecorator {
  // Runs once, when the class statement executes
  return (target) => {
    Reflect.defineMetadata("audit:area", area, target);
  };
}

@Audited("inspections")
export class InspectionService {}

// Read back later, like getAnnotation()
Reflect.getMetadata("audit:area", InspectionService);`
            }
          }
        },
        {
          h: "What `emitDecoratorMetadata` adds",
          body: "<p>With <code>experimentalDecorators</code> on, <code>tsc</code> compiles decorators into a call to a small <code>__decorate</code> helper. With <code>emitDecoratorMetadata</code> also on, it appends type information to that call as extra entries:</p><ul><li><code>design:type</code>: the type of a decorated property</li><li><code>design:paramtypes</code>: the parameter types of a decorated method, or of the constructor when the class is decorated</li><li><code>design:returntype</code>: the return type of a decorated method</li></ul><p><code>__metadata</code> calls <code>Reflect.metadata</code>, which comes from the <code>reflect-metadata</code> polyfill. If the polyfill isn't loaded, the helper quietly records nothing. Nest's packages import it for you.</p>",
          code: `// You write:
@Injectable()
export class OrdersService {
  constructor(
    private readonly repo: OrderRepository,
    private readonly clock: Clock,
  ) {}
}

// tsc emits (trimmed):
let OrdersService = class OrdersService {
  constructor(repo, clock) {
    this.repo = repo;
    this.clock = clock;
  }
};
OrdersService = __decorate([
  Injectable(),
  __metadata("design:paramtypes", [OrderRepository, Clock])
], OrdersService);`,
          lang: "ts"

        {
          h: "What survives into the metadata",
          body: "<p>The compiler has to turn each type into a runtime value, and only some types have one. A class becomes a reference to that class. <code>string</code>, <code>number</code> and <code>boolean</code> become <code>String</code>, <code>Number</code> and <code>Boolean</code>. Interfaces, object types and mixed unions have no runtime value, so they become <code>Object</code>. Type arguments are dropped: <code>Repository&lt;Order&gt;</code> becomes <code>Repository</code>.</p><p>Metadata is emitted only for declarations that carry a decorator. A class with constructor dependencies and no class decorator gets no <code>design:paramtypes</code> at all, and Nest has nothing to read. That's why <code>@Injectable()</code> matters even though it takes no arguments.</p>",
          code: `@Injectable()

    a: OrderRepository,    // OrderRepository

    c: Notifier,           // Object (interface)
    d: string,             // String
    e: "PDF" | "CSV",      // String
    f: Date | null,        // Object
  ) {}
}
// design:paramtypes =
//   [OrderRepository, Repository, Object, String, String, Object]`,

        },
        {
          h: "How Nest resolves a constructor",
          body: "<p>At startup Spring scans the classpath for <code>@Component</code> classes, reads constructor parameter types from the bytecode, and matches beans by type, including by interface.</p><p>Nest has no classpath to scan. <code>NestFactory.create(AppModule)</code> walks the module graph through each <code>@Module</code>'s <code>imports</code> and registers the listed providers, each under a token; for a class provider the token is the class itself. To build a provider, the injector reads its <code>design:paramtypes</code>, lets any <code>@Inject(token)</code> override a position, and looks each token up in the module's own providers and in providers exported by imported modules. Dependencies are built first, and by default each provider is a singleton.</p>",
          bridge: {
            left: {

public class InspectionService {

// Discovered by @ComponentScan`

              label: "NestJS",

              code: `@Injectable()
export class InspectionService {
  // design:paramtypes -> [AssetRepository]

}

@Module({
  // No scanning: every provider is listed
  providers: [InspectionService, AssetRepository],
})
export class InspectionModule {}`

          h: "Interfaces can't be injection tokens",
          body: "<p>Spring can inject by interface because <code>WorkOrderRepository.class</code> exists at runtime. In TypeScript the interface is erased, the metadata says <code>Object</code>, and startup fails with <em>Nest can't resolve dependencies of the InspectionService (?)</em>.</p><p>Give the dependency a token that exists at runtime: a <code>Symbol</code> or string constant, bound in the module and named with <code>@Inject</code>. Or make the contract an <code>abstract class</code>. It compiles to a real class, so it can be its own token and no <code>@Inject</code> is needed.</p>",
          code: `// notifier.ts

        {
          h: "Circular imports and `forwardRef`",
          body: "<p>Metadata is evaluated when the class is defined, so it captures whatever the imported name holds at that moment. Suppose <code>orders.service.ts</code> and <code>assets.service.ts</code> import each other. Node starts loading orders, which requires assets, which requires orders and gets its half-finished exports. In the CommonJS output Nest projects compile to, <code>OrdersService</code> is still <code>undefined</code> there, so <code>AssetsService</code> records <code>[undefined]</code> and Nest can't resolve index [0].</p><p><code>forwardRef(() =&gt; OrdersService)</code> defers the read: Nest calls the arrow during bootstrap, after both files have loaded. Nest's docs show it on both sides of the relationship. The better fix is usually to break the cycle by moving the shared logic into a third provider.</p>",

          lang: "ts",
          tip: "<p>If a build emits native ES modules instead, the same cycle fails harder: evaluating the metadata throws <code>ReferenceError: Cannot access 'OrdersService' before initialization</code> while the file loads, before Nest is involved.</p>"

        {
          h: "Standard decorators vs the legacy kind",
          body: "<p>TypeScript 5.0 added the TC39 standard decorators, used whenever <code>experimentalDecorators</code> is off. They receive <code>(value, context)</code> in place of <code>(target, key, descriptor)</code>, and they can't decorate parameters. <code>emitDecoratorMetadata</code> works only in legacy mode; <code>tsc</code> refuses it otherwise. The standard has its own metadata object, but the compiler puts no type information in it.</p><p>Nest depends on parameter decorators (<code>@Body()</code>, <code>@Param()</code>, <code>@Inject()</code>) and on <code>design:paramtypes</code>, so Nest projects keep both legacy flags on. The two modes are incompatible: a decorator written for one doesn't work under the other. Vue 3 with <code>&lt;script setup&gt;</code> uses no decorators at all.</p>",

              label: "Legacy (Nest)",

  target: object,
  key: string | symbol,
  descriptor: PropertyDescriptor,
) {

}`

) {

    return method.apply(this, args);
  };
}`

      cards: [

          h: "Scaffold with the Nest CLI",
          body: "<p>The CLI creates a project with TypeScript, Jest, ESLint and a <code>main.ts</code> already wired. <code>nest g resource</code> generates a feature folder: module, controller, service, create/update DTOs and an entity stub. It asks for a transport (pick REST API) and whether to generate CRUD entry points, then adds the new module to <code>AppModule</code>'s <code>imports</code> for you.</p><p><code>start:dev</code> runs <code>nest start --watch</code>: the compiler writes JavaScript to <code>dist/</code> and the process restarts on change. There is no fat JAR; production runs <code>node dist/main.js</code>.</p>",

          h: "`@Module`: the unit of wiring",
          body: "<p><code>providers</code> registers classes in this module's injector; each becomes a singleton keyed by its class. <code>controllers</code> are instantiated and their routes registered. <code>imports</code> brings in other modules, which makes their <em>exported</em> providers injectable here. <code>exports</code> is the module's public API: a subset of its own providers, or imported modules it re-exports.</p><p>Modules are singletons too. If three modules import <code>AssetsModule</code>, all three get the same <code>AssetsService</code> instance.</p>",

          h: "Encapsulation: why you see 'can't resolve dependencies'",
          body: "<p>Spring has one flat <code>ApplicationContext</code>: any bean can inject any other. Nest keeps a separate provider scope per module. To resolve a constructor parameter of <code>WorkOrdersService</code>, Nest looks in three places: <code>WorkOrdersModule</code>'s own providers, the exports of modules it imports, and global modules. Nothing else is visible.</p><p>When the lookup fails, bootstrap stops with an error like <em>Nest can't resolve dependencies of the WorkOrdersService (?). Please make sure that the argument AssetsService at index [0] is available in the WorkOrdersModule context.</em> The fix is nearly always two edits: export the provider from its home module, and import that module where you use it.</p>",

      summary: "Explain how Nest resolves constructor parameters, pick the right scope, and register custom, token-based and dynamic providers.",
      cards: [
        {
          h: "How Nest knows what to inject: `design:paramtypes`",
          body: "<p>TypeScript types are erased at runtime, so where does Nest learn that the constructor wants an <code>AssetsService</code>? With <code>emitDecoratorMetadata</code> on, the compiler adds a <code>design:paramtypes</code> entry to every class that carries a decorator, listing each constructor parameter's type as a runtime value: the class constructor function itself. The <code>reflect-metadata</code> polyfill stores it.</p><p>At bootstrap Nest reads that array and uses each entry as a token to look up. <code>@Injectable()</code> matters because it gives the class a decorator, which triggers the metadata. Only values that exist at runtime survive: a class does, while an interface or type alias is recorded as <code>Object</code>.</p>",
          code: `// tsconfig.json: "experimentalDecorators": true,
//                "emitDecoratorMetadata": true
@Injectable()
export class WorkOrdersService {
  constructor(
    private readonly assets: AssetsService,
    private readonly clock: Clock,
  ) {}
}

// Roughly what tsc emits:
WorkOrdersService = __decorate([
  Injectable(),
  __metadata('design:paramtypes', [AssetsService, Clock]),
], WorkOrdersService);`,
          lang: "ts",
          tip: "<p>Gotcha: Nest relies on TypeScript's legacy (experimental) decorators. The newer standard decorators emit no parameter metadata, so leave <code>experimentalDecorators</code> on in a Nest project.</p>"
        },
        {
          h: "Scopes: DEFAULT, REQUEST, TRANSIENT",
          body: "<p><strong>DEFAULT</strong>: one instance for the app, built at bootstrap, like a Spring singleton. <strong>REQUEST</strong>: a new instance per incoming request, discarded afterwards. <strong>TRANSIENT</strong>: every consumer gets its own instance, created when that consumer is built, similar to Spring's prototype scope.</p><p>Request scope bubbles up. If <code>WorkOrdersService</code> injects <code>RequestMeta</code>, the service becomes request-scoped too, and so does the controller that injects the service. Nest rebuilds that whole chain for each request. Spring avoids this with scoped proxies; Nest has no proxy, so the consumers themselves must be recreated.</p>",
          code: `import { Inject, Injectable, Scope } from '@nestjs/common';
import { REQUEST } from '@nestjs/core';
import { Request } from 'express';

@Injectable({ scope: Scope.REQUEST })
export class RequestMeta {
  constructor(@Inject(REQUEST) private readonly req: Request) {}

  get requestId(): string | undefined {
    return this.req.header('x-request-id');
  }
}`,
          lang: "ts",
          tip: "<p>On the job: request scope costs a partial DI graph per request. For per-request data such as the user or a correlation id, pass values as arguments or use <code>AsyncLocalStorage</code> (covered in nest-10).</p>"
        },
        {
          h: "Custom providers: a token plus a recipe",
          body: "<p>The shorthand <code>providers: [X]</code> means <code>{ provide: X, useClass: X }</code>. The long form separates the token (what consumers ask for) from the recipe (how to build it).</p><ul><li><code>useValue</code>: a ready-made object. Constants, config, test doubles.</li><li><code>useClass</code>: Nest instantiates this class for the token. Handy for choosing an implementation.</li><li><code>useFactory</code>: Nest calls your function. A plain function has no decorator metadata, so its parameters come from <code>inject</code>, in order. The factory may be async; Nest awaits it before building anything that depends on it.</li><li><code>useExisting</code>: an alias. Both tokens resolve to the same instance.</li></ul><p><code>useFactory</code> is the closest thing to a Spring <code>@Bean</code> method.</p>",
          code: `@Module({
  providers: [
    { provide: CLOCK, useValue: { now: () => new Date() } },
    {
      provide: StorageService,
      useClass: process.env.NODE_ENV === 'test'
        ? InMemoryStorage
        : S3Storage,
    },
    {
      provide: REPORT_CLIENT,
      useFactory: async (config: ConfigService) => {
        const url = config.getOrThrow<string>('REPORT_URL');
        const client = new ReportClient(url);
        await client.connect();
        return client;
      },
      inject: [ConfigService],
    },
    { provide: 'LegacyStorage', useExisting: StorageService },
  ],
})
export class WorkOrdersModule {}`,
          lang: "ts"
        },
        {
          h: "Injecting an interface: tokens and `@Inject`",
          body: "<p>Spring resolves an interface-typed parameter by type because Java interfaces exist at runtime. A TypeScript interface is gone after compilation, so its <code>design:paramtypes</code> entry is <code>Object</code> and Nest can't find a provider for it.</p><p>Bind the implementation to an explicit token, a string or (safer against name collisions) a <code>Symbol</code>, and point the parameter at it with <code>@Inject(TOKEN)</code>. The <code>: Notifier</code> annotation then only serves the compiler. An abstract class also works as a token without <code>@Inject</code>, because it compiles to a real runtime class.</p>",
          bridge: {
            left: { label: "Spring", lang: "java", code: `public interface Notifier {
  void send(Message m);
}

@Service
class EmailNotifier implements Notifier { /* ... */ }

@Service
class WorkOrderService {
  // resolved by type: the interface exists at runtime
  WorkOrderService(Notifier notifier) { /* ... */ }
}` },
            right: { label: "NestJS", lang: "ts", code: `export interface Notifier {
  send(m: Message): Promise<void>;
}
export const NOTIFIER = Symbol('NOTIFIER');

// in the module
providers: [{ provide: NOTIFIER, useClass: EmailNotifier }],

@Injectable()
export class WorkOrdersService {
  constructor(
    @Inject(NOTIFIER) private readonly notifier: Notifier,
  ) {}
}` }
          }

        {
          h: "Circular dependencies and `forwardRef`",
          body: "<p>When two files import each other, the ES module loader has to hand one of them a half-initialized module. At the moment the decorator metadata is evaluated, one class reference is still <code>undefined</code>, and Nest reports an unresolvable dependency at that index. <code>forwardRef(() =&gt; AssetsService)</code> wraps the reference in a function Nest calls later, after both files have finished loading. Modules that import each other need the same wrapper in <code>imports</code>.</p><p>It fixes the symptom. The design smell remains: two services that need each other usually hide a third concern. Extract the shared logic into its own provider, or have one side publish an event the other listens to.</p>",
          code: `@Injectable()
export class WorkOrdersService {
  constructor(
    @Inject(forwardRef(() => AssetsService))
    private readonly assets: AssetsService,
  ) {}
}
// AssetsService does the same for WorkOrdersService.

@Module({
  imports: [forwardRef(() => AssetsModule)],
})
export class WorkOrdersModule {}`,
          lang: "ts",
          tip: "<p>Gotcha: with <code>forwardRef</code> the order in which the two constructors run is not guaranteed. Don't call the other service from a constructor.</p>"
        },
        {
          h: "Dynamic and global modules",
          body: "<p>A static <code>@Module</code> fixes its providers when the class is decorated. A dynamic module is a plain <code>DynamicModule</code> object returned by a static method, so the caller can pass configuration in. Conventions:</p><ul><li><code>forRoot(opts)</code>: configure once, in the root module.</li><li><code>forRootAsync({ imports, inject, useFactory })</code>: same, with options built by a factory that can inject other providers such as <code>ConfigService</code>.</li><li><code>forFeature(...)</code>: per-module additions on top of the root setup, e.g. <code>TypeOrmModule.forFeature([WorkOrder])</code> adds repositories.</li></ul><p><code>@Global()</code> on the class, or <code>global: true</code> in the returned object, makes its exports injectable everywhere without importing. Keep that for real cross-cutting infrastructure such as config.</p>",
          code: `@Module({})
export class ReportingModule {
  static forRoot(opts: ReportingOptions): DynamicModule {
    return {
      module: ReportingModule,
      providers: [
        { provide: REPORTING_OPTIONS, useValue: opts },
        ReportingService,
      ],
      exports: [ReportingService],
    };
  }
}

// app.module.ts
imports: [ReportingModule.forRoot({ format: 'pdf' })]`,

        }

      cards: [

          body: "<p><code>@Get</code>, <code>@Post</code>, <code>@Put</code>, <code>@Patch</code> and <code>@Delete</code> take a path relative to the controller's. <code>@Param('id')</code>, <code>@Query('status')</code>, <code>@Body()</code> and <code>@Headers('x-site')</code> pull values off the underlying Express request. Leave out the name to get the whole object: <code>@Query()</code> gives every query parameter.</p><p>Everything from the URL and headers arrives as a <strong>string</strong> until a pipe converts it (next station). The type annotation <code>id: number</code> converts nothing on its own.</p><p>Status codes: 200 for every method except POST, which defaults to 201. <code>@HttpCode(204)</code> plays the role of <code>@ResponseStatus</code>.</p>",

        {
          h: "What happens to the return value",
          body: "<p>Nest wraps your method and handles the result:</p><ul><li>An object or array is passed through <code>JSON.stringify</code> and sent as <code>application/json</code>.</li><li>A <code>Promise</code> is awaited; an RxJS <code>Observable</code> is subscribed and its last value sent.</li><li>A primitive such as a string is sent as-is, without JSON encoding.</li></ul><p>There is no Jackson. <code>JSON.stringify</code> decides the shape: a <code>Date</code> becomes an ISO string, a <code>Map</code> becomes <code>{}</code>, getters defined on a class are skipped, and a <code>toJSON()</code> method wins. For <code>@JsonIgnore</code>-style control, <code>ClassSerializerInterceptor</code> applies class-transformer's <code>@Exclude()</code> and <code>@Expose()</code>.</p><p>There's no <code>ResponseEntity</code> either: use <code>@HttpCode</code>, <code>@Header('Cache-Control', 'no-store')</code> and <code>@Redirect</code>.</p>"
        },
        {
          h: "Why to avoid `@Req()` and `@Res()`",
          body: "<p><code>@Req()</code> hands you the raw Express <code>Request</code>. It works, at a cost: the handler now depends on Express types (a switch to Fastify breaks it), the values you dig out never pass through parameter pipes, so nothing validates or converts them, and unit tests must fake a whole request object. Prefer the specific decorators, or write a custom parameter decorator such as <code>@CurrentUser()</code> (nest-8) when you need something the built-ins don't expose.</p>",
          tip: "<p>Gotcha: injecting <code>@Res()</code> switches the route to library-specific mode. Nest stops sending your return value, and the request hangs until you call <code>res.json()</code> yourself. If you only need to set a header or cookie, use <code>@Res({ passthrough: true })</code>.</p>"
        },
        {
          h: "Route order: `:id` swallows `search`",
          body: "<p>Nest registers a controller's routes with Express in the order the methods are declared, and Express runs the first route whose pattern matches. <code>GET /work-orders/search</code> matches <code>:id</code> first, with <code>id = 'search'</code>. With <code>ParseUUIDPipe</code> the client gets a 400; without it, your lookup runs with <code>'search'</code> and Postgres rejects it as an invalid uuid.</p><p>Fix: declare static paths before parameterized ones. Spring ranks literal path segments above path variables when choosing a handler, so this bug can't happen there, which is why it catches Spring developers.</p>",
          code: `@Controller('work-orders')
export class WorkOrdersController {
  @Get(':id')
  findOne(@Param('id', ParseUUIDPipe) id: string) {}

  @Get('search') // never reached: ':id' matched first
  search(@Query('q') q: string) {}
}`,
          lang: "ts"
        },
        {
          h: "DTOs are classes because classes survive compilation",
          body: "<p>An interface would type-check the handler just as well, but interfaces are erased. Because <code>@Post()</code> decorates the method, the compiler emits <code>design:paramtypes</code> for it, recording <code>CreateWorkOrderDto</code> as a runtime value. <code>ValidationPipe</code> reads that value (the <em>metatype</em>) to instantiate and validate the body. With an interface the metatype is <code>Object</code>, and validation silently does nothing.</p><p><code>dto: CreateWorkOrderDto</code> is a compile-time claim. At runtime <code>dto</code> is whatever <code>JSON.parse</code> produced, extra fields included, until a pipe checks it.</p>",
          code: `// dto/create-work-order.dto.ts
export class CreateWorkOrderDto {
  title: string;
  assetId: string;
  priority?: number;
}`,
          lang: "ts",
          tip: "<p>Gotcha: Jackson binds only the fields your class declares. Here nothing is bound, so <code>repo.save(dto)</code> on an unvalidated body would write any column-named field the client sends, <code>status</code> included.</p>"
        },
        {
          h: "Built-in HTTP exceptions",
          body: "<p>Throw a subclass of <code>HttpException</code> and Nest's built-in exception filter writes the response: <code>BadRequestException</code> 400, <code>UnauthorizedException</code> 401, <code>ForbiddenException</code> 403, <code>NotFoundException</code> 404, <code>ConflictException</code> 409, <code>UnprocessableEntityException</code> 422. The body for the code below is <code>{\"statusCode\":404,\"message\":\"Work order … not found\",\"error\":\"Not Found\"}</code>.</p><p>Anything that isn't an <code>HttpException</code> (a <code>TypeError</code>, a database driver error) becomes <code>{\"statusCode\":500,\"message\":\"Internal server error\"}</code>; the details are logged, never sent. This is the counterpart of throwing <code>ResponseStatusException</code>.</p>",
          code: `async findOne(id: string): Promise<WorkOrder> {
  const wo = await this.repo.findOneBy({ id });
  if (!wo) {
    throw new NotFoundException(\`Work order \${id} not found\`);
  }
  return wo;
}`,
          lang: "ts",
          tip: "<p>On the job: throwing HTTP exceptions from services couples the domain to HTTP. Many teams accept that; others throw domain errors and map them in one exception filter (nest-10). Check your team's convention.</p>"
        },
        {
          h: "Global prefix and versioning",
          body: "<p><code>setGlobalPrefix('api')</code> prepends a segment to every route, a little like <code>server.servlet.context-path</code>; <code>exclude</code> keeps chosen routes, such as a health check, at the root. <code>enableVersioning</code> with <code>VersioningType.URI</code> inserts <code>v{version}</code> after the prefix, taking the version from the controller (or a method-level <code>@Version()</code>). Header, media-type and custom versioning are the other types.</p>",
          code: `// main.ts
app.setGlobalPrefix('api', { exclude: ['health'] });
app.enableVersioning({ type: VersioningType.URI });

// work-orders.controller.ts
@Controller({ path: 'work-orders', version: '1' })
export class WorkOrdersController {
  @Get(':id') // GET /api/v1/work-orders/:id
  findOne(@Param('id', ParseUUIDPipe) id: string) {}
}`,
          lang: "ts",
          tip: "<p>Gotcha: both calls live in <code>main.ts</code>. An e2e test that builds the app on its own doesn't get them unless it applies them again (nest-9).</p>"
        }
